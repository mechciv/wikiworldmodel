  - { from: temp-months, to: biome, now: built, by: model:earth/biome-from-climate, how: "The warmest and coldest month class the climate." }
  - { from: rain-months, to: biome, now: built, by: model:earth/biome-from-climate, how: "Aridity sets desert, steppe and forest apart." }
