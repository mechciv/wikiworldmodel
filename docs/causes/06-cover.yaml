  - { from: rain-months, to: growth, now: inside, how: "Water limits growth wherever it is short." }
  - { from: co2, to: growth, now: inside, how: "With more CO₂ a plant grows on less water." }
  - { from: soil, to: growth, now: missing, how: "Thin or poor soil holds growth back." }
