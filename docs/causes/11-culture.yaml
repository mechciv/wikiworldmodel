  - { from: migration, to: language-range, now: missing, how: "A language moves with its speakers." }
  - { from: farming-reach, to: language-range, now: missing, how: "Farmers' tongues spread with their fields, in several families." }
  - { from: states, to: language-range, now: missing, loop: empire-and-tongue, how: "Empires spread their tongues." }
  - { from: language-tree, to: likeness, now: missing, how: "Peoples of related speech tend to build, farm and keep animals alike." }
  - { from: language-range, to: likeness, now: missing, how: "Neighbours on the ground are alike too." }
  - { from: travel, to: likeness, now: missing, how: "Peoples in easy reach of each other borrow." }
  - { from: resources, to: technology, now: missing, how: "No bronze without tin and copper." }
  - { from: density, to: technology, now: missing, loop: more-minds, how: "More people make more inventions and lose fewer." }
  - { from: travel, to: technology, now: missing, loop: crafts-on-routes, how: "Crafts spread along the routes." }
  - { from: trade, to: technology, now: missing, loop: crafts-on-routes, how: "Goods carry the knowledge of their making." }
  - { from: states, to: writing, now: missing, how: "Writing follows the counting of goods and people." }
  - { from: trade, to: writing, now: missing, how: "Merchants keep accounts." }
  - { from: travel, to: beliefs, now: missing, how: "Beliefs travel the routes." }
  - { from: states, to: beliefs, now: missing, how: "Rulers adopt and impose." }
  - { from: writing, to: beliefs, now: missing, how: "Scripture carries a belief unchanged across distance." }
