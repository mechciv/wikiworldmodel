lane: people
title: People
about: How many people there were, and what moved their numbers.
nodes:
  - id: density
    label: People to the km²
    kind: settling
    what: "How many people lived on each piece of land."
    now: borrowed
    has: [field:earth/population, field:earth/world-population]
    note: "HYDE's grid from 10,000 BCE, drawn as the value: totals by today's provinces, shared over the land by rules. Held out, Angkor's region came out twelvefold low. Nothing before 10,000 BCE."
    best: "A field that settles towards what the land could feed since the way of life arrived, conditioned on censuses and surveys by their ground. HYDE and KK10 scored as rivals."
    gap: large
    seen: [texts, sites, others]
  - id: births-deaths
    label: Births, deaths and ages
    kind: at-once
    what: "How long people lived, how many children they had, and the ages of a household."
    now: stand-in
    has: [gen:people/settlement]
    note: "A household of five, which is a choice."
    best: "Model life tables by way of life: how many children, how many old."
    gap: small
    seen: [texts, sites]
  - id: disease
    label: Disease
    kind: settling
    what: "The standing burden of infection, and the plagues."
    now: none
    note: "Not in the world."
    best: "A burden from warmth, crowding and kept animals. Epidemics as dated shocks."
    gap: medium
    seen: [texts, dna]
  - id: shocks
    label: Plagues, famines and conquests
    kind: contingent
    what: "Dated events that cut or moved a people's numbers."
    now: none
    note: "The world has no such record yet: a sack or a plague is not in a city's people until a figure says so."
    best: "Dated events a settling node reads, each with a size its kind gives before any figure does. They are the experiments that test the people's model."
    gap: medium
    seen: [texts, sites]
  - id: migration
    label: Movements of people
    kind: spreading
    what: "Who moved where, and how many."
    now: records
    note: "The great dispersals as records. No flows between regions."
    best: "Flows from full land to open land along the ways of travel, with the great movements as records."
    gap: medium
    seen: [dna, texts, sites]
  - id: ancestry
    label: Who descended from whom
    kind: spreading
    what: "The ancestry of the people of a place at a time."
    now: none
    note: "Individuals with ancient genomes are named in the dispersal records. No field."
    best: "Ancestry through time and space, interpolated from ancient genomes (AADR, licence unchecked)."
    gap: medium
    seen: [dna]
edges:
