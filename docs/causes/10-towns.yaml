lane: towns
title: Settlements and exchange
about: Where people gathered, how they built, and what moved between them.
nodes:
  - id: surplus
    label: Food beyond the growers' own
    kind: at-once
    what: "What a region grew beyond what its growers ate."
    now: none
    note: "Not in the world."
    best: "Yield less the growers' needs: how many could live in towns and not farm."
    gap: medium
    seen: [texts]
  - id: travel
    label: How far a day's travel went
    kind: at-once
    what: "The time it took to cross land, river and sea with the means of the time."
    now: none
    note: "Not in the world."
    best: "Travel time by foot, pack animal, cart, river boat and sail, over the same cost of ground the spreading nodes use."
    gap: medium
    seen: [texts]
  - id: urban-share
    label: How many settlements, how large
    kind: at-once
    what: "The number of settlements of each size in a region, and the share of people in towns."
    now: borrowed
    has: [field:people/cities, field:people/cities-ancient, field:people/anthromes, gen:people/settlement]
    note: "Two lists give the large cities. Below their threshold, towns and villages are the generator's, from HYDE's classes."
    best: "How many settlements of each size a region's people and surplus make, fitted to surveyed regions."
    gap: medium
    seen: [sites, surveys, others]
  - id: town-sites
    label: Where towns stand
    kind: at-once
    what: "The places that draw a town: crossings, harbours, springs and strongholds."
    now: stand-in
    has: [gen:people/settlement, field:people/ancient-places]
    note: "A listed city stands at its place. Every other town is put down by the generator."
    best: "A chance of a town at each place from water, routes and the people about it. Pleiades' places and founding dates as presence, over the effort that found them."
    gap: medium
    seen: [sites, texts, surveys]
  - id: city-people
    label: A settlement's people
    kind: settling
    what: "How many people one settlement held through its life."
    now: scored
    has: [model:people/city-population]
    note: "Every figure is an observation of what it counts. Over 10,001 list figures held out one at a time, the 90% band holds 89.9%. Its prior for a region is HYDE's."
    best: "Its prior from the people of the land in place of HYDE's, and shocks."
    gap: small
    seen: [texts, sites, others]
  - id: town-density
    label: People to the hectare
    kind: at-once
    what: "How densely a settlement's people lived on its built ground."
    now: conditioned
    has: [model:people/density]
    note: "Pulled towards the settlements near in space and time whose ground was measured. How density grows with size is a choice."
    best: "The scaling fitted to measured towns, and pooled by likeness as well as by distance."
    gap: small
    seen: [sites]
  - id: town-form
    label: A settlement's form
    kind: at-once
    what: "Packed along lanes, or households set apart among fields and water."
    now: rule
    has: [model:people/settlement-form]
    note: "Compact or dispersed, on a tradition's word. It has no score."
    best: "Scored on measured plans, of which Mahendraparvata's is the first candidate."
    gap: medium
    seen: [sites, surveys]
  - id: town-growth
    label: Where a town built, through time
    kind: at-once
    what: "Which ground was built on at each time."
    now: rule
    has: [model:people/settlement-growth]
    note: "The ground ranked once by how soon it would be built on, and cut where the people's need is met."
    best: "Held to dated quarters where excavation gives them."
    gap: small
    seen: [sites]
  - id: houses
    label: Houses
    kind: at-once
    what: "What a house was made of, its plan and its size."
    now: stand-in
    has: [gen:people/settlement]
    note: "95 building traditions, hard-edged. They house 28% of people at 1 CE, 20% at 1000 and 56% at 1850. Everyone else gets one house for the whole Earth."
    best: "A field for each trait of a house: materials from the land, pooled by likeness, observed by 1,300 ethnographic societies (D-PLACE, licence unchecked)."
    gap: large
    seen: [sites, ethnography, texts]
  - id: institutions
    label: Temples, markets and halls
    kind: at-once
    what: "How many shrines, markets and public buildings a town of a size had."
    now: stand-in
    has: [gen:people/settlement]
    note: "Drawn where a tradition names them."
    best: "So many people to a shrine or a market, by tradition, held to mapped counts such as Angkor's 1,177 temples."
    gap: medium
    seen: [sites, texts]
  - id: wealth
    label: Rich and poor
    kind: at-once
    what: "How unequal a settlement's households were."
    now: none
    note: "Every house of a tradition is one size."
    best: "The spread of house sizes by way of life, as measured at dozens of sites (Kohler et al. 2017, unread)."
    gap: small
    seen: [sites]
  - id: routes
    label: Roads and routes
    kind: settling
    what: "The ways actually travelled between settlements."
    now: stand-in
    has: [field:earth/roman-roads, gen:people/settlement]
    note: "The Roman roads as a layer. A town's own routes are the generator's."
    best: "Least-cost ways between settlements over the ground and water of the time, with surveyed roads as evidence."
    gap: medium
    seen: [sites, surveys, texts]
  - id: trade
    label: Trade
    kind: at-once
    what: "What moved between settlements, and how much."
    now: records
    note: "Fourteen wrecks and the Silk Road's dated evidence, as records."
    best: "Flows between settlements by their size and the travel between them. Cargoes stay evidence."
    gap: small
    seen: [sites, texts]
  - id: resources
    label: Ores, stone, salt and timber
    kind: at-once
    what: "Where the materials people needed lay."
    now: none
    note: "Not in the world."
    best: "From the rock and the cover of each place, with mines as records."
    gap: small
    seen: [surveys, sites]
