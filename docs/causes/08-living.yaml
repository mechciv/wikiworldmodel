lane: living
title: Ways of living
about: Where people had reached, how they got their food, and how many the land could feed.
nodes:
  - id: humans
    label: Where people had reached
    kind: spreading
    what: "Which lands people had come to, and by when."
    now: records
    note: "The dispersals of Homo sapiens and their meetings with other humans as records, with rival pictures. No field says where people were before 10,000 BCE."
    best: "An arrival surface fitted to the dated sites, limited by the climate and the land bridges of each time."
    gap: large
    seen: [sites, dna, fossils]
  - id: domestication
    label: Where each crop and animal was first kept
    kind: contingent
    what: "The place and time each domesticate began."
    now: records
    note: "About twenty records with places and dates. They feed no model."
    best: "As it is: the beginnings are evidence. They are the origins the spreading nodes below start from."
    gap: small
    seen: [sites, dna]
  - id: crop-limits
    label: What each crop needs
    kind: at-once
    what: "The warmth, water and length of season each crop will grow in."
    now: stand-in
    has: [gen:people/settlement]
    note: "The generator picks crops by the climate's class alone."
    best: "Each crop's limits from the agronomy, set against each place's months."
    gap: medium
    seen: [surveys, sites]
  - id: farming-reach
    label: How far farming had spread
    kind: spreading
    what: "Whether each kind of farming had reached a place by a time."
    now: borrowed
    has: [field:people/land-use-assessment]
    note: "Experts' levels for 146 regions at ten times from 10,000 BP, the nearest time holding, with hard edges."
    best: "An arrival surface for each crop complex, fitted to radiocarbon first appearances (p3k14c, licence unchecked), and held out continent by continent."
    gap: large
    seen: [sites, pollen, others]
  - id: herding-reach
    label: How far herding had spread
    kind: spreading
    what: "Whether herds were kept at a place by a time."
    now: borrowed
    has: [field:people/land-use-assessment]
    note: "The same experts' levels, for pastoralism."
    best: "An arrival surface from where each animal was first kept, over grass."
    gap: large
    seen: [sites, others]
  - id: way-of-life
    label: How people lived off the land
    kind: at-once
    what: "The mix of foraging, herding, shifting and settled farming at a place."
    now: rule
    has: [model:people/lifeways, field:people/lifeways, field:people/anthromes]
    note: "HYDE's classes joined to the experts by rules of thumb. The two agree that farming was widespread in 17 of 49 regions at 2,000 BP. The arrow runs backwards: the way of life is read off HYDE's people and land use."
    best: "Shares of each way of life in a cell, from what had arrived and what the land favours, with the experts' levels as observations."
    gap: large
    seen: [sites, ethnography, texts]
  - id: intensity
    label: How hard the land was worked
    kind: settling
    what: "Fallows, ploughs, terraces, paddies and manure."
    now: none
    note: "Not in the world."
    best: "Steps of working the land harder, which follow the people's press on it and what had been invented."
    gap: medium
    seen: [sites, texts, ethnography]
  - id: water-works
    label: Water works
    kind: settling
    what: "Canals, ponds, reservoirs and terraces."
    now: stand-in
    has: [gen:people/settlement]
    note: "Drawn where a tradition's record names them, as the Khmer house's ponds are."
    best: "Works where rivers and relief allow them and the crop and the crowding ask for them."
    gap: medium
    seen: [sites, surveys, texts]
  - id: land-use
    label: Fields, pasture and cleared forest
    kind: at-once
    what: "How much of the land people farmed, grazed or cleared."
    now: borrowed
    has: [field:earth/cropland, field:earth/grazing-land, field:people/anthromes]
    note: "HYDE's series and classes: cropland to a person run back from 1960 and multiplied by its people."
    best: "Worked land from the people and their way of life, with pollen's record of clearing as evidence."
    gap: medium
    seen: [pollen, texts, surveys, others]
  - id: crops
    label: Crops and fields
    kind: at-once
    what: "Which crops stood in the fields, in what shares, and how the fields were laid."
    now: stand-in
    has: [gen:people/settlement]
    note: "Chosen in the generator by the climate's class. Seven farming traditions are written."
    best: "Shares of each crop from its limits and its arrival, and fields by tradition."
    gap: large
    seen: [sites, texts, ethnography]
  - id: farm-year
    label: The farming year
    kind: at-once
    what: "The months of sowing, growth, harvest and fallow."
    now: stand-in
    has: [gen:people/settlement]
    note: "Runs on the month's number, as in a temperate summer: rice ripens in August at Angkor."
    best: "Sowing and harvest from each place's own rains, frosts and floods. It needs no new data."
    gap: medium
    seen: [texts, ethnography]
  - id: animals-kept
    label: Kept animals
    kind: at-once
    what: "Which animals a household kept, and how many."
    now: stand-in
    has: [gen:people/settlement]
    note: "Twenty husbandry traditions are written. Where none holds, no animals are drawn."
    best: "Animals from where each was first kept and how far it had spread, by climate and tradition."
    gap: medium
    seen: [sites, ethnography]
  - id: yield
    label: Food from a km²
    kind: at-once
    what: "How much food the land gave under the way of life practised on it."
    now: none
    note: "Not in the world."
    best: "Wild food from the land's growth, its season and its waters. Crops' yield from the months, the soil and the water works."
    gap: total
    seen: [ethnography, texts]
  - id: capacity
    label: How many the land could feed
    kind: at-once
    what: "People to the km² that the food would keep."
    now: none
    note: "Not in the world."
    best: "Yield over a person's needs, by way of life, fitted to peoples whose numbers and lands are known."
    gap: total
    seen: [ethnography, texts]
