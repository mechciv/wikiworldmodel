reliability: >-
  The agreement of three republics, founders of the Union in 1922, often called the Belovezha
  agreement: evidence of what the three declared on 8 December 1991, in their own words, and not
  of what the other republics or the Union's own organs then held. Its text says it was done at
  Minsk; the transcription notes that it was signed at Viskuli, in the Belovezha forest. Blum
  (src:blum-1992-russia-un-seat, p. 355) quotes the preamble's sentence on the Union in English.
