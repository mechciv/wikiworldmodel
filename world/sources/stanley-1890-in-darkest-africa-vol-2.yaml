reliability: >-
  The leader of the Emin Pasha Relief Expedition, which crossed the Ituri forest in 1887 to 1889. His chapter on the
  great forest describes the camps of the "Wambutti" pygmies the expedition passed, in general terms and with the
  prejudice of his time; it gives no measurements of their dwellings beyond the doorways.
