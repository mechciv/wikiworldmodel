reliability: >-
  A missionary at Rabai near Mombasa from 1844, who went twice into Ukambani (1849 and 1851). His account of the Wakuafi
  and Maasai stands in the narrative of his second journey there, of 1851, and rests on what he learnt from others: he
  did not live in a Maasai settlement.
