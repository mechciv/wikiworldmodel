reliability: >-
  Radiocarbon dates through a carved lintel from Tikal that bears Long Count dates, matched to
  the calibration curve. It tests correlations that lie decades and centuries apart and
  supports the Goodman-Martínez-Thompson family against the rest. Its dates span decades, so
  it says nothing on which constant of that family is right; it names 584283 as the variant it
  uses.
