reliability: >-
  A dating study of the settlement of Szederkény in south-west Hungary, with formal models of the radiocarbon dates for
  the first longhouses with flanking pits across central Europe. Those models rest on dates measured over decades, which
  the authors call of variable quality, many of them on charcoal that may be older than the houses; they give three
  models, and say the pace of the spread within the 54th century cannot yet be told.
