reliability: >-
  A proposal, from colonial pictorial calendars and a count of the days, that the twenty-day
  months slid within the year every four years, so that a different month began the year in each
  group of four years and the series came round after 72 years. It names the years 1519–1522 as
  1 Acatl to 4 Tochtli. A hypothesis argued by its author, which the sources read here do not
  share; evidence of the proposal, not of the Mexica practice.
