reliability: >-
  The treaty by which the two German states agreed the accession: evidence of what they agreed,
  in their own words, among it the day the accession takes effect and that the Democratic
  Republic's lands become lands of the Federal Republic. It is the terms of the accession, not the
  act of acceding, which was the Democratic Republic's own declaration and was not read here.
