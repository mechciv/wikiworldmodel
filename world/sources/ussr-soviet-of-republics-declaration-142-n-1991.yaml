via: >-
  Russian Wikisource's transcription, which gives as its source the gazette of the Supreme Soviet
  of the USSR (Ведомости Верховного Совета СССР, 1991, no. 52). The transcription sets its own
  note marks, [1] to [6], inside the first sentences.
reliability: >-
  The declaration of the upper chamber of the Union's own parliament: evidence that an organ of
  the Union itself declared, on 26 December 1991, that the Union ceases to exist as a state and
  a subject of international law with the creation of the Commonwealth. The transcription's
  notes say that the chamber was set up by a law of 5 September 1991 and is not in the Union's
  constitution, and that several republics' parliaments had not ratified the agreement by then:
  those are Wikisource's notes, not the gazette's, and were not checked.
