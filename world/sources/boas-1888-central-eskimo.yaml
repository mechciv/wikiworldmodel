license: public domain
reliability: >-
  The ethnography of the Inuit of Baffin Island and the coasts west of it that Boas wrote from his own year in Cumberland
  Sound and on Davis Strait in 1883 and 1884, and from the accounts of the explorers before him (Parry, Ross, Hall,
  M'Clintock), whom it cites by page. Its sizes of the snow house are his general description.
verified:
  by: machine:claude-code
  how: >-
    The transcription read on 20 November 2026: the section "Habitations and dress: The house" (pp. 539–546 of the
    report) in full, the account of the Netchillirmiut, and the passages on food; the quotes checked by script against
    that text. The transcription keeps no page numbers, so the locators give the section and the pages its list of
    illustrations gives.
