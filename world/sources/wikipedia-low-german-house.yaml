reliability: >-
  A general encyclopedia article, cited for the farmhouse of northern Germany from the end of the Middle Ages to the
  nineteenth century because no history of the German farmhouse could be read here. Its footnotes cite Dickinson (1964),
  Germany: A regional and economic geography, pp. 151–153, and Elkins (1972), Germany, p. 266; it lists Baumgarten
  (1980), Das deutsche Bauernhaus, Schepers (1994), Haus und Hof westfälischer Bauern, and other works as sources without
  saying which sentence rests on which. Its opening sentence carries the editors' mark "need quotation to verify". None
  of those works was read, and any of them should replace this.
