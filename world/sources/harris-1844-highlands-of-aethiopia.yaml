reliability: >-
  The narrative of the British embassy to Shoa, which left Bombay in April 1841, crossed the Afar (Adaiel, Danakil) country
  from Tajura and reached Shoa that year; the preface is dated at Ankober on 1 January 1843. The author describes the Afar
  he travelled among, with a soldier's contempt for them; the passage on their huts is general, not of one camp.
