reliability: >-
  A general encyclopedia article, cited for the smallest and the largest round tulou, for their tiled roofs and for
  how many people lived in one, because the paper read on the tulou (src:colafranceschi-2020-tulou) gives only
  ceilings for their size and says nothing of the other two. Most of what is quoted stands in the article without a
  reference; its account leans on Huang Hanmin's Fujian Tulou and on the World Heritage listing, neither read here,
  and either should replace it.
