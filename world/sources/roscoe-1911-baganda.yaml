reliability: >-
  An ethnography by a missionary who lived in Buganda from 1884, written in the past tense of the customs before the
  colonial changes he saw. Its account of house-building is mostly of the royal and the chiefs' houses; what it says of
  every house, and of the peasants', is cited as such.
verified:
  by: machine:claude-code
  how: >-
    Chapter I (p. 15), chapter III (p. 95) and chapter XI on house-building (pp. 369 to 375) read on 20 November 2026 in
    the OCR text of the scan. The OCR runs the marginal notes into the text, so the quotes keep to stretches it reads
    cleanly, and were checked by script against it.
