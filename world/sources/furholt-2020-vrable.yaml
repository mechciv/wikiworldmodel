reliability: >-
  The report of the excavations of 2012–2017 and of the magnetic survey of the Linearbandkeramik settlement of Vráble in
  south-west Slovakia, in chapters by the excavators and their specialists; the six named are its editors. It is cited
  from five chapters: 2.1 (Winkelmann, Bátora, Hohle, Kalmbach, Müller-Scheeßel & Rassmann, on the magnetic survey),
  5.4 (Eckelmann, Schmölcke & Makarewicz, on the animal bones), 5.5 (Filipović, Kroll & Kirleis, on the plant remains),
  6.1 (Müller, Müller-Scheeßel, Cheben, Wunderlich & Furholt, on the population) and 6.3 (Wunderlich, Müller, Cheben,
  Bistáková, Furholt & Müller-Scheeßel, on the political economy). What it says of the Linearbandkeramik at large, the
  lengths of houses after Pechtl (2009) and Coudart (1998), the size of a household after Zimmermann et al. (2009) and
  Kreuz (2010), and how the fields were worked after Bogaard (2004), is its summary of works not read here. Vráble
  itself is of the later Linearbandkeramik, about 5300 to 4950 BCE, in the north-west of the Carpathian Basin.
