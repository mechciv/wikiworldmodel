reliability: >-
  A synthesis, by the excavator of Hastinapura, of the digs at the culture's sites up to about 1980 (Bhagwanpura,
  Atranjikhera, Jakhera, Hastinapura, Noh). Only Bhagwanpura had been dug over a large area, so what it says of houses
  rests on few plans. Its dates are estimates from stratigraphy and the first radiocarbon dates. Its reading of the
  culture as that of the later Vedic Aryans is its author's, and is not used here.
verified:
  by: machine:claude-code
  how: >-
    Read on 20 November 2026 as UNESCO's PDF of the chapter (its pages bear ISBN 978-92-3-102719-2), in the copy archived
    at web.archive.org on 7 December 2025: UNESCO's own address now redirects to the Silk Roads home page, and
    unesdoc.unesco.org answered with a bot check. The text was extracted with PyMuPDF and the quotes checked by script
    against it. The pages cited are the PDF's own numbers (412 to 431), which differ from the printed volume's. The year is
    that of the volume's first printing, as library catalogues give it; the PDF does not state it.
