reliability: >-
  A general encyclopaedia's short life. It gives his death as 5 March 1625, the day the
  Dictionary of National Biography has him fall ill, against the same encyclopaedia's article on
  his son, which has him die on 27 March: a slip. It is cited for that date, as a claim set
  aside, and for the style it gives him.
