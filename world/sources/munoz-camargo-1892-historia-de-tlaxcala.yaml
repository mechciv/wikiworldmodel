  how: >-
    Fetched on 2026-11-19 (UTC); Chavero's preface, the chapters on the founding and division of
    Tlaxcala, the wars with the Mexica (pp. 109–113) and Cortés's arrival (pp. 183–187) read.
    Quotes found in the kept text city-munoz-camargo-1892.txt by script.
