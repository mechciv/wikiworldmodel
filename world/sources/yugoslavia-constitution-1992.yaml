id: src:yugoslavia-constitution-1992
type: document
kind: act
citation: >-
  Ustav Savezne Republike Jugoslavije (Constitution of the Federal Republic of Yugoslavia),
  adopted and proclaimed by the Federal Chamber of the Assembly of the Socialist Federal
  Republic of Yugoslavia. Službeni list Savezne Republike Jugoslavije, year I, No. 1/92.
published: 1992
title: Устав Савезне Републике Југославије
url: https://sr.wikisource.org/wiki/%D0%A3%D1%81%D1%82%D0%B0%D0%B2_%D0%A1%D0%B0%D0%B2%D0%B5%D0%B7%D0%BD%D0%B5_%D0%A0%D0%B5%D0%BF%D1%83%D0%B1%D0%BB%D0%B8%D0%BA%D0%B5_%D0%88%D1%83%D0%B3%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%B8%D1%98%D0%B5_(1992)
via: >-
  Serbian Wikisource's transcription, in Serbian in Cyrillic, which gives the first number of
  the new state's official gazette as its source and dates that number 3 January 1992, which
  cannot be right for a constitution of April.
reliability: >-
  The constitution of the federation of Serbia and Montenegro, in its own words: evidence of
  the state's name, of who proclaimed it, and of its claim, in the preamble, to the unbroken
  personality of Yugoslavia. The text does not give the day it was proclaimed; other sources
  give 27 April 1992. A transcription by volunteers, not checked here against the gazette.
verified:
  by: machine:claude-code
  how: >-
    Fetched from sr.wikisource.org on 2026-11-17. The preamble, Articles 1 and 2 and the final
    provisions (Articles 143 and 144) were read; the quotes were found in the kept text by
    quote-check.
