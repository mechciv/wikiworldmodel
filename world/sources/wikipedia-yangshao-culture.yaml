reliability: >-
  A general encyclopedia article, cited for how a Yangshao house was built because the synthesis of the Yellow River's
  Neolithic houses that was sought (Lü and others 2021, in Land) is on MDPI's site, which refused the request, and the
  excavation reports are in Chinese. Its paragraphs on the kinds of house, on the pit, the wattle and the thatched roof,
  and on the late Yangshao houses cite nothing. Its phases are footnoted to Liu and Chen (2012), The Archaeology of
  China, pp. 190–191; its sentences on the size of villages and on shifting cultivation to a world-history textbook
  (Pollard 2015, Worlds Together, Worlds Apart, pp. 69–70) and, for the farming, to Wang and others in The Holocene.
  None was read here. Liu and Chen (2012) should replace it.
