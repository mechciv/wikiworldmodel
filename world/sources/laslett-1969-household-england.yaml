reliability: >-
  The first report of the Cambridge Group's analysis of listings of the inhabitants of a hundred English communities,
  made between the late sixteenth century and the early nineteenth, set beside the censuses from 1801. The mean it
  gives is of households as the listings divide them, servants living in counted with the family; later work has
  questioned how far a hundred listings, which survive by chance, stand for the country. Only the abstract was read.
