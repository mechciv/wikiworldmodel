reliability: >-
  A short signed entry in the standard scholarly reference work on Iran, written for the
  Horde's wars with the Ilkhans. It says who counts as its first khan and when its lands were
  conquered, and gives its end only as a dissolving into smaller states in the fifteenth
  century; it names no year of foundation and none of its end.
