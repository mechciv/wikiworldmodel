url: https://www.ejil.org/pdfs/3/2/2045.pdf
reliability: >-
  A note by an international lawyer, written by May 1992, on how Russia came to sit in the Soviet
  Union's seat: it reports what the republics declared, quotes Yeltsin's letter from the United
  Nations document, and says that no member objected. Its own judgment is that Russia's claim to
  continue the Union was legally flawed, because the republics, Russia among them, had declared
  the Union extinct, and that the claim was accepted for reasons of politics. It dates the
  Union's dissolution to the Alma-Ata declaration, or possibly the Minsk agreement, and calls
  the president's resignation the sealing of its fate.
