reliability: >-
  The President's address on the evening the terms were signed in Tokyo Bay, dated by
  Washington's calendar: evidence of the day on which Washington heard of the signing, of the
  day he proclaimed as V-J Day, and of his saying that it was not yet the formal end of the war.
