url: https://archive.org/details/juvenalpersius0000ggra_k6l0
license: public domain
via: The Internet Archive's scan of the 1924 reprint (juvenalpersius0000ggra_k6l0), read in its OCR text.
reliability: >-
  A satirist's picture of the Rome of his day, drawn to mock it: the tenement propped up, and a fire climbing from its
  ground floor to the lodger under the tiles. What it shows of how the houses were built is incidental to the joke, and
  it gives no measures.
