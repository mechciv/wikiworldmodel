reliability: >-
  A French physician who lived for years at the Mughal court. The passage cited is from his letter to La Mothe le Vayer
  describing Delhi and Agra, dated at Delhi on 1 July 1663, which is the date given here as when it was written; the
  book's other letters are of other years. He describes the capital as he saw it, for readers in Paris, and compares it
  with Paris throughout.
verified:
  by: machine:claude-code
  how: >-
    The letter describing Delhi and Agra read on 20 November 2026 in the OCR text of the scan, pp. 245 to 248 for the
    houses; its date is the letter's own heading ("Written at Dehli the first of July 1663"). The quotes were checked by
    script against the OCR, keeping to stretches it reads cleanly.
