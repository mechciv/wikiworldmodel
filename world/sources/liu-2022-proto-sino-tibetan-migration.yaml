reliability: >-
  A study of residues on Yangshao pottery from Gansu and Sichuan, by archaeologists of Stanford, Dartmouth, Chengdu and
  Beijing. It is cited for its summary of the Yangshao culture, its dates and how its villages were laid out, which
  rests on Liu and Chen (2012), The Archaeology of China (by the paper's first and last authors), the Institute of
  Archaeology's volume on the Neolithic (2010) and the excavation report of Jiangzhai (1988), none of them read here.
  It says nothing of how a house was built or how large it was.
