reliability: >-
  An essay on why so many villages of southern Germany were deserted in the fourteenth century, which its author calls
  very hypothetical in many points. It is cited here not for that argument but for what it sets out first: how the
  village and its open fields were formed between the eleventh and the thirteenth centuries, which it gives as
  established, from the author's earlier papers (Schreg 2006, 2012, 2016), not read here. It says that excavations of
  late medieval villages in southern Germany are few and mostly published only in preliminary reports.
