  locators here give both.
reliability: >-
  The decision itself, on whether a man naturalized in the German Democratic Republic was a German
  national under the Basic Law: evidence of how the Federal Republic's constitutional court read
  Germany's legal status three years before unification. What it says of other states' views, the
  Democratic Republic's and the Allied powers' among them, is that court's account of acts that
  were not read here.
