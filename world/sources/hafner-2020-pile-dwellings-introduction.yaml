reliability: >-
  The editors' introduction to a volume of papers on pile dwellings across Europe: a history of the research and a
  summary of the inventory made for the UNESCO World Heritage nomination of 2011. It is cited for where the pile
  dwellings round the Alps lie. It says nothing of the houses themselves.
