  Lockhart's English was read alongside to follow the Nahuatl and is not quoted.
license: public domain
license_note: >-
  The sixteenth-century Nahuatl and Spanish are in the public domain. The Getty states that the
  transcriptions are used with permission and all rights reserved (Lockhart's by the UCLA Center
  for Medieval and Renaissance Studies, Anderson and Dibble's by the University of Utah Press,
