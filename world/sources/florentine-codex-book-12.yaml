via: >-
  The Getty Research Institute's Digital Florentine Codex. Each folio's page loads its texts by
  script from https://dfc-be.ch.digtest.co.uk/codex/codex_folio/book/12/folio/<folio>/, and the
  texts were read there. Nahuatl quotes are copied from the transcriptions by James Lockhart (We
  People Here, 1993) or by Arthur J. O. Anderson and Charles E. Dibble (Florentine Codex,
  1950–82); Spanish quotes from the transcriptions by Lockhart (1993) or by Alfredo López Austin
