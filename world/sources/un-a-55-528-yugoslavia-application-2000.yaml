reliability: >-
  The state's own application, signed by its president, as the Secretary-General circulated it:
  evidence that on 27 October 2000 it asked to be admitted as a member, citing the resolution
  that had told it to apply. The letter does not say in so many words that the earlier claim is
  withdrawn.
