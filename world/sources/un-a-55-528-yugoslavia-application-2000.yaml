  in the United Nations: note by the Secretary-General, 30 October 2000, with the letter dated
  27 October 2000 from the President of the Federal Republic of Yugoslavia to the
  Secretary-General and his declaration accepting the obligations of the Charter.
  A/55/528-S/2000/1043.
published: 2000
title: Application of the Federal Republic of Yugoslavia for admission to membership in the United Nations
