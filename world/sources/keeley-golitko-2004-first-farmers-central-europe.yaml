reliability: >-
  A signed article by two students of the Linearbandkeramik in an encyclopedia of prehistory for general readers,
  without references in the text but with a bibliography. It is of 2004: its date for the culture's origin, about 5700
  BC, is earlier than later work gives, and is not used here. It is cited for what the houses were, where the culture
  spread, and for the change of view on how its people farmed.
verified:
