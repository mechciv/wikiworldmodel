    The article's page at Encyclopedia.com fetched on 20 November 2026 and read in full as text; the names of its authors
    stand at its foot. The copy has question marks in place of some letters with diacritics, and the quotes keep clear of
    them. The page gives no page numbers; the volume and part are from the cross-references of the encyclopedia's
    articles on Bylany and Brześć Kujawski, read at the same site. The editors, publishers and year are from Open
    Library's records of the encyclopedia (works OL19365288W and OL8311329W), which give Thomson Gale and Charles
    Scribner's Sons, and 2004 and 2003. Quotes checked by script against the text of the page.
