reliability: >-
  A study, by remote sensing and field survey, of the villages of sunken-courtyard cave dwellings ("silo-caves") of
  western Henan, southern Shanxi, central Shaanxi and eastern Gansu, and how they have changed since 1969. Its history
  of the cave dwelling, cited here, is a short summary drawn from Chinese excavation reports and histories that were
  not read; its dates are round ("2000 years ago", "5000 years ago"), and its subject is the sunken-courtyard kind of
  cave dwelling. It gives the depth of the courtyard and no size for a cave.
