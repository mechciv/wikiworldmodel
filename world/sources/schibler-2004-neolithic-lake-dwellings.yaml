reliability: >-
  A signed article in an encyclopedia of prehistory for general readers, without references in the text but with a
  bibliography, in which two of its authors appear as authors of the studies of the economy of the lake-shore
  settlements of Zurich; the other works it lists, among them Stöckli, Niffeler & Gross-Klee (1995) on the Swiss
  Neolithic, were not read here. It describes the Swiss sites above all, and is of 2004. It says that each site is
  different, with houses raised above the ground at some and at ground level at others.
