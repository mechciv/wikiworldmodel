url: https://treaties.un.org/Pages/HistoricalInfo.aspx?clang=_en
reliability: >-
  The depositary's own notes on changes of name, union, separation and continuity among the states
  party to the treaties deposited with the Secretary-General, state by state. It is evidence of how
  the United Nations Secretariat, as depositary, treats a state, and of the communications it
  received, as it summarizes them; it is not the text of those communications. The page is
  revised without notice.
