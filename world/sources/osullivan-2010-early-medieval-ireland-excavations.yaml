reliability: >-
  A project report that gathers what the excavations of 1930–2009 found of early medieval Ireland, written, as its title
  page says, as the text of a book for the Royal Irish Academy; the book was not read. Its account of houses rests on
  Lynn's surveys of excavated houses (1978, 1994), and the sizes it gives are typical values, not a table of
  measurements. A report, not a peer-reviewed publication.
verified:
  by: machine:claude-code
  how: >-
    The PDF downloaded from the repository on 20 November 2026 and converted to text. Of chapter 2, on dwellings and
    settlements, these parts were read: the settlement landscape and raths (pp. 20–25), the houses (pp. 35–37) and the
    dating of raths (pp. 40–41); of chapter 5, on agriculture, its opening (p. 117) and the passage on fields (p. 124).
    Quotes checked by script against the text. The page numbers given are the report's own, printed at the head of each
    page, five less than the PDF's.
