reliability: >-
  A description of one village of Maratha cultivators, its wall, houses, people and husbandry, with the author's own
  count of its houses and inhabitants in July 1819. It is one township, which the Society's preface says lay within
  thirteen miles of Poona, "which was then the capital of the Peishwa's Government"; some of its houses were in
  ruins, and the outcastes' houses had been destroyed in what the author calls the late campaign. Its house sizes
  are in cubits, whose length it does not state.
verified:
