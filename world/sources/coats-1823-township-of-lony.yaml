  how: >-
    Read on 20 November 2026 in the OCR text of the scan: the title and the date it was read to the Society, the
    description of the town and its houses (pp. 190 to 193 of the reprint, which stars the pages of 1823 in its
    text), the enumeration of July 1819 and the sentence on persons to a house (p. 194), and the preface for
    where Lony lies. The page numbers are those of the reprint's running heads nearest each passage. The quotes were
    checked by script against the OCR, keeping to stretches it reads cleanly: it writes the date of reading "29 th
    February" and the month of the count "July ," with stray spaces, which the quotes keep.
