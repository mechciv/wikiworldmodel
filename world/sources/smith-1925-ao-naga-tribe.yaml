reliability: >-
  An ethnography by a sociologist who had been superintendent of the mission training school at Impur in the Naga Hills,
  written from what he saw among the Ao in the first years of the twentieth century. It describes the house and the
  fields as they were then; it dates nothing earlier, and its account of Ao origins is the people's own tradition.
