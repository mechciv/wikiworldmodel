reliability: >-
  The standard English reference of its day, revised for this edition by its contributors. Its account of the Roman
  house rests on the ancient writers, read through Becker, Marquardt and Friedländer, and on Pompeii as dug by the
  1880s: what it says of the insulae, their height and the building laws of Augustus, Nero and Trajan are its readings
  of Vitruvius, Strabo, Tacitus, Martial, Juvenal and Livy, and later work has refined them. Its figures from the
  fourth-century catalogue of the city (44,171 insulae, 1,782 domus) are Marquardt's, and differ from other editions'.
verified:
  by: machine:claude-code
  how: >-
    Read on 24 November 2026 in the OCR text of the Internet Archive's scan of the 1901 impression: the Roman part of
    the article "Domus" from its start to the domus of the republic (pp. 664 b–667), its later pages where they speak
    of the atrium's light, the upper storeys and the shops of Pompeii (pp. 670 and 679), and the article "Caementum"
    (pp. 327–328). Pages 328, 664, 665, 666 and 667, and the list of writers (pp. iv–v), were looked at on the
    scan's page images, to confirm the words quoted, their pages and their columns, and the signatures. The OCR
    misreads a few words (it has "A.D," for A.D. on p. 665 and "Mostra" for Rostra on p. 328), and the quotes leave
    them out by an ellipsis. The quotes were checked by script against the OCR text. Google's scan of the 1890 printing
    (adictionarygree00marigoog) has the same text on pp. 665–666, as far as its poorer OCR shows.
