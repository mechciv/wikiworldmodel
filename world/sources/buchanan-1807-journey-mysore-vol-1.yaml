reliability: >-
  The journal of a survey of the agriculture, arts and commerce of Mysore and the countries lately taken from Tipu
  Sultan, kept day by day from 23 April 1800: what the author saw of houses, towns and villages from the road, in the
  country behind Madras, at Conjeveram and above the Ghats. He says himself that the houses of the natives were
  inaccessible to a European, so that what he describes is their plan and their outsides.
verified:
  by: machine:claude-code
  how: >-
    The first chapters of vol. I (pp. 1 to 38) read on 20 November 2026 in the OCR text of the scan, and the rest of
    the volume searched for what it says of houses and of fortified villages. The page numbers are counted from the
    running heads, which the OCR numbers only here and there. The year of publication is the Internet Archive's record
    of the scan: the date on the title page is not legible in the OCR. The second volume, read in the same way, has
    the detached houses in gardens of Malabar, which are not this record's. The quotes were checked by script against
    the OCR, keeping to stretches it reads cleanly.
