reliability: >-
  Russia's own law on its treaties: evidence that Russian law treats Russia as a party to the
  Soviet Union's treaties as the state that continues the USSR (государство — продолжатель СССР).
  It was read as amended to 2020; whether article 1, part 3 has stood unchanged since 1995 was
  not checked.
