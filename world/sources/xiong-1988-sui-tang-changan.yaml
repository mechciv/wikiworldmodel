reliability: >-
  A doctoral thesis on the city, from the dynastic histories, the Song and Qing descriptions of the city and the
  archaeological reports of 1958–1963. Its population figures are the estimates of Wu Bolun (1959) and Hiraoka Takeo
  (1956), as Xiong reports them. Revised as his book Sui-Tang Chang'an: A Study in the Urban History of Medieval China
  (Ann Arbor, 2000), which could not be read here.
