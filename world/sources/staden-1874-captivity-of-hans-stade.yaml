reliability: >-
  A German gunner held captive by the Tupinambá near Ubatuba, on the coast between Santos and Rio de Janeiro, in 1554;
  his account was printed at Marburg in 1557, the year given here as when it was written, and is read here in the English
  translation of 1874. Part II, his description of the people's ways, is written from what he saw while a captive. The
  introduction and the footnotes are Burton's, written in 1874, and are cited as his where they are cited.
