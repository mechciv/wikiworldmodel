reliability: >-
  A physicist's short paper on the arithmetic of the 260-day count and of the count of years as
  the Mexica kept them shortly before the conquest. It lists the twenty day signs in order and
  the four year bearers, taking spelling and order from Rafael Tena, and reports Tena's view of
  which days of the year named it. A clear statement of the structure, at second hand from Tena
  and Caso; it does not argue a correlation.
