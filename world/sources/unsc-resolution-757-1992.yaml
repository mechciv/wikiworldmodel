reliability: >-
  The resolution that put sanctions on the Federal Republic of Yugoslavia (Serbia and
  Montenegro). It is evidence of what the Council noted that day about that state's claim to
  the old federation's seat, in the Council's words, and not of whether the claim was good in
  law.
