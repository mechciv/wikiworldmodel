citation: >-
  Declaration of war by the Soviet Government on Japan, handed by the People's Commissar for
  Foreign Affairs, Molotov, to the Japanese ambassador, Sato, on 8 August 1945, as announced by
  Molotov and broadcast by Moscow; English text as reported from London, 8 August 1945.
published: 1945
title: Soviet Declaration of War on Japan
