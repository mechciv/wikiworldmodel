reliability: >-
  The declaration as the Soviet Government announced it, in an English version of a broadcast:
  evidence of the day from which the Soviet Union held itself at war with Japan, and of its
  joining the Allied powers' declaration of 26 July. The wording is a translation of unknown
  hand.
