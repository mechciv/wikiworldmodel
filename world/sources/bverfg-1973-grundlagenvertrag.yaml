via: >-
  Das Fallrecht (DFR), University of Bern, edited by A. Tschentscher: a transcription of the
  official reports that marks their page breaks and numbers the paragraphs itself (Rn.). The
  locators here give both.
reliability: >-
  The judgment itself: evidence of what the Federal Republic's constitutional court held the Basic
  Law to say about Germany's legal status, in its own words, binding on every organ of the Federal
  Republic. It is not evidence of how others saw the matter: the judgment itself sets out the
  opposite legal view, as one the Basic Law rejects, and says that the two German states disagreed
  on the national question.
