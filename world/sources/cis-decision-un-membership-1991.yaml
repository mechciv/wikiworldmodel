reliability: >-
  The decision of the republics of the Commonwealth, Russia among them, on the Union's seat:
  evidence that the eleven supported Russia's carrying on the Union's membership of the United
  Nations, in their own words. It is the parties' agreement among themselves, not the United
  Nations' decision. Blum (src:blum-1992-russia-un-seat, p. 356) quotes its first point in
  English, from the New York Times of 23 December 1991, and the United Nations circulated an
  English text of the whole (src:un-a-47-60-alma-ata-1991, annex V).
