reliability: >-
  The excavators' own account of Inamgaon for a museum's magazine, after five seasons and before their final report:
  the three periods are dated "ca.", the house sizes are of the houses exposed by then (nine of the Early Jorwe period,
  some thirty-nine of the Late Jorwe), and the authors call their conclusions on family size and house type
  tentative. It gives the pits of the Malwa pit houses a diameter of "approximately 12.50 meters" and the largest of
  them 3 metres, which do not agree; the pit houses are not used here. The radiocarbon chronology of the site has
  been revised since, in works not read.
