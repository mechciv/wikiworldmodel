via: >-
  Project Gutenberg's transcription of the 1862 edition (ebooks 64945, 64946, 64947), read from its mirror at
  gutenberg.pglaf.org and kept as one text, es-bernal-diaz-verdadera-historia.txt. The transcriber's note says it
  follows the same text as Vedia's edition in the Biblioteca de Autores Españoles, XXVI (1853), corrects printing
  errors, normalizes spelling variants (not proper names or native words), accents capitals, distinguishes mas/más,
  aun/aún and que/qué, and breaks long paragraphs; so the quotations are of a modernized text. Its dates agree, at
  every one checked, with Lockhart's English translation of the Madrid edition of 1632 (src:bernal-diaz-lockhart-1844).
license: public domain
reliability: >-
  A soldier's history of the conquest by a man who sailed with Cortés in 1519 and served through the siege (in
  Alvarado's division), written decades later from memory and notes, in Guatemala, to correct Gómara's account and
  to claim the soldiers' share of the glory; the text says he was copying it out in 1568, and it was first printed
  in 1632. It gives many exact days, often from church feasts, and numbers that differ widely from Cortés's; some
  dates are corrupt in this text (the flight on 10 July "of the following year"), and what happened where he was not
  (the killing at the festival in May 1520) is hearsay, as he says. Kind eyewitness, though written long after.
