reliability: >-
  A general encyclopedia article, cited for the courtyard house of northern China because the studies of it that were
  sought could not be read here (MDPI's site refused the request; Frances Wood's 1983 thesis on the houses of the
  Beijing area could not be fetched). It is thinly sourced. That the house was prevalent in northern China rests on a
  design magazine's web page (stirworld.com, 2023); that it began under the Han and became popular under the Ming and
  Qing on an unnamed web page; that it goes back to the Western Zhou on Wang Qijun (2000), Vernacular Dwellings, p. 122,
  and a magazine article ("Siheyuan: Old Beijing Style Appeals to Many", Beijing This Month, 2006). Its sentences on the
  layout, the single storey, the ridged roof and the houses of the north-west and north-east cite nothing. None of those
  works was read. Wang (2000), or R. G. Knapp's books on China's houses, should replace it.
