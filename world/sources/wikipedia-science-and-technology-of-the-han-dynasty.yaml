reliability: >-
  A general encyclopedia article, cited for how Han houses were built because no study of them could be read here. Its
  sentences on roofs, pillars and walls and on courtyard homes are footnoted to Ebrey (1999), p. 76, Loewe (1968), pp.
  138–139, and Steinhardt (2005); none was read. As the article says, Han remains are scarce and no wooden building of
  the time survives, so that what is said of houses comes from ceramic models, paintings and bricks found in tombs; the
  review of Zhuang and others cited beside it has such models in the tombs of "mid to lower class elites". It gives no
  size for a house.
