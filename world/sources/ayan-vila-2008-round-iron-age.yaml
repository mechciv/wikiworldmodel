reliability: >-
  A refereed synthesis, by an archaeologist of the Padre Sarmiento Institute of Galician Studies (Spanish National
  Research Council), of the excavated houses of the hillforts (castros) of Galicia, northern Portugal, western Asturias
  and León, from the Late Bronze Age to the early Middle Ages. It reads the houses for what they say of society; its
  sizes are those the excavators published, site by site, and the number of people to a house is another author's
  estimate (Camino 2002), which it reports and, in a note, doubts. Its English is a translation of the author's
  manuscript.
