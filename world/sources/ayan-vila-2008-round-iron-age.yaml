    The article's PDF (ayan_6_19.pdf) downloaded on 20 November 2026 and converted to text. Read: the first hillforts and
    their houses (pp. 922–927, 934–936), the house of the late Iron Age (pp. 936–938, 949–952), the Roman period and the
    end of the hillforts (pp. 962–968), and endnote 18. The journal's server sends an incomplete certificate chain: the
    intermediate certificate that its own certificate names was fetched and added to a copy of the system's roots, so
    that verification stayed on. Quotes checked by script against the text. Page numbers are the journal's.
