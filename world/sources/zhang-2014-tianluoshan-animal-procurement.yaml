  Yangtze and the sites of Hemudu and Tianluoshan from the excavators' reports, in Chinese (Zhejiang Provincial
  Institute of Cultural Relics and Archaeology 2003 for Hemudu; Sun 2011 for Tianluoshan), which were not read here:
