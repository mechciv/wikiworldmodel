reliability: >-
  The Act of the British Parliament that ratified the eight Articles of Union agreed with the
  Parliament of Ireland. It is evidence of what was enacted and for which day, in its makers'
  words. Articles First to Third stand unamended; parts of the Fourth, on the first united
  Parliament, and of the Sixth and Seventh are repealed and are not in this text.
