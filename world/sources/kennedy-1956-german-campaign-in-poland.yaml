  were to hand: good for the course and dates of German operations, thinner on the Polish and
  Soviet sides.
verified:
  by: machine:claude-code
  how: >-
    Fetched from ibiblio.org on 2026-11-17 over plain HTTP, since the site's certificate chain
    did not verify from here: the contents, the foreword and preface (pp. v-viii), part two's
    passage on the order to attack (p. 74), of part three the opening of the attack (pp. 78-79),
    the last fighting at Kock (pp. 119-120) and the Soviet intervention (pp. 122-123), and the
    chronology (pp. 138-140). The quotes are from the preface and part three, and were found by
    quote-check in a kept text that is those two files as fetched, joined in that order; the
    page numbers are the transcription's marks, which close each page.
