via: >-
  Russian Wikisource's transcription, which gives as its source the congress's resolutions as
  published by the Central Executive Committee of the USSR in 1923; the page prints the
  declaration and the treaty after the resolution.
reliability: >-
  The congress's own act, signed by its chairman, Kalinin, and its secretary, Yenukidze, and dated
  Moscow, 30 December 1922: evidence of the day the Union's first congress approved the
  declaration and the treaty, and that it approved them in the main, leaving the final text to
  the Union's Central Executive Committee and to the second congress.
