reliability: >-
  A peer-reviewed conference paper by an author at McGill University, from the author's own measurement of 11
  sunken-courtyard cave dwellings and their 104 caves in two villages of Sanmenxia, western Henan, with a laser meter,
  and from talks with the people living in them. The depths of the caves cited here are from that survey: two villages of one district,
  and the sunken-courtyard kind only. Its figure of forty million cave dwellers is taken from an assessment of 1981 that
  was not read.
