reliability: >-
  The account of the Yugoslav state's founding acts, from 1918 to 2003, on the website of the
  archive that keeps them, each section signed as prepared by Mitar Todorović. A reference
  page by the documents' custodian, written from Belgrade: good for the dates and the content
  of the acts, and for how their keeper reads their bearing on the state's continuity; its
  account of the break-up of 1991 and 1992 is one side's.
