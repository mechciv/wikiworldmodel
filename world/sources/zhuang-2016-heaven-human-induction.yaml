reliability: >-
  A review of farming, water and floods under the Han, by an archaeologist of UCL and two colleagues, one of them (Kidder)
  the first author of the studies of Sanyangzhuang that it cites. It is cited for the dates of the Han and for its
  summary of that site: a farming
  settlement on the Yellow River's floodplain in Henan, buried by a flood, whose excavation reports (Kidder, Liu and Li
  2012 in Antiquity; the Henan institute's report of 2010 in Huaxia Kaogu) could not be read here. It says how the
  compounds stood and that their people farmed, and nothing of how the houses were built. The manuscript's wording and
  pages may differ from the printed article's.
