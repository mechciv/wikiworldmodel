reliability: >-
  The report of the superintendent of the census of 1901 in the provinces later called the United Provinces. Its
  count of houses rests on a definition that changed from census to census: in 1901 the part of an enclosure that each
  family eating together lived in was one house, so that the number of houses stands for the number of such families.
  The report itself says the rule was not kept alike everywhere, and that the true family is smaller than the figure.
verified:
  by: machine:claude-code
  how: >-
    Chapter I, paragraphs 30 to 32 (pp. 15 to 19), read on 20 November 2026 in the OCR text of the scan. The OCR reads the
    raised decimal points of the persons to a house as an apostrophe and a hyphen ("5'49", "5-7", "6'42"); the page
    image (leaf 33 of the scan, p. 19) has 5·49, 5·7 and 6·42, and the quote keeps the OCR's characters. The quotes were
    checked by script against the OCR.
