reliability: >-
  The report of the statistical survey that the Governor-General in Council ordered in 1807, for the districts of Patna
  and Bihar, which Buchanan went over in 1811 and 1812: his own observation, division by division, with
  counts he took from the police officers and the collector. His numbers of houses by kind are those officers'
  estimates, as he says, and his six persons to a house in Patna is their conjecture from partial counts. He could not
  go inside houses. It was printed from his manuscript only in 1939.
