reliability: >-
  A general encyclopedia article on the best-known Yangshao village, cited for its houses and its people because the
  excavation report (1963) is in Chinese and the studies of the site could not be read here. Its sentences on the sunken
  floors, the timber poles and thatched roofs, and the population are footnoted to Liu Li (2020), "Banpocun, Archaeology
  of", in the Encyclopedia of Global Archaeology, 2nd edition, pp. 1298–1302, and to Peterson's study of Jiangzhai in the
  Journal of Anthropological Archaeology 31(3), 265–301 (2012); its opening sentence on round houses of mud and wood
  rests on general works, among them Jarzombek and Prakash (2011), A Global History of Architecture, pp. 8–9. None was
  read here. Liu (2020) should replace it.
