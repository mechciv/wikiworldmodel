reliability: >-
  A Venetian who reached the court of the Great Khan Qubilai in 1275 and left China with an embassy
  of his about 1290 (Kim 2009, pp. 20, 27), and whose book, its prologue says, was put in writing in
  1298. He is a witness to how that court spoke of its lord and of the other Mongol rulers, and he
  takes its side. His history of the earlier khans is wrong, as Yule's notes show: he counts Qubilai
  the sixth lord and dates his accession to 1256. The book survives in differing versions; this is
  Yule's text in translation.
