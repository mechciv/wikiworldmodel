reliability: >-
  The database's own account of itself, by its makers: what a unit and a column are, how a column's footprint is drawn
  and how its units are given ages. Read as the preprint of January 2018, which its page says "has not been peer
  reviewed"; the article in the journal came out in April 2018 and was not read, so what changed between the two is not
  known here. It describes the database of 2018, with 33,903 units in 1,474 regions, in four groups of columns: the core
  set read today has 35,481 units in 1,534 columns, of six projects.
