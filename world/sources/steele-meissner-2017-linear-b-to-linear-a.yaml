reliability: >-
  A chapter by two specialists in the Aegean scripts, which argues that Linear A may be read with the sound values of Linear B. It states the present view of how the
  two scripts are related, reports the older view and the doubts still in print, and says where uncertainty remains; the works it reports were not read.
