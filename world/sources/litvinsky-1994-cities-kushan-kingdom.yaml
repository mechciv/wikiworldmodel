reliability: >-
  A survey of the excavated cities of the Kushan age from Chorasmia to the Ganges, by an archaeologist of Central Asia.
  What it says of Bhita and Taxila is at second hand, from Marshall's reports of 1911, 1915 and 1951 and from Schlingloff
  (1970), which could not be read here; the number of houses and of people at Bhita are their estimates. Its account of
  Indian town houses from texts and sculpture mixes sources of several centuries.
