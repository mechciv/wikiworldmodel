reliability: >-
  The opinions of the commission of five presidents of constitutional courts that the European
  Community set up beside its peace conference on Yugoslavia, chaired by Robert Badinter. An
  opinion is evidence of what the commission held and on what grounds; it was advice to the
  conference, not a judgment that bound the republics.
