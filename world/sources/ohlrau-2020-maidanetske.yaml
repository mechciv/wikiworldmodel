reliability: >-
  A monograph on one settlement, Maidanets'ke in central Ukraine, one of the largest of the Trypillia sites: the
  excavations of 1971 to 1991, the magnetic survey and the excavations since 2011, and a model of its population. The
  sizes cited are those of the burnt remains of the buildings excavated there before 1991, and the reading of its
  houses as two-storeyed is the author's own, from the imprints of timber in the burnt daub of one house excavated
  whole; others read the same remains otherwise, as the book says. One site of the middle Trypillia period is not the
  whole tradition.
