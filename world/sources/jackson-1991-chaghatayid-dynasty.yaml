reliability: >-
  A signed entry in the standard scholarly reference work on Iran, by the historian who wrote
  The Dissolution of the Mongol Empire (1978). It follows the line of Chaghatai from the ulus
  Chinggis Khan allotted him to the end of the dynasty in Kashgharia in 1678, with most detail
  on its dealings with Iran, and says from when one may speak of a khanate. Dates are given in
  both the Islamic and the Christian era.
