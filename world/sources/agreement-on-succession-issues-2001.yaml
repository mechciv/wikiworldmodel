reliability: >-
  The treaty by which Bosnia and Herzegovina, Croatia, Macedonia, Slovenia and the Federal
  Republic of Yugoslavia divided the old federation's property, archives and debts. It is
  evidence of how the five states, the Federal Republic among them, described themselves to one
  another in 2001: as equal successors of a state that had broken up. It names no day for the
  break-up.
