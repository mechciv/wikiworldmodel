reliability: >-
  An account of Akbar's empire, province by province, written at his court and speaking of the fortieth year of the
  reign as the present, which the edition's note puts from 6 December 1594 to 25 November 1595. Its remarks on the houses
  of a province are a single sentence each, with nothing to show what they rest on.
verified:
  by: machine:claude-code
  how: >-
    The account of the Subah of Bihar (pp. 162 to 166) read on 20 November 2026 in the OCR text of the scan, and p. 164
    (leaf 171) in the page image; the accounts of the Subahs of Ajmer, Gujarat and Bengal were read for what they say
    of houses. The quote was checked by script against the OCR.
