reliability: >-
  The editor's own essay and notes, first printed in 1871: a nineteenth-century scholar's account of
  Asia in 1260, when the Polos set out, written from the Persian and Chinese histories as then
  translated. It is old, and it is cited for how the division of the empire looked to that
  scholarship, and for the dates it corrects in Polo. The words of Marco Polo himself are another
  source (src:marco-polo-book-yule-1903).
