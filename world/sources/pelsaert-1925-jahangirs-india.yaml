reliability: >-
  A report to the Dutch East India Company by its senior factor at Agra, written in 1626 after seven years there, on the
  trade of the country and the life of its people. What it says of the common people's houses is what a merchant saw of
  the workmen, servants and shopkeepers of Agra and the towns he traded in, and is written to show their poverty.
verified:
  by: machine:claude-code
  how: >-
    The opening on the city of Agra (p. 1) and the section "The manner of life" (pp. 60 to 61) read on 20 November 2026 in
    the OCR text of the Internet Archive's scan; the year of writing is the text's own ("this year, 1626"). The quotes
    were checked by script against that text.
