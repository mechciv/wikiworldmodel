reliability: >-
  A historian's summary of the conquest by its dates in the Julian calendar, with references to
  the Spanish and native accounts (Book 12 among them), used to argue that the seasons and the
  war season shaped its timing. Evidence of the dates as a modern synthesis gives them; it does
  not deal with the Mexica calendar or its correlation. Its table of dates heads the events of
  1519 with the year 1518.
