reliability: >-
  A compilation of the areas and published population figures of 87 Late Postclassic cities. For
  Tenochtitlan it takes area and population from Calnek (1976) and Rojas (1986) (appendix, note 17),
  and the author warns that population estimates were made by different methods and are
  comparable only roughly. It is not a new estimate of Tenochtitlan's people.
