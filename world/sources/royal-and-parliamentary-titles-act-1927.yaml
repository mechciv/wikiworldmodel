reliability: >-
  The Act that restyled Parliament "of the United Kingdom of Great Britain and Northern Ireland"
  and let the King alter his style. It is evidence of the style from its passing on, and of how
  Parliament saw itself: the same Parliament under a corrected name. It does not, in so many
  words, rename the state.
