reliability: >-
  A study of every calendar table in Sahagún's manuscripts (the Primeros Memoriales, the Madrid
  and Florentine codices and others), which finds that he worked with two traditions that agree
  on the first month but place the five nemontemi differently, and with two Julian dates for the
  new year. It is evidence of what Sahagún's tables say and of how unsettled the correlation of
  the Mexica year with the Christian one was among the friars; it does not propose a correlation
  of its own, and it dismisses an indigenous leap day as groundless.
