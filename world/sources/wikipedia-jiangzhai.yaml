  A short general encyclopedia article, cited for one number, the houses of the one Yangshao village dug to its edges,
  because the study it takes it from could not be read here: Peterson, C.E. and Shelach, G. (2012), "Jiangzhai: Social
  and economic organization of a Middle Neolithic Chinese village", Journal of Anthropological Archaeology 31(3),
  265–301, which is behind Elsevier's wall. The paragraph's other footnotes are two Chinese news pages. The article is
  careless elsewhere (it has the homes built of bamboo), and Peterson and Shelach (2012) should replace it.
