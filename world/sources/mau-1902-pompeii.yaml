license: public domain
via: >-
  Project Gutenberg's e-text of the 1902 edition (EBook #42715, released 2013), read in the copy of its HTML file that
  the Internet Archive keeps (pompeiiitslifean42715gut), as Project Gutenberg's own site was down for maintenance when
