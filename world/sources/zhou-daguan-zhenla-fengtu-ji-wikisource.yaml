reliability: >-
  An eyewitness: by his own preface Zhou went with the embassy the Yuan court sent in 1295, sailed in the second month
  of 1296, reached Angkor that autumn, and was back at Siming in the eighth month of 1297, writing from what he had
  seen and heard. He describes the capital and its people in 1296–1297, four and a half centuries after the city's
  first years, and what he says of an earlier time is hearsay.
