reliability: >-
  The standard British biographical dictionary, the article by the historian of the reign. It
  does not say which calendar its dates are in. They are read here as the countries' own, the
  Julian, with the year begun on 1 January: Elizabeth's death is 24 March 1603, which was 1602
  by England's reckoning then. Twice it gives both years, 1606–7 and 2 March 1618–19.
