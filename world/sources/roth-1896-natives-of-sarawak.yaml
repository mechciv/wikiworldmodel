published: 1896
title: The Natives of Sarawak and British North Borneo
url: https://archive.org/details/nativesofsarawak01roth
via: >-
  The Internet Archive's scans of the two volumes (nativesofsarawak01roth and nativesofsarawak02roth), read in their OCR
