license: public domain
reliability: >-
  A compilation of what travellers, officers and missionaries had written of the peoples of Sarawak and North Borneo,
  chiefly Brooke Low's notes, each passage quoted with its author. The passages cited are Low's, James Brooke's,
  Spencer St. John's and W.T. Hornaday's, of the Sea Dyaks (Iban) and the Sibuyau, written between the 1840s and the 1880s; the houses
  measured in it are those its authors thought worth measuring, the largest.
