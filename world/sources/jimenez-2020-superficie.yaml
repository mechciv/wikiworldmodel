reliability: >-
  A review of the area estimates of Tenochtitlan-Tlatelolco, from the Anonymous Conqueror to
  Sanders, followed by the author's own measurement (9.44 km2) of a boundary he drew from barrio
  limits, archaeological finds and early maps on INEGI's digital map. It summarizes the founding of
  Tlatelolco and the war of 1473 from secondary sources.
