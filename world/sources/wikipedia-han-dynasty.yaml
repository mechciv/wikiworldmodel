reliability: >-
  A general encyclopedia article, cited for the Han house, household and town walls because no study of Han houses
  could be read here. The sentences cited are footnoted to standard works: the timber building and the courtyard house
  to Ebrey (1999), p. 76, Wang Zhongshu (1982), Han Civilization, pp. 1–40, Steinhardt (2004) and Thorp (1986) in The
  Art Bulletin; the rammed-earth city walls to Wang (1982) and Chang Chun-shu (2007), The Rise of the Chinese Empire,
  vol. II, among others; the household of four to five to Hinsch (2002), Women in Imperial China, pp. 46–47, and Ch'ü
  T'ung-tsu (1972), Han Social Structure, pp. 3–10. None was read here. It speaks of the whole empire and places nothing
  in a region, and what it says of houses rests on models and pictures from tombs, as it says itself. Wang (1982)
  should replace it.
