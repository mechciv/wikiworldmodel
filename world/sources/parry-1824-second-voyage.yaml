    Read on 20 November 2026 in the OCR text of the scan: the first visit to the snow village at Winter Island
    (ch. VII, p. 160), the move of the Igloolik people onto the ice in December 1822 (p. 386) and Lyon's visit to the
    snow huts on the ice in April 1823 (p. 423). The quotes were checked by script against the OCR, keeping to stretches
    it reads cleanly.
