reliability: >-
  The journal of the commander of the expedition that wintered at Winter Island in 1821–22 and at Igloolik in 1822–23
  among the Inuit of Foxe Basin, written up from his journal day by day. He describes the snow houses he entered and
  counts the huts and the people of the villages he and his officers visited.
