reliability: >-
  The act by which Russia's parliament denounced the treaty of union: evidence of the day Russia
  itself held that it left the Union, and, in an official text, of the day the treaty had been
  approved in 1922. The transcription's heading says the resolution lost force by a resolution of
  the State Duma of 15 March 1996, which was not read.
