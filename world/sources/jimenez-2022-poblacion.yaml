reliability: >-
  A review of the estimates of the city's population from the sixteenth century to Smith (2005),
  each with the area and method it rests on, followed by the author's own estimate from an assumed
  density times his own area (Jiménez Martínez 2020). It reports Calnek's and Sanders's figures
  from works that could not be read here; its translations of them are its own. Its own figure
  (75,000–95,000) is the lowest of the modern ones.
