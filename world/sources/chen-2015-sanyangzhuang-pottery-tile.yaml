reliability: >-
  A three-page conference paper on the conservation of the roof tiles of Sanyangzhuang, by staff of the Henan Provincial
  Institute of Cultural Relics and Archaeology, which excavated the site, and a materials scientist of Zhengzhou
  University. Its English is poor and its account of the site is one paragraph; it is cited only for what was found
  there: the foundations of twelve courtyards, four of them excavated, with tiled roofs, walls, wells, latrines, a pond
  and fields. It dates the flood that buried the village to the early Western Han in its abstract and speaks of the
  Western Han elsewhere; the excavation reports, which could not be read here, should replace it.
