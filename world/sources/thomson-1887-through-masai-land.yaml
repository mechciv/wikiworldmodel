reliability: >-
  The narrative of the first European journey across the Maasai country, in 1883 and 1884. The chapter on the Maasai
  tells the life of one man as a type, with the hut and kraal described in general terms from what the author saw in
  their kraals; its sizes are his estimates ("might be").
