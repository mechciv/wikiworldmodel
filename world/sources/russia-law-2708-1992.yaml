reliability: >-
  The amendment that carried the new name into the constitution: evidence that the legislator
  treated the change of December 1991 as a change of the state's name, and that it made the
  names Russian Federation and Russia equal. The same law strikes the words Constitution of the
  USSR, USSR and Union of SSR from several articles.
