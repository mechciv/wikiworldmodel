via: >-
  Russian Wikisource's transcription of the text in force, which gives as its sources the
  collected legislation of the Russian Federation, constitution.kremlin.ru, consultant.ru and the
  official portal of legal information. In the kept text the number of article 67.1 runs
  together as 671.
reliability: >-
  Russia's constitution as amended in 2020: evidence of what Russia itself now holds about its
  relation to the Soviet Union, that it is the Union's legal successor on its own territory and
  its successor and continuator in international organizations and treaties. Article 67.1 is
  marked as being in the wording of the amendment law of 14 March 2020 (no. 1-ФКЗ), so it is not
  evidence of what was held in 1991.
