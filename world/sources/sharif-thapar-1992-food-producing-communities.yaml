reliability: >-
  A review of the Neolithic sites of Pakistan, Kashmir and the Ganges valley as they were known by the mid 1980s. For
  the sites of Pakistan it says it follows Allchin and Allchin (1982) closely, and for Mehrgarh the excavators' reports
  of 1974 to 1984, written while the site was still being dug; none of those could be read here. Its dates are
  radiocarbon dates of that time. It does not agree with itself on Mehrgarh's beginning, about 7000 BCE in its account of
  the site and perhaps the sixth millennium in a later passage.
