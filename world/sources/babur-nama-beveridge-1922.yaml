license: public domain
reliability: >-
  The conqueror's own memoir. His description of Hindustan stands under the year 932 AH (18 October 1525 to 8 October
  1526), the year of his conquest, and was written between then and his death on 26 December 1530, as the translator
  dates it. He writes of the country as a newcomer from Kabul who found little charm in it, and of the parts he had
  marched through, not of all India. The translation is Beveridge's, from the Turki text.
