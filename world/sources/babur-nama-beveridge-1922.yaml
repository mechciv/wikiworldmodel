    being down for maintenance that day; the same passage was also read in the OCR of the University of Toronto's scan
    of volume 2 (baburnamainengli02babuuoft, p. 487 to 488). The quotes were checked by script against the Gutenberg
    text, which marks italics with underscores: the quotes are cut so as to leave the italic words out.
