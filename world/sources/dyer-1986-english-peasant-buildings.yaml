reliability: >-
  A historian's synthesis of the documents, the standing buildings and the excavations of peasant houses in England. Its own
  research is in the manor court rolls of the West Midlands for 1350–1500 (building agreements between lords and tenants,
  which give sizes in bays); the other regions and the years 1200–1350 are surveyed from print and from excavation reports.
  It argues against an older view that peasant houses were flimsy, and says itself that regional variety makes
  generalization hard. Sizes are of customary tenants' houses, not of the poorest cottages.
verified:
