  how: >-
    The scan of the article served by the Archaeology Data Service fetched on 20 November 2026. Its own text layer runs
    words together ("oftwo", "offive"), so the pages were also read from their images by macOS text recognition, which
    garbles a line here and there. Both readings are kept in one text file and the quotes were checked by script against
    it; the passages that give sizes and the size of a family (pp. 35 and 42) were also read by eye on the page images,
    where the two readings agree. Page numbers are the printed ones. DOI from Crossref.
