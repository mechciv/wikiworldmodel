reliability: >-
  A short synthesis of the excavated rural settlements of Austria, Moravia, Bohemia and Slovakia from the sixth century
  to the fifteenth, built round the author's own site of Mitterretzbach in Lower Austria. For Bohemia and Moravia it
  rests on Klápště (2012), for the early Middle Ages on Milo (2014), and for the village of Hard on Felgenhauer-Schmiedt
  (2008), none of which was read here. It says itself that buildings at ground level leave few traces, that villages are
  seldom excavated whole, and that developments differ much from one region to another.
