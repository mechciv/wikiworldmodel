reliability: >-
  A general encyclopedia article, cited for one sentence that puts the heated platform in the traditional houses of
  Manchuria, because no study of those houses could be read here. The sentence cites nothing. The article's list of
  references has Guo Qinghua's paper in Historical Perspectives on East Asian Science, Technology and Medicine (2001),
  pp. 505–514, and Bean, Olesen and Kim (2010), "History of Radiant Heating and Cooling Systems", ASHRAE Journal;
  neither was read. Guo, Q. (2002), "The Chinese Domestic Architectural Heating System [Kang]: Origins, Applications
  and Techniques", Architectural History, should replace it.
