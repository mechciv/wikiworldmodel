reliability: >-
  A study of the bones of seven people found in one burnt house at Kosenivka in central Ukraine. It is cited for the
  account of the Cucuteni–Trypillia societies in its introduction, their dates, lands, phases and settlements, which
  sums up the work of its authors' own project and of others, and for the size of household it reckons with, which
  is Cook's for a nuclear family anywhere and no measure of these households.
