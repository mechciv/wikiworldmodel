reliability: >-
  A review of how the correlation constants 584283 and 584285 were reached, by two Mayanists
  who argue against both and for 584286, from one inscription read as a record of the solar
  eclipse of 16 July 790. It is evidence of the arguments and of where the question stood in
  2012; by its own account the constant it argues for had found no support before it.
