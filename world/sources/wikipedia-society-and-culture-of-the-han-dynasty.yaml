reliability: >-
  A general encyclopedia article, cited for the Han hamlet and the wards of Chang'an because no study of Han
  settlements could be read here. The sentence on the hamlet of about a hundred families within a wall is footnoted to
  Nishijima (1986), pp. 551–553, and that on the 160 wards of Chang'an to Nishijima (1986), pp. 575–576, and Loewe
  (1968), pp. 146–147; neither was read. These are the settlements of the Han texts, as historians read them: the one
  excavated farming settlement read of here, Sanyangzhuang, had its compounds standing apart among their fields.
