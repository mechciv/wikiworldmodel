reliability: >-
  A journal article by a historian of the Mongol Empire, with notes to the Persian, Chinese and
  Mongolian sources. It sets out the common view, that the empire dissolved into four khanates
  around 1260, in order to argue against it: that the Mongols went on holding their realms to be
  parts of one empire, of which Great Yuan was the name in Chinese. So it is evidence both of what
  most historians hold and of the case against them. It prints the year the empire ended with Mongol
  power in China as 1364 (p. 33), where the Yuan capital fell in 1368.
