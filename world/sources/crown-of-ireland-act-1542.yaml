citation: >-
  Parliament of Ireland. An Act that the King of England, his Heirs and Successors, be Kings of
  Ireland, 33 Hen. 8 c. 1. Short title, given in 1951: Crown of Ireland Act 1542.
title: An Act that the King of England, his Heirs and Successors, be Kings of Ireland
