reliability: >-
  Gorbachev's decree, signed as President of the USSR and dated Moscow, the Kremlin, 25 December
  1991: evidence that he left the presidency that day and handed the right to use nuclear weapons
  to the President of the Russian Federation, in his own words. It does not say that the Union
  had ended.
