reliability: >-
  A Franciscan friar's report to Louis IX of his journey from the Crimea across the steppe of the Comans, by the camps of
  Sartach and Batu on the Volga, to the Mongol court at Karakorum, in 1253-1255; translated from the Latin by Rockhill,
  whose footnotes gather what other writers said of the same things. His chapter on the dwellings of the Tartars is of
  the Mongol host as he met it, not of any one camp. The footnotes are Rockhill's, of 1900, and are cited as his.
