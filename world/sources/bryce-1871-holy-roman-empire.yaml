reliability: >-
  The standard nineteenth-century account in English of the empire as an institution and of the
  theory behind it, by a jurist who quotes the medieval texts in his notes. He dates the empire
  strictly from 800 and calls Otto I its second founder. It is old, and its judgements on the
  court of Constantinople are those of its time. Medieval texts quoted from its notes are
  quoted at second hand.
