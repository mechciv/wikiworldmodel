via: >-
  Russian Wikisource's transcription of a scan of the Russian letter on the president's
  letterhead (the Wikisource index Лист президента РФ генсеку ООН від 24.12.1991.pdf). The United
  Nations document itself was not read.
reliability: >-
  The letter by which Russia told the United Nations that it was carrying on the Union's
  membership: evidence of the claim Russia made, on what day and in what words, not of its
  acceptance. The transcription agrees, sentence for sentence, with the English text that Blum
  (src:blum-1992-russia-un-seat, p. 356) quotes from the appendix to UN document 1991/RUSSIA, and
  with the United Nations' own summary of the letter (src:un-member-states-russian-federation).
