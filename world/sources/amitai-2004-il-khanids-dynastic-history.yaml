reliability: >-
  A signed entry by a historian of the Ilkhans and the Mamluks in the standard scholarly
  reference work on Iran. A short survey of the reigns and of the state's institutions, with a
  bibliography; it dates an independent Ilkhanid state from about 1260, within the breakup of
  the united empire, and its end from the death of Abu Saʿid in 1335.
