reliability: >-
  A study of two districts of Silesia colonized in the thirteenth century, from charters, old maps, laser scans and what
  little has been excavated. It is cited for the two forms the new villages took. The author says that research on the
  medieval villages of Silesia is still thin, and that these districts were chosen because their villages kept their
  medieval outlines into the nineteenth century.
