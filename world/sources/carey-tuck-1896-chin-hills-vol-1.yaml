citation: >-
  Carey, B.S. & Tuck, H.N. The Chin Hills: A History of the People, British Dealings with Them, their Customs and
  Manners, and a Gazetteer of their Country, vol. I. Rangoon: Superintendent, Government Printing, Burma, 1896.
authors:
