    The OCR text fetched on 2026-11-17. Read: the opening of chapter I (pp. 1–2), the opening of
    the life of Batu (pp. 36–37) and, in chapter V, the end of Sheikh Ahmed's reign and what
    follows (pp. 346–347, 351), with the page numbers of the running heads. The quotations were
    found in the kept text by quote-check.
