reliability: >-
  The fullest nineteenth-century history of the Golden Horde in English, compiled from
  translations of the Russian, Persian and Arabic sources and from Karamzin and von Hammer,
  whom it cites at the foot of each page. It is old and second-hand, and it is cited for the
  year in which the Horde was finally broken, which it tells in detail. The OCR is rough, and
  only what reads cleanly is quoted.
