# Properties: the type of value a claim takes, its unit, how it changes over time, and the
# kinds of subject it applies to. Validators reject properties, methods and confidence
# words that are not declared here.
#
#   type        time | point | ref | text (with language) | string | quantity | color | geometry
#               | form (a geometry is taken from a dataset in the manifest: { from: src:…,
#               names: […] } names the rows that belong to the subject, { from: src:…,
#               elements: […] } the elements of a snapshot; a form says how a generator should
#               raise a structure: { type: temple, order: corinthian, … }, core/city.ts)
#               | dwelling | settlement-form | field-system | town-form | lifeway | outbuildings (a building
#               tradition's house, how its houses stood together, its fields, its towns, whom it housed, and what
#               stood by its houses: core/dwelling.ts)
#               | taxa (a list of taxon records, as the animals a husbandry tradition kept)
#   unit        for quantities: values are written in this unit
#   values      for strings: the values allowed, each with what it means
#   interp      how a state changes between known points: step | linear | log-time | slerp
#   moment      evidence about a moment: it feeds the date solver (section 5) and is never
#               interpolated
#   applies_to  kinds (with their children; a phase is of its entity's kind), or `moments`
#               (kinds with moment: true) or `lasting` (the others, and every phase);
#               omitted means any subject
#   ref_types   for refs: the record types the value may name
#   inverse     for refs: a claim whose value is another record is a relation, and the
#               build derives its inverse under this name
properties:
  name:
    type: text
    interp: step
    description: >-
      A name, with its language. `valid` says when the name was in use; the viewer labels a
      thing by the name in use at the time shown, or by today's name where it had none.
  official_name:
    type: text
    interp: step
    description: >-
      The name a state or a body gave itself in its laws, in full, with the time it held it (`valid`). The label on
      the map is the `name`, the short name people use: a state that restyled itself keeps its `name`, and its
      official names follow one another.
  date:
    type: time
    moment: true
    applies_to: [moments]
    description: When a moment happened.
  start:
    type: time
    moment: true
    applies_to: [lasting]
    description: When an entity or phase began.
  end:
    type: time
    moment: true
    applies_to: [lasting]
    description: When an entity or phase ended. With no end claim and nothing implying one, it still holds.
  end_before:
    type: time
    moment: true
    applies_to: [lasting]
    description: >-
      An entity or phase had ended by this time (a terminus ante quem for its end): a resolution that says a state
      has ceased to exist, a traveller who found a city in ruins. It is a bound and not a date: it holds beside
      whatever the end claims say, in every picture, and does not compete with them.
  earlier_than:
    type: time
    moment: true
    applies_to: [moments]
    description: A moment happened before this time (a terminus ante quem).
  later_than:
    type: time
    moment: true
    applies_to: [moments]
    description: A moment happened after this time (a terminus post quem).
  calendar:
    type: string
    applies_to: [event/epoch]
    values:
      long-count: >-
        The Long Count of Mesoamerica, best known from Maya inscriptions, which names a day by how many days it is
        after its zero day, in five places: b'ak'tun, k'atun, tun, winal and k'in. Written 9.12.11.5.18 Long Count.
        The inscriptions write the zero day itself as 13.0.0.0.0, the end of an era before, and date the time
        before it in that era: such a date is written 12.19.13.4.0 Long Count of the era before.
      tonalpohualli: >-
        The Mexica count of 260 days, which named each day by a number from 1 to 13 and one of twenty signs, both
        advancing a day at a time, so that a name came round every 260 days. Written 1 Coatl. A record that anchors
        it is a day whose name in the count the sources give.
      xiuhpohualli: >-
        The Mexica count of years of 365 days, which named each year by a number from 1 to 13 and one of four
        bearers, Tochtli, Acatl, Tecpatl and Calli, both advancing a year at a time, so that a name came round every
        52 years. Written the year 3 Calli, or with a day, 1 Coatl in the year 3 Calli. A record that anchors it is
        the first day of a year whose name the sources give.
    description: >-
      The calendar a record anchors (core/time.ts). For a count of days, the record is its zero day: a date written
      in that count is so many days after this record's date, counted on the calendar day for day, so it moves with
      the correlation chosen. For a calendar of cycles, the record is a day whose name in the cycle is known (its
      `day_name`): every date named in the cycle is one of the days that bear its names, counted from this one in
      turns of the cycle, and moves with the correlation chosen.
  day_name:
    type: string
    applies_to: [event/epoch]
    description: >-
      The name a calendar of cycles gave the day a record anchors, as the sources give it: a day of the 260-day count
      as 1 Coatl, or, for the count of years, the year the day began, as the year 3 Calli (core/time.ts).
  location:
    type: point
    interp: step
    description: A point, with the frame its coordinates were measured in.
  frame:
    type: ref
    ref_types: [frame]
    interp: step
    inverse: carries
    description: >-
      The frame the subject's geometry lives in, and moves with. Like a relation, it is
      stored once; the build derives the inverse on the entity that defines the frame.
  identified_as:
    type: string
    applies_to: [occurrence]
    description: The taxon name as identified in the original record.
  formation:
    type: string
    applies_to: [occurrence, sample, ecosystem]
    description: The geological formation the fossils or the sample come from.
  depositional_environment:
    type: string
    applies_to: [occurrence, sample, rock-unit]
    description: >-
      The environment a rock was laid down in, in its dataset's own words: a lake, a channel, a floodplain, a dune, a
      reef. What the place was when the rock formed, as far as the rock says. A rock unit may name several, joined as
      its dataset lists them.
  lithology:
    type: string
    applies_to: [occurrence, sample, rock-unit]
    description: >-
      What a rock is made of, in its dataset's own words: sandstone, claystone, gypsum, coal. The rock as it is now: the
      sediment it was when it formed is what it was laid down as, sand for a sandstone and mud for a claystone. A rock
      unit's is every lithology its dataset gives it, each with its share of the unit and, in brackets, what the dataset
      says of it besides.
  lithology_adjectives:
    type: string
    applies_to: [occurrence, sample]
    description: >-
      What its dataset says of a lithology besides its name, as the dataset joins the words: its grain, its colour, its
      bedding, and what dried, grew or burrowed in it (desiccation cracks, a paleosol, burrows).
  second_lithology:
    type: string
    applies_to: [occurrence, sample]
    description: A second lithology of the same beds, where its dataset describes two.
  second_lithology_adjectives:
    type: string
    applies_to: [occurrence, sample]
    description: What its dataset says of the second lithology besides its name.
  footprint_form:
    type: footprint-form
    applies_to: [occurrence]
    description: Measured dimensions in millimetres and sidedness of an individual fossil footprint.
  evidence:
    type: string
    applies_to: [occurrence, sample]
    values:
      tidal-rhythmite: Thin layers laid down with the tides, whose counts give the days in a month or the months in a year.
      cyclostratigraphy: Rhythmic beds paced by the slow cycles of the Earth's orbit and axis, whose periods give the rate of its precession.
      paleosol: A soil preserved in the rock record, whose weathering records something of the air and the rain it formed under.
      body-fossil: The remains of an organism, such as a bone, a shell, a leaf or a cell.
      trace-fossil: Something an organism left, such as a track, a burrow or a root trace.
      palynomorph: Spores or pollen.
      biosignature: A chemical or isotopic sign of life, or a structure that may be biological, with no organism preserved.
      in-situ-forest: Trees fossilized where they grew, standing stumps or rooted trunks.
      ancient-dna: A genome, or part of one, sequenced from the remains of an individual.
      archaeobotanical: Plant remains from where people lived or worked, such as charred grain and chaff, impressions in pottery, or starch grains and phytoliths on tools and in sediment.
      zooarchaeological: Animal remains from where people lived or worked, read for how people dealt with the animals, such as who was killed at what age, body size, burial, or dung and pens.
      inscription: Signs of a writing system or its forerunners, cut, painted or pressed into something that has lasted, such as a clay tablet, a bone, a pot or a rock face.
    description: What kind of evidence an occurrence or a sample is.
  account:
    type: text
    applies_to: [event]
    description: >-
      What happened, in a sentence or two, as one source tells it: the writer's paraphrase, in English, of what the
      quote shows. Where the sides tell an event differently, each telling is a claim; where a whole reading of
      several events is at stake, each side's tellings belong to its perspective (section 4.4), and the default
      picture keeps what they agree on. Who told it, and how long after, is the source's (its `kind` and `written`).
  ancestry:
    type: text
    applies_to: [occurrence, event/dispersal, event/admixture]
    description: >-
      What a source reads in genomes of who an individual's ancestors were, or of what a dispersal
      or a mixing left in later people, in words.
  cargo:
    type: text
    applies_to: [event/shipwreck]
    description: What a ship carried when it was lost, in words.
  voyage:
    type: text
    applies_to: [event/shipwreck]
    description: >-
      Where a ship had sailed from and where it was bound when it was lost, in words. It is often an inference from
      the cargo, and the note says so.
  cover:
    type: string
    interp: step
    applies_to: [event/transition]
    values:
      microbial-crust: Microbial crusts on the land, the first life to cover it.
      land-plants: Low plants on damp ground, such as bryophyte-like plants and the first small vascular plants.
      forests: Trees, and forests in the wetter climates.
      grasslands: Grasses that dominate open country in seasonally dry climates.
      reefs: Reefs built by animals or by microbes and algae, in warm shallow seas.
    description: >-
      The kind of cover a transition brought to the land or the shallow seas. The biome field
      draws that cover from the transition's start on (never before it), spreading until its end.
  taxon_rank:
    type: string
    applies_to: [taxon]
    description: A taxon's rank in the classification it comes from, such as genus or family.
  body_plan:
    type: string
    interp: step
    applies_to: [taxon]
    description: >-
      Which body plan in world/plans draws a taxon and everything below it in the tree that says
      nothing else: its general shape. Sizes come from the taxon's other claims, and the details of
      a plan are the generator's guess.
  body_form:
    type: body-form
    interp: step
    applies_to: [taxon]
    description: >-
      How a taxon's body differs from the one it inherits from its nearest node above: parts changed,
      added or taken away by name, in proportions of its own length, as docs/FORMS.md describes. What it
      does not say is the parent's. Whatever a source does not support is a machine's reconstruction, and
      the claim says which.
  body_length:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: The length of a grown animal, from snout to the end of its tail or, for a turtle, of its shell.
  hip_height:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: How high a grown animal's hips stand off the ground.
  body_mass:
    type: quantity
    unit: kg
    interp: step
    applies_to: [taxon]
    description: The mass of a grown animal.
  plant_height:
    type: quantity
    unit: m
    interp: step
    applies_to: [taxon]
    description: How tall a grown plant stands.
  posture:
    type: string
    interp: step
    applies_to: [taxon]
    values:
      biped: Stands and walks on its hind legs.
      quadruped: Stands and walks on all four legs, held under the body.
      facultative-quadruped: Stands on its hind legs or on all four.
      sprawling: Holds its legs out to the side, belly near the ground.
      floating: Floats at the surface of still water.
      upright: A plant with an upright stem.
    description: How an animal stands, or how a plant grows.
  diameter:
    type: quantity
    unit: km
    interp: step
    applies_to: [landform/impact-crater]
    description: Diameter.
  area:
    type: quantity
    unit: km²
    interp: linear
    applies_to: [large-igneous-province]
    description: Area of the outcrop.
  color:
    type: color
    applies_to: [period]
    description: The standard colour of a period on its chart, as #RRGGBB.
  surface:
    type: string
    interp: step
    applies_to: [body/planet]
    values:
      magma: Molten rock open to the sky, a magma ocean.
      crust-and-magma: Crust over magma, remelted in places.
      ocean: Oceans of liquid water, with land where the geography has it.
      bare-rock: Rock, with no oceans.
    description: What covers most of a planet's surface.
  atmosphere:
    type: string
    interp: step
    applies_to: [body/planet]
    values:
      rock-vapour: Vaporized rock, thousands of degrees hot.
      steam: A thick atmosphere of water vapour, its clouds hiding the surface.
      dense-co2: >-
        A thick atmosphere of carbon dioxide, about a hundred times the weight of today's air, over a hot ocean;
        it veils the surface.
    description: The kind of atmosphere, where it changes how the planet looks from space.
  change:
    type: string
    interp: step
    applies_to: [body/planet]
    values:
      gradual: >-
        Little by little, through the whole phase: the planet passed from the state the phase began in to the
        state of the phase that follows.
    description: >-
      How a phase of a planet gave way to the next, where its sources say that the change took the length of the
      phase: a cloud of rock vapour condensing, a magma ocean freezing, an ocean raining out of its steam. The
      phase's `surface` and `atmosphere` are then what it began with. Without this claim a phase's state is taken
      to have held until the phase ended. How the change ran inside the phase, fast at first or evenly, is not
      said by it: the planet is drawn as passing evenly (model:earth/passage).
  ice_reach:
    type: quantity
    unit: °
    interp: step
    applies_to: [event/glaciation]
    description: >-
      The lowest latitude, north or south, at which ice reached sea level during a glaciation,
      as sea ice or as grounded ice, in degrees: 0 is ice to the equator.
  day_length:
    type: quantity
    unit: h
    interp: step
    applies_to: [occurrence, sample, event/astronomical]
    description: >-
      How long the day was when a rock or a fossil formed: the solar day, unless the claim's
      note says otherwise. The tides slow the Earth's spin, so the day has grown longer.
  moon_distance:
    type: quantity
    unit: Earth radii
    interp: step
    applies_to: [occurrence, sample, event/astronomical]
    description: >-
      The mean distance from the Earth to the Moon, the semi-major axis of the Moon's orbit,
      when a rock or a fossil formed, in Earth radii of 6378 km. The tides push the Moon away.
  co2_pressure:
    type: quantity
    unit: bar
    interp: step
    applies_to: [sample, event/glaciation]
    description: >-
      The partial pressure of carbon dioxide in the atmosphere when a rock formed, such as a soil that is now a
      paleosol, or at the moment of a glaciation that the claim's note names, such as its end. A source that gives
      a mixing ratio or a multiple of the present level is converted in the note, saying how.
  sea_level:
    type: quantity
    unit: m
    interp: step
    applies_to: [event, period]
    description: >-
      Global mean sea level at the height or the depth of an event or a period, in metres relative to today's:
      a glacial lowstand is negative. `valid` says when, where the source does.
  sea_level_change:
    type: quantity
    unit: m
    interp: step
    applies_to: [event, period]
    description: How far global mean sea level moved over an event, in metres; a fall is negative. The note says over what span.
  warming:
    type: quantity
    unit: °C
    interp: step
    applies_to: [event]
    description: >-
      How far global surface temperature moved over an event, in degrees Celsius; a cooling is negative.
      `valid` says over what years, and the note against what reference period.
  settlement_area:
    type: quantity
    unit: ha
    interp: step
    applies_to: [settlement]
    description: >-
      The area a settlement covered, in hectares, at the moment `valid` gives. Sources measure
      different things, the settled area, the walled area or a protected zone, and the note says which.
  houses:
    type: quantity
    unit: houses
    interp: step
    applies_to: [settlement]
    description: >-
      How many houses or households a settlement had at the moment `valid` gives, as a source counts them: houses,
      householders (vecinos) or hearths, and the note says which. How many lived in each is another question, and an
      estimate of its people that rests on such a count is a claim of population, with its own source.
  population:
    type: quantity
    unit: people
    interp: step
    applies_to: [settlement]
    description: >-
      How many people lived in a settlement at the moment `valid` gives. For a city without a census
      this is an estimate from its area, houses or food supply, and the estimates differ widely.
  decipherment:
    type: string
    interp: step
    applies_to: [development/script]
    values:
      undeciphered: Its signs cannot be read, and the language they write is not known.
      partly-deciphered: Some of its signs can be read, and a few words or phrases understood.
      deciphered: Its signs can be read, and the language they write is known.
    description: Whether a writing system can be read today, as a source states it.
  territory:
    type: geometry
    interp: step
    applies_to: [polity]
    # An area may be written in the claim itself, as a GeoJSON Polygon or MultiPolygon with the frame its
    # coordinates were measured in, for an outline no dataset gives (docs/STRUCTURE.md section 5).
    inline: true
    description: >-
      The land a polity held, as polygons: the rows of a dataset of borders through time that are
      this polity, each holding for the years it gives, within the polity's lifetime; or an outline
      written in the claim, holding for the claim's `valid` time or the polity's lifetime.
  footprint:
    type: geometry
    interp: step
    applies_to: [building, monument, works, open]
    description: >-
      Where a structure stands, traced on a map: the elements of a snapshot of a map database
      that are this structure. A record that names an element adopts it, and the element is no
      longer imported as a record of its own.
  height:
    type: quantity
    unit: m
    interp: step
    applies_to: [building, monument, works]
    description: The height of a structure, from the ground it stands on to its top.
  ground_level:
    type: quantity
    unit: m
    interp: step
    applies_to: [building, monument, works, open]
    description: >-
      The level of the ground or paving at a structure, in metres above sea level, in the time
      the claim is valid. The ground of antiquity lies metres below today's in the valleys.
  form:
    type: form
    interp: step
    applies_to: [building, monument, works, open/forum]
    description: >-
      What is known of a structure's architecture, as the parameters a generator raises it
      from: its type, order, number of columns and so on. What a form does not say is the
      generator's guess, and evidence mode shows it as a reconstruction.
  dwelling:
    type: dwelling
    interp: step
    applies_to: [tradition/building]
    description: >-
      The house a building tradition put up, as the parameters the settlement generator draws it from: its plan, its
      size, what its walls, roof and floor were made of and how they were finished, where its door was and which way
      it faced, its windows, how its smoke left it, a porch, a veranda, a byre under its roof (core/dwelling.ts). A
      tradition says only what differs from the one it is a member of; what neither says is the generator's guess,
      and the panel says whose each part is.
  settlement_form:
    type: settlement-form
    interp: step
    applies_to: [tradition/building]
    description: >-
      How a building tradition's houses stood together: clustered in villages, standing apart, in compounds or in
      camps; in a ring or in rows; what stood round the settlement and round each yard; open ground at its middle;
      how many to a settlement, how far apart, and how many people lived in each (core/dwelling.ts).
  outbuildings:
    type: outbuildings
    interp: step
    applies_to: [tradition/building]
    description: >-
      What a building tradition's households and settlements had besides their houses, as a list: a granary, a byre,
      a pen, a cookhouse, an oven, a well, a rack, a stack, a threshing floor, a shrine, a house to meet in
      (core/dwelling.ts). Each says its use, whether it was a household's or the settlement's (`per`), how many where
      a source counts them, and what it was like in the words and sizes of a dwelling, as far as its sources say. The
      settlement generator draws them by the houses or among them; what a source leaves unsaid of one is the
      generator's plain one of that use, and the panel says so. A tradition that gives no list takes the list of the
      one it is a member of, whole.
  field_system:
    type: field-system
    interp: step
    applies_to: [tradition/building]
    description: >-
      The fields around a building tradition's settlements: their kind (strips, terraces, paddies, swidden plots…),
      the size of a plot in hectares, and what divided them (core/dwelling.ts).
  town_form:
    type: town-form
    interp: step
    applies_to: [tradition/building, settlement]
    description: >-
      How a town or a city was laid out: its streets (on a grid, winding lanes, or canals among them), the size of
      its blocks, what enclosed it (a rampart, a palisade, a wall of mudbrick, rammed earth, stone or brick), how
      high, how many gates, a moat, an open square (core/dwelling.ts). A tradition that housed townspeople states
      it for the towns of its region and time; a settlement's own record states it for that city, with the time it
      held (`valid`). What neither says is the generator's guess, and the panel says so.
  lifeway:
    type: lifeway
    interp: step
    applies_to: [tradition]
    description: >-
      Whose a tradition was: one or more of the ways of life the model of how people lived tells apart
      (core/dwelling.ts): foragers, herders, shifting-cultivators, farmers, townspeople. A building tradition's
      house is drawn only for those: a herder's tent for the camps of herders, not for the farmers of the same
      region; and a husbandry tradition's animals only among them. A tradition that does not say takes the answer of
      the one it is a member of; one that has none is drawn for no one, and the validator says so.
  prevalence:
    type: string
    interp: step
    applies_to: [tradition/building]
    values:
      few: A few of them lived so. A house of some districts, of one people among others, or of those who could afford it.
      some: A part of them, beside other houses.
      most: Most of them.
    description: >-
      How many of the people a building tradition could house lived in its houses: of those of its way of life, in
      the regions its extent names, while it held. An extent names regions where the tradition was, not ones it
      covered, and a tradition that says nothing more is drawn as the house of everyone there whom no more particular
      tradition houses. One that says is drawn for a part of their settlements, and the rest are another tradition's
      or the generic house's. A word and not a number: a source says that a house was rare or common far more often
      than it counts, and the part each word is drawn for is the settlement generator's (its params.prevalence). A
      tradition does not take it from the one it is a member of.
  livestock:
    type: taxa
    interp: step
    applies_to: [tradition/husbandry]
    description: >-
      The animals a husbandry tradition's people kept, as a list of taxon records: domestic cattle, sheep, horses.
      The settlement generator draws them, each with its taxon's body and size, in the pastures and about the yards
      of the tradition's people. How many there were is not read from it: that is the generator's, and says so.
  extent:
    type: geometry
    interp: step
    applies_to: [tradition]
    description: >-
      Where a tradition is found: the rows of a dataset of regions that its sources place it in, such as the
      ArchaeoGLOBE regions. A region named is a region where the tradition was, not a claim that it covered all of it.
  insulae:
    type: quantity
    unit: blocks
    interp: step
    applies_to: [open/region]
    description: >-
      The number of insulae a region counted, as the Regionary Catalogues of the fourth century
      list them. What an insula was here is disputed: possibly a unit of tenancy, not a building.
  domus:
    type: quantity
    unit: houses
    interp: step
    applies_to: [open/region]
    description: The number of domus, town houses, a region counted, as the Regionary Catalogues list them.

# Methods: how the value of a claim was established. A method's children are written
# parent/child (radiometric/ar-ar).
methods:
  radiometric:
    label: Radiometric dating
    children:
      ar-ar: { label: 40Ar/39Ar dating }
      u-pb: { label: U–Pb dating }
      pb-pb: { label: Pb–Pb dating }
      re-os: { label: Re–Os dating }
      radiocarbon: { label: Radiocarbon dating }
      luminescence: { label: Luminescence dating }
      u-series: { label: Uranium-series dating }
      esr: { label: Electron spin resonance dating }
      cosmogenic: { label: Cosmogenic nuclide burial dating }
  amino-acid:
    label: Amino acid geochronology
    description: Relative ages from how far the amino acids in fossils have racemized, read against sites of known age.
  molecular-clock:
    label: Molecular clock
    description: Dated from genetic differences between living groups, calibrated with fossils.
  ancestry-segments:
    label: Ancestry segments
    description: >-
      Dated from the lengths of the segments of one population's ancestry in another's genomes,
      which recombination shortens with each generation.
  model:
    label: Model projection
    description: Computed with a physical model, such as a model of the Sun's evolution or of galaxies' orbits.
  calendar-correlation:
    label: Calendar correlation
    description: >-
      A calendar's zero day placed in ours by reckoning back from a day that is dated in both: a double date in a
      document of the time, an inscription matched to an eclipse that can be computed, a count of days still kept.
  ruling:
    label: Ruling
    description: >-
      Held by a court or another body competent to decide, in a judgment, an opinion or a resolution, often long
      after the events: evidence of what was held, and that it was held.
  documentary:
    label: Documentary record
    description: >-
      Read from records made at the time of the event: mission logs, an eyewitness's diary, an
      official calendar inscribed in stone.
  historical-account:
    label: Historical account
    description: Stated by a historian or chronicler writing after the events, from earlier sources.
  tradition:
    label: Tradition
    description: >-
      Handed down rather than recorded at the time: a founding legend, or a date that later
      antiquarians reckoned from one, for example by counting the reigns of legendary kings.
  stratigraphic:
    label: Stratigraphic dating
    description: Dated by the position of the beds in a dated sequence, or by their fossils.
  dendrochronology:
    label: Tree rings
    description: Dated by matching a timber's rings to a dated sequence. The last ring kept gives a time after which the tree was felled.
  numismatic:
    label: Coins
    description: Dated by the latest coins in a deposit, which give a time after which it was left, and not its date.
  typological:
    label: Typology
    description: Dated by the style of the objects in a deposit, such as its pottery, amphorae or their stamps, against dated examples elsewhere.
  excavation:
    label: Excavation
    description: >-
      Read from the remains themselves as excavated or surveyed and published: the plans of houses, their post-holes,
      walls and floors, and the layout of a settlement.
  expert-estimate:
    label: Expert estimate
    description: A value a source states without the measurement behind it.
  survey:
    label: Survey
    description: Measured in the field, for example a section's coordinates.
  paleomagnetic:
    label: Palaeomagnetism
    description: A latitude or a position read from the magnetization that rocks kept from when they formed.
  compilation:
    label: Compilation
    description: Read from a database or chart that compiles the literature.
  gazetteer:
    label: Gazetteer
    description: Placed from a gazetteer's coordinates for a named place.
  plate-polygon:
    label: Plate polygon
    description: Assigned to the plate whose polygon, in the plate model, contains the present-day location.
  map-trace:
    label: Traced from a map
    description: Taken from a map or plan, its position and shape read off the sheet.
  editorial:
    label: Editorial choice
    description: Chosen by an editor, such as a representative point to place a marker.

# Confidence: a probability, or a calibrated word that stands for a range of them (the
# IPCC AR6 likelihood scale).
confidence:
  virtually-certain: [0.99, 1]
  very-likely: [0.9, 1]
  likely: [0.66, 1]
  about-as-likely-as-not: [0.33, 0.66]
  unlikely: [0, 0.33]
  very-unlikely: [0, 0.1]
  exceptionally-unlikely: [0, 0.01]
