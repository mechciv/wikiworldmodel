id: alt:mongol-unity/one-empire
type: alternative
kind: perspective
group: alt:mongol-unity
title: One empire until the fall of the Yuan
description: >-
  The view of the Great Khans' court, and of the historians who take the empire whole. The
  empire founded by Chinggis Khan did not dissolve in 1260: its great realms, the uluses, were
  parts of one Great Mongol Empire (Yeke Mongghol Ulus) under one qa'an, and their wars were a
  family's quarrels. Great Yuan, the name Qubilai proclaimed in 1271, was that empire's name in
  Chinese, not the name of a new Chinese dynasty that came out of it. Qubilai's edict speaks
  so, of the state Taizu raised; Marco Polo, who was at his court, calls him lord of all the
  Tartars, with those of the Levant and the Ponent his liegemen; and Kim (2009) argues it from
  the Mongols' own usage, following Sugiyama Masaaki and what Allsen called a holistic
  approach. In this picture the Yuan continues the Mongol Empire, which ends only when the Yuan
  does, and the Golden Horde, the Chagatai Khanate and the Ilkhanate are parts of it.
