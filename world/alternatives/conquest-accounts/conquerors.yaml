id: alt:conquest-accounts/conquerors
type: alternative
kind: perspective
group: alt:conquest-accounts
title: As the conquerors told it
description: >-
  The conquest as Hernán Cortés told it in his letters to Charles V, the second written at Segura de la Frontera on 30
  October 1520, four months after the flight from the city, and as Bernal Díaz del Castillo told it in his history,
  finished at Guatemala in 1568. In this telling the Mexica, in concert with Narváez, rose against the Spaniards left in
  the city while Cortés was away, and Moctezuma died of a stone thrown by his own people. Cortés never mentions the
  feast; Bernal, who was away with Cortés, reports Alvarado's reasons for falling on the dancers (a rising planned to
  free Moctezuma), and also the Mexica's, and disbelieves the charge of greed.
