title: As the Mexica told it
description: >-
  The conquest as the Mexica of Tlatelolco told it, about 1555, to Sahagún's Nahua collaborators, in the Nahuatl of
  Book 12 of the Florentine Codex, with Sahagún's Spanish beside it in the manuscript of 1575–77: a history taken down a
  generation later, from noble survivors, and told from Tlatelolco. In this telling the Spaniards asked for the feast
  of Toxcatl, closed the gates of the temple courtyard and killed the dancers; and Moctezuma and the governor of
  Tlatelolco were found dead, their bodies cast out from the Spaniards' building, and it does not say by whom.
