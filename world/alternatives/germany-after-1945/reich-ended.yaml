type: alternative
kind: perspective
group: alt:germany-after-1945
title: The Reich ended in 1945
description: >-
  The German Democratic Republic's view from 1951, as its Supreme Court held it on 31 October
  1951: the German state was destroyed and ceased to exist with the unconditional capitulation;
  the German people kept its national existence and its right to form a new state; and the
  Democratic Republic is such a state, neither identical with the old one nor its legal successor,
  and so not liable for its debts (Neue Justiz 1952, pp. 222–225). The higher regional court at
  Schwerin had held the same on 18 June 1951, dating the end to 8 May 1945, and the editors of the
  Democratic Republic's law journal denied that the Federal Republic continued the Weimar Republic
  (Beyer 1952, who also names Kelsen's theory of the extinction of the German state, not read
  here). The Federal Constitutional Court's judgment of 1973 reports the view, in the Bavarian
  government's words, as the extinction of the Reich and the new rise of two independent states
  on its territory, and holds that the Basic Law rejects it. In this picture the Reich ends with
  the capitulation, and what arose in 1949 are two new states.
