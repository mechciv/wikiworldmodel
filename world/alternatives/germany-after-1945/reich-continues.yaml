id: alt:germany-after-1945/reich-continues
type: alternative
kind: perspective
group: alt:germany-after-1945
title: The Reich continues, as the Federal Republic
description: >-
  The Federal Republic's view, as its Federal Constitutional Court held it: the German Reich
  outlasted the collapse of 1945 and perished neither with the capitulation nor with the Allies'
  exercise of authority nor later; it kept its legal capacity but, having no organs, cannot act;
  and the Federal Republic is not its legal successor but identical with it as a state, though
  only partly so in territory (BVerfGE 36, 1, of 1973; BVerfGE 77, 137, of 1987). In this picture
  the Federal Republic continues the Reich: the Reich's record still ends in 1945, with its
  organization, and the state it records is carried on under the Federal Republic's. By the
  decision of 1987 many states accepted that identity in international law, and the three Western
  powers went on treating the German state as there; the Bundestag's research service wrote in
  2007 that the court had not changed its holding since unification.
