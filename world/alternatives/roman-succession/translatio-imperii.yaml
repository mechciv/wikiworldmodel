id: alt:roman-succession/translatio-imperii
type: alternative
kind: perspective
group: alt:roman-succession
title: The empire transferred to the West (translatio imperii)
description: >-
  The view of the popes and the western emperors. The Roman Empire was not founded again in the West
  but moved there: taken from the Greeks and given to the Franks in the person of Charlemagne in 800,
  and held after them by the German kings. Pope Innocent III wrote it into the decretal Venerabilem
  (1202), as the act of the apostolic see; Frederick I told the envoys of the eastern emperor Isaac
  Angelus that the monarchy had been transferred from Constantinople back to Rome, its first seat, by
  the acclamation of the Romans and the princes and the authority of the pope and the church, and that
  their master usurped the name of emperor of the Romans (Bryce 1871, ch. XII, note 220). The annals
  followed Constantine VI, the sixty-seventh emperor from Augustus, with Charles as the sixty-eighth
  (Bryce, ch. V), and the last emperor still styled himself elected Roman emperor in 1806. In this
  picture the Holy Roman Empire continues the Roman state and begins with the coronation of 800. The
  other half of the view, that from 800 the state ruled from Constantinople was no longer the Roman
  Empire, is not written: the record of the Roman state runs to 1453 in every picture.
