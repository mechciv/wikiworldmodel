description: >-
  An elephant or one of its kin: a huge body on columnar legs, a domed head, a long trunk, tusks and broad ears. Its length runs from the forehead to the end of the tail, without the trunk's reach.
kind: animal
hip: 0.46
# Its mesh, head and all, at the density of water, for its length.
mass_length: 44
behave: { group: [2, 10], habitat: any, poses: [graze, stand, stand, walk, alert] }
