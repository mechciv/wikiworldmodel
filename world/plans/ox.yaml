description: >-
  A domestic ox: a deep, level-backed body on short strong legs, a short thick neck with a dewlap under it, a long broad
  head carried low, horns from the sides of its poll, and a long tail with a tuft at its end. Cattle are drawn with it, and
  zebu, water buffalo and yak start from it.
kind: animal
hip: 0.59
# Its mesh, head and all, at the density of water, for its length.
mass_length: 58
behave: { group: [2, 10], habitat: open, poses: [graze, graze, stand, walk] }
