description: >-
  A horse, ass or zebra: a deep barrel of a body, level-backed between high withers and a round croup, on long slender legs
  with the hocks well behind; a long thick neck carried at a slope, an upright mane along its crest, a long deep-jawed head
  held at a slant, pointed ears, and a tail of long hair hanging nearly to the ground.
kind: animal
