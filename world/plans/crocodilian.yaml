description: >-
  A long, low, four-legged semi-aquatic reptile: a broad flat body under rows of scutes, short legs held out at its
  sides, a tail half its length, deep and crested, and a flat head with a long snout and its eyes on top.
kind: animal
hip: 0.1
behave: { group: [1, 3], habitat: edge, poses: [rest, rest, stand] }
parts:
  # Tail tip to snout: the head is the body's own last rings, behind the eyes its widest, then the long flat snout.
  body:
    type: trunk
    sides: [12, 5]
    rings:
      - [-0.56, 0.5, 0.42, 0.003]
      - [-0.5, 0.6, 0.42, 0.006]
      - [-0.4, 0.82, 0.42, 0.012]
      - [-0.28, 1.0, 0.42, 0.024]
      - [-0.16, 1.14, 0.42, 0.042]
      - [-0.06, 1.24, 0.34, 0.064]
      - [0.04, 1.26, 0.3, 0.076]
      - [0.13, 1.2, 0.32, 0.068]
      - [0.19, 1.13, 0.4, 0.05]
      - [0.235, 1.08, 0.5, 0.038]
      - [0.275, 1.12, 0.56, 0.044]
