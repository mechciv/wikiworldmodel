  plates-back: { type: row, near: true, tint: 40, mirror: true, n: 7, item: lump, from: [0.014, -0.36, 0.9], to: [0.014, -0.132, 1.16], r: [0.007, 0.012, 0.006] }
  plates-neck: { type: row, near: true, tint: 40, mirror: true, n: 9, item: lump, from: [0.014, -0.094, 1.22], to: [0.014, 0.21, 1.1], r: [0.007, 0.012, 0.006] }
