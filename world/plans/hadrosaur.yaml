description: >-
  A duck-billed plant-eating dinosaur, standing on two legs or four: a deep narrow body highest at the hips, a deep
  tail held out level, slender fore legs, and a long low head with a broad flat bill on a curved neck.
kind: animal
hip: 0.3
behave: { group: [4, 14], habitat: open, poses: [graze, graze, walk, stand, alert] }
