id: field:earth/islands-and-capes
type: field
title: Small islands, capes and falls, today
description: >-
  Natural Earth's small islands, capes, waterfalls and poles, each at a point as today's map labels it: rows of the map, not records written here.
grid: { kind: rows }
time: { lo: 1950 CE, hi: 2100 CE }
data:
  from: src:natural-earth-regions-points-5.1.2
basis: evidence
spread: unknown
# A list of things (docs/plans/ENTITIES.md, step 5): each feature is natural-earth:<ne_id>, the map's own id, which it keeps
# from one release to the next and gives its cities and its seas alike; and its Wikidata id joins it to a record that
# gives that.
rows:
  kind: landform
  key: "{ne_id}"
  scheme: natural-earth
  same_as: { wikidata: wikidataid }
  claims:
    name: { column: name, as: text }
    feature_class: { column: featurecla }
    location: { column: [lat_y, long_x], as: point, method: gazetteer }
