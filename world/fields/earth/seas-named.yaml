id: field:earth/seas-named
type: field
title: The named waters of the sea today
description: >-
  Natural Earth's seas, gulfs, bays, straits, sounds and the other named waters of the sea, as today's map names them. Rows of the map, not records written here, and of the sea as it is now: its shape in the past is the coastline's, and its names were others.
grid: { kind: rows }
time: { lo: 1950 CE, hi: 2100 CE }
data:
  from: src:natural-earth-marine-5.1.2
basis: evidence
spread: unknown
# A list of things (docs/plans/ENTITIES.md, step 5): each feature is natural-earth:<ne_id>, the map's own id, which it keeps
# from one release to the next and gives its cities and its seas alike; and its Wikidata id joins it to a record that
# gives that.
rows:
  kind: water-body
  key: "{ne_id}"
  scheme: natural-earth
  same_as: { wikidata: wikidataid }
  claims:
    name: { column: name, as: text }
    feature_class: { column: featurecla }
