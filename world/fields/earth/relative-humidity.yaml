# One of the parts kept beside the months of the last 120,000 years' climate (core/months.ts PARTS). Nothing reads it
# yet: the haze of a scene is a constant of the renderer.
id: field:earth/relative-humidity
type: field
title: Humidity of the air over the land, last 120,000 years
quantity: mean relative humidity of each month
unit: "%"
description: >-
  How near the air over the land was to holding all the water it could, in each month of the year, at each of the 72
  times of the climate of the last 120,000 years. It is a climate model's months (HadCM3), brought to half a degree and
  corrected by the difference between the model's present and the humidity observed in 1961–1990, the earliest
  observed climate its makers had for it, and capped at 0 and 100. So its present is the humidity of 1961–1990, where
  the temperature, rain and cloudiness beside it are those of 1901–1930. A node here is the mean of the land cells of
  the half-degree grid around it. It is of the land only, and has nothing south of 60°S.
kind: raster
frame: frame:earth/present-day
grid: { kind: lonlat, res_deg: 1 }
time: { lo: 120 ka, hi: 0 ka }
data:
  from: src:beyer-2020-late-quaternary
  as: months
  reads:
    humidity: { variable: relative_humidity, unit: percent }
basis: reconstruction
# A single value at each place, time and month: nobody gave its uncertainty (docs/STRUCTURE.md section 3.2).
spread: unknown
uncertainty: >-
  A model's month, corrected to the humidity observed in 1961–1990. The dataset's article tests its temperature, rain
  and biomes against reconstructions, and not its humidity. In three cell-months in a hundred, over all its times, the value
  is the cap of 100. The tiles keep it to a quarter of a per cent.
moves_with: src:paleomap-plate-model
