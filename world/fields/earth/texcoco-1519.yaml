id: field:earth/texcoco-1519
type: field
title: Lake Texcoco in 1519
description: >-
  The waters of the Basin of Mexico at the Spanish arrival, from IPDP's reconstruction. Openings in the mapped
  water include the island of Tenochtitlan. The map gives the shoreline for one year. Street canals and house plots
  are generated from the city's records. For the scene, the median height of the modern relief sampled around the
  mapped banks supplies an approximate surface. Water depth is generated.
