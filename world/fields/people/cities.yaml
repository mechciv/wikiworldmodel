id: field:people/cities
type: field
kind: points
title: Cities and their people, after Chandler
quantity: the people of a city, at the years its compiler gives
unit: people
description: >-
  Cities of the world from 2250 BCE to 1975 CE as Tertius Chandler's Four Thousand Years of Urban Growth lists them, with
  an estimate of their people at each of the years he gives, placed on the map by Reba, Reitsma & Seto (2016). Together
  with Modelski's list (field:people/cities-ancient), modern urban-centre anchors (field:people/cities-modern), local
  HYDE demographic drift, and global benchmark cutoffs, model:people/city-population infers each city's people and
  occupancy through gaps between listed years.
frame: frame:earth/present-day
grid: { kind: rows }
time: { lo: 2250 BCE, hi: 1975 CE }
data:
  from: src:reba-2016-chandler-v2
  as: cities
basis: reconstruction
# A single value at each place and time: nobody gave its uncertainty (docs/STRUCTURE.md section 3.2).
spread: unknown
interp: linear
params:
  # Cells of the file left out because Reba et al. conflated two distinct cities under one name (the source's reliability note).
  left_out:
    - { city: Memphis, country: Egypt, columns: [AD_1975] }
    - { city: St. Louis, columns: [AD_1000] }
    - { city: Ao, columns: [AD_1975] }
    - { city: Kherson, columns: [AD_800, AD_1000] }
  hold_yr: 50
  # Legacy fallback longest gap across which a single list row is linearly bridged without continuity metadata.
  gap_yr: 600
