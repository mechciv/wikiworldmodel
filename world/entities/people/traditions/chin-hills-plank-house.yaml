id: people/traditions/chin-hills-plank-house
kind: tradition/building
summary: >-
  The house of the Chin of the Chin Hills of western Myanmar as the British found it in the 1890s: a one-storeyed house
  of pine planks under a thick thatch, some 30 feet broad and 50 to 200 long by its owner's wealth, raised on posts over
  the pig and cattle pen on the downhill side, with a platform in front; each in its own fenced compound on a terrace cut
  into the hillside, the compounds making up the village. The house of the Haka, which the source takes for all. It
  starts here with the founding of Hakha and the move into the hills about 1400, which is not a date for the house, and
  has no end claim.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Plank house of the Chin Hills }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1400 CE
    source:
      - ref: src:wikipedia-hakha
        loc: section "History"
        quote: Hakha was founded around 1400 CE by the Lai ethnic group.
      - ref: src:wikipedia-chin-people
        loc: section "History", "Movement into the Chin Hills"
        quote: After 1395, Chin people began leaving Kale and established new settlements in the Chin Hills
    method: tradition
    note: >-
      About when the Chin are said to have moved from the Kale valley into the hills and founded Hakha, whose house the
      source describes; a date from tradition, and not one for the house, which no source read here describes before 1896.
      There is no end claim: no source read says when such houses ceased to be built.
