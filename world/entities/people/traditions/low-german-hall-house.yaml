id: people/traditions/low-german-hall-house
kind: tradition/building
summary: >-
  The hall house of the farmers of the North German Plain and the eastern Netherlands (Fachhallenhaus, or
  Niedersachsenhaus), from the end of the Middle Ages to the nineteenth century: one large timber-framed house with
  people, cattle and harvest under a single roof, a threshing floor down its middle between two rows of posts, stalls
  in the aisles at its sides, the open hearth and the living quarters at the far end and the crop in the loft above. The
  panels of its frame were filled with wattle and daub, later with brick, and its great roof was thatched with reed. A
  broad tradition, read from an encyclopedia article only, that stands until better sources are read.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Low German hall house (Fachhallenhaus) }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 1201 CE, hi: 1500 CE }
    source:
      - ref: src:wikipedia-low-german-house
        loc: opening section
        quote: >-
          The Low German house appeared during the 13th to 15th centuries and was referred to as the Low Saxon house
          (Niedersachsenhaus) in early research works.
      - ref: src:wikipedia-low-german-house
        loc: section "Predecessors"
        quote: >-
          These posts were first used for farmhouses in northern Germany from the 13th century, and enable them to be
          furnished with a load-bearing loft.
      - ref: src:wikipedia-low-german-house
        loc: section "Early history"
        quote: The oldest surviving houses of this type in Germany date to the late 15th century
    method: expert-estimate
    note: >-
      The thirteenth to the fifteenth centuries, as the article dates the house's appearing: from the thirteenth century
      the posts of farmhouses in northern Germany were set on footings and could carry a loft, and the oldest houses
      still standing in Germany are of the late fifteenth. The article names two older frames in the Netherlands, of 1262
      and 1386. Before it, the article has the farmers of north-west Europe in three-aisled longhouses whose posts were
      set in the ground, as people/traditions/iron-age-longhouse-village records for earlier centuries.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-low-german-house.txt (sha256 c275f84dc2238367), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  end:
