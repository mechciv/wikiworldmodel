  dwelling:
    prop: dwelling
    value: { plan: rectangular, length: { lo: 5, hi: 25 }, walls: wattle-and-daub, roof: gable, roof_material: thatch, floor: ground }
    source:
      - ref: src:wikipedia-low-german-house
        loc: opening section
        quote: >-
          It is built as a large hall with bays on the sides for livestock and storage and with the living accommodation at
          one end.
      - ref: src:wikipedia-low-german-house
        loc: section "Name"
        quote: >-
          which are spaced about 2.5 metres (8.2 ft) apart. This was also used as a measure of house size: the smallest
          only had 2 bays, the largest, with 10 bays, were about 25 metres (82 ft) long.
      - ref: src:wikipedia-low-german-house
        loc: section "Internal layout"
        quote: >-
          In the 18th century the Low German house was built ever larger, with a length of up to 50 m and width of 15 m.
      - ref: src:wikipedia-low-german-house
        loc: section "Construction"
        quote: >-
          The non weight-bearing external walls were built as timber frames, the panels of which were originally filled in
          with willow wickerwork and clay (wattle and daub) and, later, with brick.
      - ref: src:wikipedia-low-german-house
        loc: section "Roof shapes"
        quote: >-
          In Westphalia all these farmhouses have a gable roof. In parts of Lower Saxony and in Holstein there is a mix of
          farmhouses with gable and hipped-gable roofs, and in Mecklenburg almost all have hipped-gables.
      - ref: src:wikipedia-low-german-house
        loc: section "Construction"
        quote: Originally it would have been thatched with reed
      - ref: src:wikipedia-low-german-house
        loc: section "Diele"
        quote: With its tamped clay floor it was the working room of the farmhouse.
    method: expert-estimate
    note: >-
      A rectangular hall. The length runs from the smallest houses, of two bays, to the largest, of ten, which the
      article puts at about 25 m: it gives the bay as about 2.5 m, so the 5 m of two bays is that figure doubled, not
      one the article states. In the eighteenth century houses were built up to 50 m long and 15 m wide; no usual width
      is given, and it is left to the generator. The walls are a timber frame whose panels were filled with wattle and
      daub, later with brick; the vocabulary has no word for a frame so filled, and wattle and daub is the nearest. The
      frame itself, which carried the loft and the roof on two rows of posts down the hall (on four rows, the outer walls
      among them, in the houses of richer farmers), stood on a low stone footing. The roof was gabled in Westphalia and
      "hipped-gable" in Mecklenburg, for which there is no word, and thatched with reed. The floor is the tamped clay of
      the threshing floor; the living rooms added at the back after the Thirty Years' War were raised a little above it.
