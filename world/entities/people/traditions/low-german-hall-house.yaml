    method: editorial
    note: >-
      Region 43 (Central Europe), for northern Germany and the eastern Netherlands. The coast east of Mecklenburg as far
      as Danzig Bay, now in Poland (region 45), is left out, as the article has other houses commoner there. The house is
      not claimed for the centre and south of Germany, where the article has other farmhouses, nor for the marshes of the
      North Sea coast, where it has the Gulf house from the sixteenth century. A region named is where the source places
      the house, not a claim that it covered the region.
