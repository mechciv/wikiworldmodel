        loc: section "Decline"
        quote: Since the middle of the 19th century fewer and fewer of these farmhouses were built
      - ref: src:wikipedia-low-german-house
        loc: section "Decline"
        quote: By the end of the 19th century this type of farmhouse was outmoded.
    method: expert-estimate
    note: >-
      The second half of the nineteenth century, when fewer and fewer were built and the type went out of use: an end of
      the building of such houses, not of the houses, many of which stand and are lived in.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-low-german-house.txt (sha256 c275f84dc2238367), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
