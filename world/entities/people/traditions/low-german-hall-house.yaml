        loc: opening section
        quote: >-
          is a type of timber-framed farmhouse found in northern Germany and the easternmost Netherlands, which combines
          living quarters, byre and barn under one roof
      - ref: src:wikipedia-low-german-house
        loc: opening section
        quote: >-
          this rural, agricultural farmhouse style was widely distributed through the North German Plain, all the way from
