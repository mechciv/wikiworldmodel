    value: { from: src:archaeoglobe-2019-regions, names: ["132"] }
    source:
      - ref: src:wikipedia-iban-people
        loc: opening section
        quote: >-
          The Iban trace their origins to the Kapuas basin in Kalimantan Barat, specifically the Ketungau tributary which
          is considered their ancestral land prior to their migration into the territory of modern-day Sarawak from the
          middle of the 16th century.
    method: editorial
    note: >-
      Region 132 (Borneo), which holds the Kapuas basin and Sarawak. The longhouses of the other peoples of Borneo, which
      the same compilation describes, are not claimed here; the region is named for the Iban.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-iban-people.txt (sha256 bfb698008c5770dd), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
