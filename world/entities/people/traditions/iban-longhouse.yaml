          After having felled the old jungle and farmed on it once, they leave it for seven years to grow up again
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. I, p. 400 (Brooke Low)"
        quote: they shift their residence nearer to it.
      - ref: src:wikipedia-iban-people
        loc: opening section
        quote: The Iban's traditional social units are based around longhouses, which serve as communal living spaces for extended families.
      - ref: src:wikipedia-iban-people
        loc: opening section
        quote: the Iban have long practiced shifting cultivation, particularly of rice
    method: documentary
    note: >-
      Shifting cultivators of hill rice: they farmed old forest once and left it seven years, and when the old forest near
      the village ran short they moved the village nearer to it.
