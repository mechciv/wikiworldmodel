  dwelling:
    prop: dwelling
    value: { plan: long, length: { lo: 163, hi: 181 }, walls: timber, roof_material: thatch, floor: stilts }
    source:
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 9 (Brooke Low)"
        quote: >-
          A Sea Dyak Village is a terrace upon posts varying in length according to the number of houses of which it is
          composed
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 9 (Brooke Low)"
        quote: The roof is thatched throughout with the same material — shingles or palm leaves
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 9 (Brooke Low)"
        quote: The outer walls are of plank, the inner of bark.
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 9 (Brooke Low)"
        quote: >-
          The latter occupies the rear of the entire building and is sub-divided into apartments, one for each family.
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 16 (James Brooke)"
        quote: >-
          594 feet in length, and the front room, or street, is the entire length of the building, and 21 feet broad.
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 16 (James Brooke)"
        quote: This edifice is raised twelve feet from the ground
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 17 (St. John)"
        quote: Sir Spencer St. John measured a Sibuyau house on the Lundu as 534 feet long containing 500 people
      - ref: src:roth-1896-natives-of-sarawak
        loc: "vol. II, p. 17 (Hornaday)"
        quote: Most of the Sibuyau village-houses are raised about eight feet above the ground
    method: documentary
    note: >-
      The village was one long house on posts, its length set by how many families it held, one room each behind an open
      gallery along the whole front; outer walls of planks, inner of bark, and a roof of nipa or pandanus leaves or of
      shingles, written as thatch. The length is the two Sibuyau houses on the Lundu that James Brooke and Spencer St. John
      measured, 594 and 534 feet, 181 and 163 m; the compilation calls a third, of 771 feet, the longest on record. These
      are the houses travellers measured for their size, so most were shorter, by how much no source read says. Most
      Sibuyau houses stood about eight feet off the ground, some twelve and some four or five.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in roth-1896-natives-of-sarawak.txt (sha256 895b9fe0da50fe7f), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
