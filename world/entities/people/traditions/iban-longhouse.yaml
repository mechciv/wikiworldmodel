id: people/traditions/iban-longhouse
kind: tradition/building
summary: >-
  The longhouse of the Iban, the Sea Dyaks of Sarawak: the whole village one long building raised on hardwood posts, its
  outer walls of planks and its roof thatched with palm leaves or shingles, divided along its length into an open gallery
  in front and a row of rooms behind, one for each family, the longest measured some 534 to 771 feet; its people farmed
  hill rice on land cleared from old forest, farmed once and left seven years, and moved the house nearer when old forest
  ran short. It starts here with the Iban's move from the Kapuas into Sarawak in the 1550s, which bounds and does not date
  it, and has no end: longhouses are still lived in.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Iban longhouse }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1550 CE
    source:
      - ref: src:wikipedia-iban-people
        loc: opening section
        quote: >-
          The Iban trace their origins to the Kapuas basin in Kalimantan Barat, specifically the Ketungau tributary which
          is considered their ancestral land prior to their migration into the territory of modern-day Sarawak from the
          middle of the 16th century.
      - ref: src:wikipedia-iban-people
        loc: section "History", "Pre-19th century"
        quote: >-
          The historical timeline of the Iban migration has been further supported by the work of Benedict Sandin (1968),
          who suggested that the Iban began their migration from the Kapuas Hulu region in the 1550s.
    method: tradition
    note: >-
      The start of the Iban's move into Sarawak, as Sandin reckoned it from their genealogies, taken as a time by which they
      lived in longhouses; they lived on the Kapuas before, in the same region, and the house is older than this, but no
      source read here dates it there. No end is given: the Iban still live in longhouses.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-iban-people.txt (sha256 bfb698008c5770dd), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  extent:
