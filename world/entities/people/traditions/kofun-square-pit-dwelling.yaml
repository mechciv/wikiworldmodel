      - ref: src:jaanus-dictionary
        loc: s.v. tateana jūkyo
        quote: >-
          this gave place to a *kamado 竈 set against a side wall and equipped with an external chimney stack in the
          Kofun period.
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 113, section 3.1"
        quote: >-
          In the latter half of the 5th century, migration from the Korean peninsula led to the adoption of stoves
          (kamado) in pit dwellings, which were typically built along the walls of a house rather than in the center.
    method: expert-estimate
    note: >-
      The dictionary has the widespread Kofun pit square, with rounded corners; West calls the dominant pits
      rectangular, which in the sense of four straight sides rather than longer than wide is taken to agree. The stove
      (kamado) against the wall has no word in the vocabulary, but the dictionary gives it an external chimney stack,
      which is "chimney". It came only in the latter half of the fifth century, so the pit houses of the third and
      fourth centuries, which this record also draws, had instead the hearth dug into the earth that West says the stove
      replaced. No size is given.
