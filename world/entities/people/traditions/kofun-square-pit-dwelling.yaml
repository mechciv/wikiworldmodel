          A square-plan type with rounded corners and four posts defining a putative
      - ref: src:jaanus-dictionary
        loc: s.v. tateana jūkyo
        quote: became extremely widespread in the Kofun period.
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 113, section 3.1"
        quote: >-
          By the Kofun period (250-710 AD), rectangular pit structures became the dominant type and by the 5th century,
