      loc: "p. 113, section 3.1"
      quote: >-
        By the Kofun period (250-710 AD), rectangular pit structures became the dominant type and by the 5th century,
        round pit structures were completely phased out
    method: expert-estimate
    note: The start of the Kofun period in the source; the change from round to rectangular began in the Late Yayoi.
