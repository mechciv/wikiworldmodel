id: people/traditions/kofun-square-pit-dwelling
kind: tradition/building
summary: >-
  The pit dwelling of the Kofun period in Japan, 250–710 CE, as it differed from the Yayoi house it came from: square in
  plan with rounded corners and four posts, the round pit given up by the fifth century, and from the later fifth
  century a clay stove (kamado) against a side wall with a chimney outside, which came with migrants from the Korean
  peninsula. It inherits the rest from people/traditions/yayoi-kofun-pit-dwelling.
author: machine:claude-code
