id: people/traditions/deccan-flat-roofed-mudbrick-house
kind: tradition/building
summary: >-
  The cultivator's house of the Maratha Deccan: oblong, of one storey, with walls of sun-dried brick and a flat roof of
  earth laid on beams, a portico along the front, two to four small dark rooms within and the cattle under the same
  roof or in sheds about a walled court; the houses stood without order inside a village wall of mud. It is described
  at Lony near Poona in 1819. The gazetteer of 1908 has the same walls in Berar, there mostly under thatch or tiles
  with flat roofs of earth also common, on an open village site beside a fort of earth. No end is given: it was still
  the ordinary house when the gazetteer was written.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Flat-roofed mudbrick house of the Deccan }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1819 CE
    source:
      - ref: src:coats-1823-township-of-lony
        loc: "p. 193 of the reprint of 1877"
        quote: The following is an enumeration of the inhabitants — July , 1819
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: the dwelling-houses of the great body of the inhabitants, made of sun-dried bricks
    method: documentary
    note: >-
      The year of the earliest account read: Coats counted the people of Lony in July 1819 and read his account of the
      township to the Literary Society of Bombay on 29 February 1820. It bounds the start and does not date it: the
      house is surely older, and no earlier account of the common house of the Deccan was read. No end is given, and
      none is known from what was read: the latest account, the gazetteer of 1908, has it as the house of its own day.
    checked:
