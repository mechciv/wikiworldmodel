        quote: of Lony being situated within thirteen miles of Poonah
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. VII, article Berar, p. 381"
        quote: The dwelling-houses of the agricultural classes are mostly of sun-dried brick roofed with thatch or tiles.
    method: editorial
    note: >-
      Region 108 (Southwestern India), which holds Poona, and so Lony within thirteen miles of it, and the districts of
      Berar, by their towns' coordinates against the region outlines. The gazetteer's general remark on the Bombay
      Presidency, mud bricks and a roof of solid earth where timber is scarce, names no district and is not used to
      place the house. The coast below the Ghats is in the region and built otherwise, the same article says: houses of
      two storeys with tiled roofs, and huts of wattle and daub thatched with grass or palm leaves. So the house is
      not claimed for all of the region.
    checked:
