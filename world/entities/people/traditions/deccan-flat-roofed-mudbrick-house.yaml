    source:
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: the dwelling-houses of the great body of the inhabitants, made of sun-dried bricks
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: with terraced tops of the same material
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: the body of the house (muzghur), which is divided into two, three, or four small rooms
      - ref: src:coats-1823-township-of-lony
        loc: "p. 192 of the reprint of 1877"
        quote: openings to admit tlie air and light
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: >-
          a sort of open portico (wosuree) runs along the front of the dwelling-house ; the poorer employ this to tie
          their cattle in, and the richer as a store-room, or keep it clean to sit in.
      - ref: src:coats-1823-township-of-lony
        loc: "p. 192 of the reprint of 1877"
        quote: A good terraced house for a cultivator and six or eight bullocks will be 30 cubits long, and 20 wide
      - ref: src:coats-1823-township-of-lony
        loc: "p. 192 of the reprint of 1877"
        quote: Two or three houses have upper stories
      - ref: src:coats-1823-township-of-lony
        loc: "p. 192 of the reprint of 1877"
        quote: >-
          The houses of the poorest inhabitants are not more than 10 or 12 feet long, 4 or 5 wide, and covered with
          grass
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. VII, article Berar, p. 381"
        quote: or flat roofs of earth, are also common
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. VII, article Berar, p. 381"
        quote: The houses of labourers consist of one or two rooms
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. VIII, article Bombay Presidency, p. 309"
        quote: >-
          Where timber is scarce, roughly made mud bricks are in use, and a foot or two of solid earth on a layer of
          rafters serves to protect the residents from the great heat and the scanty rainfall.
    method: documentary
    note: >-
      The house is Coats's of Lony in 1819: walls of sun-dried brick, a terrace of eight or ten inches of white earth
      on planks laid over small beams, a portico along the front and another behind, and between them the body of the
      house in two to four small rooms without windows. All but two or three houses were of one storey. The plan is
      oblong: a good house for a cultivator and his six or eight bullocks was 30 cubits long and 20 wide, with walls
      five cubits high. The account does not say how long its cubit is, so no size is written; at a cubit of 18
      inches, which it does not state, that house would be about 13.7 m by 9.1 m. The poorest lived in houses of 10 or
      12 feet by 4 or 5, covered with grass, which are not drawn. In Berar in 1908 the walls were of the same
      sun-dried brick, the roofs of thatch or tiles with flat roofs of earth also common, the labourer had one or two
      rooms with a small walled yard in front, and the poorest huts of hurdles or grass mats daubed with mud. No
      windows: Coats's small rooms had no openings to let in the air and light (the scan reads "the" as "tlie", and the
      quote keeps it). The veranda is his open portico along the front of the house, with another behind opening into a
      private court; the vocabulary's porch is a porch before a door, and this ran the length of the front, so it is
      written as a veranda. The cattle under the roof are the poorer cultivators', tied in that portico, and the good
      house of 30 cubits by 20 was one "for a cultivator and six or eight bullocks"; the better houses had sheds for
      their cattle about a walled court besides, which the outbuildings claim lists. Coats says all the houses had
      square gable-ends while their tops were terraced, which the roof's one word does not hold; the walls of five
      cubits and the doors of three by one and a half are left out, as the length of his cubit is not stated. Which
      way the door faced, how the smoke left and how the walls were finished are not said.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in coats-1823-township-of-lony.txt (sha256 7365f9e73aa7ab4f) and imperial-gazetteer-of-india-1908.txt (sha256 6cdf9985eed79137), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  settlement:
    prop: settlement_form
    value: { pattern: walled, enclosure: wall, yard: wall, houses: 107, household: 5 }
    source:
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: >-
          the best are surrounded by a square dead wall, which is entered by a low door; two or three sides are
          occupied by sheds for cattle, husbandry implements, &c., and one only by the dwelling-house ; if a wall does
          not inclose the whole, there is a walled court in front, or in the rear, or both.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. VII, article Berar, p. 381"
        quote: with a small dngan or yard enclosed by a mud wall in front of the house.
      - ref: src:coats-1823-township-of-lony
        loc: "pp. 190–191 of the reprint of 1877"
        quote: >-
          the whole is surrounded by a mud wall of a circular form … is from 10 to 14 feet in height, and 4 or 5 feet
          thick at the bottom
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: The inhabited dwelling-houses amount to 107
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: narrow, dirty, crooked lanes wind through amongst some of them
      - ref: src:coats-1823-township-of-lony
        loc: "p. 194 of the reprint of 1877"
        quote: >-
          The number of houses is 107, in a few of which are more than one family … the proportion of persons to each
          house is rather more than five
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. I, chapter IX, p. 456"
        quote: Sometimes, as in the Deccan, the people reside in walled and fortified villages
    method: survey
    note: >-
      A village inside a wall, as Lony was in 1819, within a mud wall five furlongs round with two gates, its houses
      set down without order, some in clusters of three or four and some detached, among narrow crooked lanes; the
      gazetteer of 1908 still has the people of the Deccan in walled and fortified villages. In Berar it says the
      village site was not walled, and each village had a fort of earth as a refuge. The 107 houses are those of the
      one township counted. Five to a house is Coats's "rather more than five", from his count of 568 inhabitants in
      those houses, a few of which held more than one family; the census of 1901 found a mean of 5·2 for India, from
      which the gazetteer says Bombay differs little. In the first quote the ellipsis stands for a footnote and the
      turn of the page, between which the wall's girth of five furlongs is given. The enclosure is that mud wall round
      the village. Each house's yard was walled: at Lony the best houses stood within a square dead wall, the others
      with a walled court before or behind or both, and in Berar in 1908 the labourer's house had a small yard walled
      with mud in front of it (the scan misreads its name, angan).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in coats-1823-township-of-lony.txt (sha256 7365f9e73aa7ab4f) and imperial-gazetteer-of-india-1908.txt (sha256 6cdf9985eed79137), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
