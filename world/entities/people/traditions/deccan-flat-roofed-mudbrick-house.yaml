      - { use: shrine, per: settlement, plan: square, width: 7.9, length: 7.9, roof: flat, roof_material: earth }
      - { use: shrine, per: settlement, roof_material: tile }
    source:
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: >-
          two or three sides are occupied by sheds for cattle, husbandry implements, &c., and one only by the dwelling-house
      - ref: src:coats-1823-township-of-lony
        loc: "p. 191 of the reprint of 1877"
        quote: >-
          the public buildings are the Chowree, or town-hall ; three Hindoo temples, one dedicated to Mahadeo, one to
          Hanuman, and the third to Byroo
      - ref: src:coats-1823-township-of-lony
        loc: "p. 192 of the reprint of 1877"
        quote: >-
          is a building 30 feet square, with square gable-ends, and a roof of tiles supported on a treble row of square
          wooden posts
      - ref: src:coats-1823-township-of-lony
        loc: "p. 193 of the reprint of 1877"
        quote: >-
          The temple of Mahadeo is built of hewn stone, and lime, with a terraced roof of the same materials; it is
          about 16 feet long and 10 wide
      - ref: src:coats-1823-township-of-lony
        loc: "p. 193 of the reprint of 1877"
        quote: >-
          The temple of Hanuman is a building 26 fset square, with a flat roof terraced with white earth, open in front
      - ref: src:coats-1823-township-of-lony
        loc: "p. 193 of the reprint of 1877"
        quote: The temple of Byroo is a tiled building, open in front
    method: documentary
    note: >-
      All from Coats's Lony of 1819, one township, set down for the tradition. The cattle sheds are the better houses':
      two or three sides of the square walled court were taken up by sheds for cattle and husbandry implements, and
      one by the house; the poorer tied their cattle in the portico, which the dwelling claim says. The town hall, the
      Chowree, where the township's business was done and travellers lodged, was 30 feet square under a roof of tiles
      with square gable-ends, 9.1 m by the writer's conversion. The three temples are the village's: Mahadeo's of hewn
      stone and lime with a terraced roof of the same, 16 feet by 10 (4.9 by 3.0 m); Hanuman's 26 feet square (7.9 m)
      with a flat roof terraced with white earth on rows of wooden posts, open in front (the scan misreads "feet" as
      "fset", and the quote keeps it); Byroo's a mean tiled building open in front, whose size is not given. A ruined
      mosque of 10 cubits by 5 is left out. Every village is drawn with these, though Coats counts them for Lony alone.
