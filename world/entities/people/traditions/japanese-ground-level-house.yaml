id: people/traditions/japanese-ground-level-house
kind: tradition/building
summary: >-
  The ground-level house of Japan's farmers from the Nara period on: a house whose floor is at the level of the ground,
  with walls of its own rather than a roof coming down to the earth, on a timber frame whose posts were set in the
  ground (hottatebashira). It replaced the pit dwelling in western Japan by the early eighth century and became the
  usual house of the east and north in the Heian and early medieval periods; foundation stones spread to farmhouses
  only slowly, and earthfast posts were still used in them in the mid-eighteenth century. A broad record, with little
  said of the house beyond its floor, standing for Japan's farmers until the farmhouse of the Edo period
  (people/traditions/edo-farmhouse-minka), which is a member of it.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Ground-level house of Japan }
    unsourced: An editorial label.
  start:
    prop: start
    value: 710 CE
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "pp. 99–100, section 1.3.1"
        quote: >-
          During the Nara period (710–794 AD), pit structures were almost entirely replaced by surface structures in
          western Japan but continued to be used in parts of eastern Japan until the end of the Heian period (794–1185
          AD)
      - ref: src:jaanus-dictionary
        loc: s.v. heichi jūkyo
        quote: >-
          appear to have become common in western Japan during the course of the Kofun period, superseding
          pit-dwellings. They gradually became dominant in the east and north too during the Heian and early medieval
          periods.
    method: expert-estimate
    note: >-
      The start of the Nara period, when the pit dwelling had given way in western Japan. In the east the pit dwelling
      was still the usual house until the end of the Heian period, in 1185, so for eastern Japan this record starts
      too early; the region cannot be split here.
