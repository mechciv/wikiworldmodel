        loc: "p. 108, section 2.3"
        quote: >-
          In state societies where both pit dwellings and surface dwellings were used, such as Unified Silla–Goryeo
          period Korea, and Nara–Heian period Japan, pit houses were often relegated to rural settlements and the urban
          capital sites used surface structures.
      - ref: src:yun-ko-lee-pyeonggeo-dong
        loc: section "Succession of farming villages"
        quote: >-
          Both the expansion of agricultural fields and the increased number of residential features reflect, however,
          an influx of people to the region during the Three Kingdom period.
    method: editorial
    note: >-
      Farmers of rural settlements. Pit houses were also used at provincial towns of Unified Silla (West, p. 100), but
      not in its capital, and no townspeople's house is written for Korea before 1392, so townspeople are not named.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279) and yun-ko-lee-pyeonggeo-dong.txt (sha256 aa2af5d29a405c58), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
