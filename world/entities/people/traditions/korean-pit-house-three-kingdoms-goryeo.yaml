    value: 300 BCE
    source:
      ref: src:west-2025-pit-to-surface-structures
      loc: "p. 100, section 1.3.1"
      quote: >-
        Pit houses continued to be used throughout the peninsula during the Proto-Three Kingdoms and Three Kingdoms
        periods (300 BC–668 AD)
    method: expert-estimate
    note: >-
      The start of the Proto-Three Kingdoms period in the source, where the Mumun pit house
      (people/traditions/mumun-pit-house) ends.
    checked:
