id: people/traditions/korean-pit-house-three-kingdoms-goryeo
kind: tradition/building
summary: >-
  The pit house of Korea's farmers after the Mumun period, from the Proto-Three Kingdoms, about 300 BCE, through the
  Three Kingdoms, Unified Silla and Goryeo, to 1392: a house dug into the ground, in the Mahan-Baekje sphere either
  pentagonal or hexagonal with an entrance passage at the side (in the centre of the peninsula) or square with four
  posts, entered by a ladder from the roof (in the southwest), with a cooking and heating place against the wall
  opposite the door and a chimney outside. In the capitals surface buildings replaced it, in Baekje's from the Ungjin
  period (475–538) and in Unified Silla's capital entirely; in the countryside it stayed the main house through Goryeo,
  and some were still built in the sixteenth and seventeenth centuries. Around the villages lay rice paddies.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Pit house of Korea from the Proto-Three Kingdoms to Goryeo }
    unsourced: An editorial label.
  start:
