        loc: section "Residential culture of the Baekje center", "Pillar-wall buildings"
        quote: >-
          The first type of pit dwellings had a pentagonal or hexagonal floor and a separate entrance structure for an
          access from the side added to the main structure of the house, and predominated in the central region of
          Korea
      - ref: src:kwon-2015-baekje-royal-city-periphery
        loc: section "Residential culture of the Baekje center", "Pillar-wall buildings"
        quote: >-
          The second type were “four-pillar type” (四柱式) houses, which were sunken structures, square in shape, with four
          pillars; the houses were entered directly from the roof to the house floor below by using a ladder.
      - ref: src:kwon-2015-baekje-royal-city-periphery
        loc: section "Decorated chimney caps"
        quote: >-
          From the Proto-Three Kingdoms Period, cooking and heating facilities were installed along the wall opposite
          the entrance in dwellings
    method: excavation
    note: >-
      A sunken floor, in both of the Mahan-Baekje types. The plan is left out: one type was pentagonal or hexagonal (no
      word in the vocabulary), the other square, and they held different parts of the peninsula, which one region
      cannot tell apart. No size is given by any source read here.
    checked:
