    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 100, section 1.3.1"
        quote: >-
          Pit houses continued to be the main dwelling type in rural settlements after the unification of the peninsula
          by Goryeo (935–1392 AD)
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 100, section 1.3.1"
        quote: and pit houses continued to be used in the 16th and 17th centuries during the Joseon period
    method: expert-estimate
    note: >-
      The end of Goryeo, the last period in which the source calls the pit house the main rural dwelling. Pit houses
      were still built under the Joseon, which this record leaves to the thatched house
      (people/traditions/korean-thatched-house-choga); when the thatched surface house took over is not dated by any
      source read here.
