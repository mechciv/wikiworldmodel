    method: editorial
    note: >-
      Settled foragers: fishers, hunters and gatherers who lived in their plank houses in winter villages and took the
      planks to their summer camps.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in rorabaugh-2023-salish-sea-population.txt (sha256 896cc5caefa56cd3) and mashford-pringle-2023-indigenous-building-structures.txt (sha256 738a150881c2faa4), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  dwelling:
