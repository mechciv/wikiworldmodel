          in length
      - ref: src:mashford-pringle-2023-indigenous-building-structures
        loc: 'section 3.1, "Identified Themes", on the longhouse and plank house'
        quote: >-
          Both the longhouse and the plank house were pole-and-beam log structures designed to house several generations
          together under the same roof
    method: excavation
    note: >-
      Rectangular, walled with planks on a frame of posts and beams; the size is that of the one early house at Palmrose,
      as its excavators' notes give it. Later houses were often far larger, and the review says they varied in size with
      the community's needs, but no size of them was read here. The roof is not described in the sources read, and is the
      generator's.
