id: people/traditions/korean-thatched-house-choga
kind: tradition/building
summary: >-
  The thatched house (choga) of Korea's farmers and the poor under the Joseon dynasty, from 1392: a timber frame on a
  platform under a roof of rice straw, renewed every one to three years, with walls of wattle and daub or, later, rammed
  earth, inside a low earth wall (todam). Its plan followed region and means: rooms in a straight line in the south, an
  L in the centre and around Seoul, a closed square in the cold north; the poorest lived in a small rectangle of earth
  walls under straw. Through the sixteenth and seventeenth centuries the heated floor (ondol) spread, and in the late
  Joseon it was widely used in these houses. Choga remained the house of the working people until the mid-twentieth
  century.
author: machine:claude-code
