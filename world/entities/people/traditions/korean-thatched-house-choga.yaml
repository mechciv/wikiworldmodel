  name:
    prop: name
    value: { en: Thatched house of Korea (choga) }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1392 CE
    source:
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 103, Introduction"
        quote: Joseon (1392–1910), born from the dynasty-changing revolution
      - ref: src:wikipedia-choga-architecture
        loc: opening section
        quote: >-
          Choga was the representative housing for the working class in Korea from prehistoric times until mid 20th
          century.
    method: expert-estimate
    note: >-
      The start of the Joseon dynasty, from when the record has the thatched surface house as the farmers' house. It is
      a choice: the encyclopedia makes the choga far older, and pit houses were still built in the sixteenth and
      seventeenth centuries (West 2025, p. 100); the pit house of people/traditions/korean-pit-house-three-kingdoms-goryeo
      is drawn before 1392. No end is given: the choga declined from the 1960s, past this record's span.
