    method: expert-estimate
    note: >-
      Walls of wattle and daub, the earlier way, which rammed earth joined over a time the article does not date; a
      narrower record of the later house should give rammed earth. A roof of rice straw. The plan is left out: the
      layouts were L-shaped, in a line or square by region, and the vocabulary has no L. The heated stone floor (ondol)
      of the late Joseon has no word of its own; "raised" would misdraw the earlier houses, so the floor is left out.
      No size is given by any source read here.
    checked:
