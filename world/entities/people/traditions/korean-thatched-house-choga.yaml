    value: { walls: wattle-and-daub, roof_material: thatch }
    source:
      - ref: src:wikipedia-choga-architecture
        loc: opening section
        quote: The main building materials used to build these houses are straw, wood and soil.
      - ref: src:wikipedia-choga-architecture
        loc: section "Building techniques and materials"
        quote: Earlier models of choga were most commonly built using the wattle and daub technique.
      - ref: src:wikipedia-choga-architecture
        loc: section "Building techniques and materials"
        quote: >-
          Over time, rammed earth became another popular building technique as it has better thermal mass property and
          is more resistant against earthquake compared to wattle and daub.
      - ref: src:wikipedia-choga-architecture
        loc: section "Building techniques and materials"
        quote: The roof of the house is most commonly covered with rice straw due to its inexpensiveness and abundance.
