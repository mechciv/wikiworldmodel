id: people/traditions/yayoi-kofun-pit-dwelling
kind: tradition/building
summary: >-
  The pit dwelling of the rice farmers of Japan in the Yayoi and Kofun periods, about 950 BCE to 710 CE: a floor dug
  into the ground under a roof of thatch or sod on posts, its rafters bedded on a low bank of the dug earth so that the
  roof came down nearly to the ground. Raised-floor buildings stood beside the houses, most of them thought to be
  granaries, and in the Middle and Late Yayoi large raised-floor halls for elites at political centres. Round and
  rectangular pits were both built; in the Kofun period a square pit with four posts and, from the later fifth
  century, a clay stove against a wall became the rule (people/traditions/kofun-square-pit-dwelling). In western Japan
  the pit dwelling gave way to ground-level houses by the early eighth century; in eastern Japan it lasted into the
  twelfth, which this record does not follow (people/traditions/japanese-ground-level-house).
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Pit dwelling of the Yayoi and Kofun periods }
    unsourced: An editorial label.
  start:
    prop: start
    value: 950 BCE
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, note 6"
        quote: Northern Kyushu was the first region to adopt the Yayoi culture in 950 cal BC
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          Despite these revolutionary changes in subsistence, settlement pattern, and material culture, pit structures
          continued to be the most common dwelling type throughout the period.
    method: expert-estimate
    note: >-
      The start of the Yayoi period in northern Kyushu, in the dates West takes from Fujio (2009), which West calls a
      matter of ongoing debate; on p. 99 the same paper gives 965 cal BC. The Yayoi reached the Chubu region last, and
      the Jōmon pit dwelling (people/traditions/jomon-pit-dwelling) is drawn for Japan's foragers until about 350 BCE.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  end:
    prop: end
    value: 710 CE
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "pp. 99–100, section 1.3.1"
        quote: >-
          and Kofun period (250–710 AD), pit houses were the primary dwelling form used in mainland Japan (the islands of
          Kyushu, Shikoku, and Honshu).
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 113, section 3.1"
        quote: >-
          Pit dwellings in western Japan decreased in size and eventually disappeared between the late 7th century and
          early 8th century AD
    method: expert-estimate
    note: >-
      The end of the Kofun period, when the source has the pit dwelling end as the main house of western Japan. In
      eastern Japan pit dwellings went on until the end of the twelfth century (same page); the ground-level house of
      people/traditions/japanese-ground-level-house is drawn for the whole region after 710.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  extent:
