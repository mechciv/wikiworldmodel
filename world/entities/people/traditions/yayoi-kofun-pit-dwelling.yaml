    value: { from: src:archaeoglobe-2019-regions, names: ["124"] }
    source:
      ref: src:west-2025-pit-to-surface-structures
      loc: "pp. 99–100, section 1.3.1"
      quote: >-
        and Kofun period (250–710 AD), pit houses were the primary dwelling form used in mainland Japan (the islands of
        Kyushu, Shikoku, and Honshu).
    method: editorial
    note: >-
      Region 124 (Japan), for Kyushu, Shikoku and Honshu. Hokkaido and the Ryukyus, where the source has other peoples'
      pit houses, are in the region too and are not claimed for this tradition.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  lifeway:
    prop: lifeway
    value: [farmers]
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          During the Yayoi period (950 cal BC–250 AD) … intensive rice agriculture and sedentism became firmly
          established throughout the Japanese archipelago, except in the Ryukyu Islands and Hokkaido.
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          Despite these revolutionary changes in subsistence, settlement pattern, and material culture, pit structures
          continued to be the most common dwelling type throughout the period.
    method: editorial
    note: >-
      Settled rice farmers lived in these houses. Elites at the political centres lived in raised-floor buildings (pp.
      111–113), which are not this house; no source read puts townspeople in pit dwellings here.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  dwelling:
    prop: dwelling
    value: { walls: none, roof_material: thatch, floor: sunken }
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          In mainland Japan (Honshu, Kyushu and Shikoku), pit structures typically have one or more of the following
          components: 1) a thatch or sod roof supported by posts; 2) storage pits dug into the floor
      - ref: src:jaanus-dictionary
        loc: s.v. tateana jūkyo
        quote: >-
          Though occasionally dwarf walls were used, the ends of the rafters were generally bedded upon a low peripheral
          baulk made from the excavated earth, and the roof extended virtually to ground level.
      - ref: src:jaanus-dictionary
        loc: s.v. tateana jūkyo
        quote: To judge from archaeological evidence, during the Jōmon, Yayoi and Kofun periods, this was perhaps the most common Japanese house type.
    method: expert-estimate
    note: >-
      A pit roofed with thatch or sod, the roof coming down to a bank of the dug earth: so no walls. Sod is the other
      roof the source names, and is left to a narrower record. The plan was round or rectangular, varying by time and
      region, so it is left out here, as is a size: the dictionary's range, 2.5 by 2.5 m to a long house of 31 by 9 m,
      is for pit dwellings of all periods together.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279) and jaanus-dictionary.txt (sha256 9d242cd750c47f8e), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  outbuildings:
    prop: outbuildings
    value:
      - { use: granary, per: settlement, floor: stilts }
    source:
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          Raised-floor buildings are built at many settlement sites, and most are thought to have been used as
          granaries.
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 112, section 3.1"
        quote: >-
          The most common surface structures in Japanese archaeology are pillared-buildings (hottate-bashira tatemono
          掘立柱建物), subdivided into raised-floor buildings
      - ref: src:west-2025-pit-to-surface-structures
        loc: "p. 114, section 3.2"
        quote: >-
          both pit structures and raised-floor structures were used for food storage from the Yayoi period onwards.
    method: expert-estimate
    note: >-
      The raised-floor buildings of the Yayoi settlements, most of them thought to be granaries: a building on posts set
      in the ground with its floor lifted above it, written "stilts". West speaks of them at settlement sites, not of
      one to a household, so they are the settlement's, and how many stood in one is left to the generator; their plan
      and size are not given. The large raised-floor halls of the Middle and Late Yayoi stood only at political centres,
      such as Makimuku and Ikegami Sone, as elites' houses or for ritual, and are not written for every settlement. The
      storage pits dug into the floors of the pit houses are not outbuildings.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in west-2025-pit-to-surface-structures.txt (sha256 62e9aa916ad8c279), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
