id: people/traditions/loess-plateau-yaodong
kind: tradition/building
summary: >-
  The yaodong, the cave dwelling of the farmers of the Loess Plateau: rooms with a rectangular floor and an arched top
  cut straight into the loess, the earth itself their walls and roof, dug into a cliff with a yard before them or, on
  the flat tablelands, into the four sides of a square pit six or seven metres deep that serves as the court. Caves
  were lived in on the loess from the late Neolithic; this record is the dwelling of historical times, from the Han,
  when the sources have it holding its own while houses elsewhere came to be built of masonry and timber, to the
  present. Some forty million people were said to live in such caves in the late twentieth century. No end is given.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Cave dwelling of the Loess Plateau (yaodong) }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 206 BCE, hi: 220 CE }
    source:
      - ref: src:wikipedia-yaodong
        loc: section "Origins"
        quote: >-
          Chinese scholars generally believe that this type of habitat was developed mainly from the Han dynasty (206
          BC to 220 AD) on
      - ref: src:zhang-2021-silo-caves
        loc: 'Results, section "Historical evolution"'
        quote: >-
          During the Qin and Han dynasties (2000 years ago), the masonry-timber structure gradually replaced the
          earth-timber structure and emerged as the main house form in China at that time. However, due to the
          traditional culture and economic limitation of the economy, cave dwellings remained an important dwelling
          form for residents in the loess area
    method: expert-estimate
    note: >-
      The Han, as the encyclopedia dates it, from which the cave dwelling of historical times is said to have been
      developed; the range is the whole dynasty. It is a late bound and not an origin. The second source has caves cut
      in the loess from about 5000 years ago, in the late Yangshao, more of them under the Longshan and in the Bronze
      Age, and the first has underground dwellings of the second millennium BCE: those older caves are not this record,
      as nothing read gives their size, and a record of them is still to write. No end is given: the caves are lived in
      today, though the second source has people leaving them since the 1980s.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-yaodong.txt (sha256 a3cd3b88842d8e0a) and zhang-2021-silo-caves.txt (sha256 db56dca673041d41), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  extent:
    prop: extent
    value: { from: src:archaeoglobe-2019-regions, names: ["119"] }
    source:
      - ref: src:wikipedia-yaodong
        loc: section "Geographic distribution"
        quote: >-
          The yaodong homes are common on the Loess Plateau of China in the North, and are found mainly in five
          provinces: Gansu, Shaanxi, Shanxi, Henan, and the Hui Autonomous Region of Ningxia.
      - ref: src:wikipedia-yaodong
        loc: section "Geographic distribution"
        quote: >-
          In the Qingyang, Gansu region, the ratio of cave dwellers to non-cave dwellers is the highest found anywhere
          in China.
      - ref: src:zhou-2002-yaodong-thermal-environment
        loc: "section 1, Introduction, p. 81"
        quote: Taking Zaoyuan village (in Yan’an city, SHAANXI Province) as a model area
      - ref: src:zhang-2021-silo-caves
        loc: Abstract
        quote: >-
          The research shows that silo-cave villages are mainly distributed in economically underdeveloped areas, such
          as West Henan (Yuxi), South Shanxi (Jinnan), Central Shaanxi (Guanzhong), and East Gansu (Longdong).
    method: editorial
    note: >-
      Region 119 (North Central China), which holds Shaanxi, Gansu and Ningxia, by the coordinates of Yan'an, Qingyang
      and their chief cities against the region outlines. Shanxi and western Henan, where the sources have the caves as
      well and where the caves whose depth is given here were measured, lie in region 120 (Northern China). That region
      is left out on purpose: most of it is the North China plain, and a region named is drawn over all its land, so
      that naming it would put the farmers of the plain in caves. The caves of Shanxi and western Henan want a finer
      extent than these regions give. The dwelling is not claimed for all of region 119 either: courtyard houses were
      built there too (people/traditions/north-china-courtyard-house).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-yaodong.txt (sha256 a3cd3b88842d8e0a), zhou-2002-yaodong-thermal-environment.txt (sha256 614bc63a17fcd444) and zhang-2021-silo-caves.txt (sha256 db56dca673041d41), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
