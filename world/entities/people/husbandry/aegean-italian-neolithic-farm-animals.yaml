id: people/husbandry/aegean-italian-neolithic-farm-animals
kind: tradition/husbandry
summary: >-
  The cattle, sheep, goats and pigs that seafaring colonists from south-west Asia brought to coastal Greece and the Aegean islands about 9,000 to 8,000 years ago, and to Italy about 8,000 years ago.
author: machine:claude-code
