    value: { lo: 9 ka, hi: 8 ka }
    source:
      ref: src:zeder-2008-mediterranean
      loc: "The Diffusion of Animal Domesticates in the Mediterranean Basin"
      quote: "at ca. 9,000 to 8,000 B.P., carried many components of the full Neolithic package (plant and animal domesticates"
    method: expert-estimate
    note: >-
      Calibrated ages, for Greece; Italy followed about 8,000 years ago. The animals are still kept, so there is no end claim.
