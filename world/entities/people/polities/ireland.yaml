id: people/polities/ireland
kind: polity
summary: >-
  The Irish state, founded as the Irish Free State on 6 December 1922, when all of Ireland but
  Northern Ireland left the United Kingdom, which went on without it. It gave itself a new
  Constitution and the name Ireland (Éire) on 29 December 1937, and has been described as the
  Republic of Ireland since 18 April 1949: one state throughout, as its own Constitution and
  British law both treat it.
  Wikidata has no item for the whole. Its Irish Free State (Q31747) and its Ireland (Q27, whose
  preferred inception is 29 December 1937) are the state under each of its two constitutions,
  and are given on those phases.
author: machine:claude-code
phases:
  - id: free-state
    label: Under the Constitution of 1922
    same_as: { wikidata: Q31747 }
  - id: constitution-1937
    label: Under the Constitution of 1937
    same_as: { wikidata: Q27 }
claims:
  name-irish-free-state:
    prop: name
    value: { en: Irish Free State, ga: Saorstát Eireann }
    valid: { lo: { ref: people/polities/ireland, edge: start }, hi: { ref: "@free-state", edge: end } }
    source:
      - ref: src:constitution-of-the-irish-free-state-act-1922
        loc: "Second Schedule (the Treaty), Article 1"
        quote: and shall be styled and known as the Irish Free State
      - ref: src:constitution-of-the-irish-free-state-act-1922
        loc: preamble
        quote: hereby proclaims the establishment of The Irish Free State (otherwise called Saorstát Eireann)
    note: >-
      The name the Treaty of 1921 gave the state to be, in English, and the Irish name its own
      Act sets beside it, spelt as that Act spells it.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in constitution-of-the-irish-free-state-act-1922.txt (sha256 95a8eec68b54a395), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  name-ireland:
    prop: name
    value: { en: Ireland, ga: Éire }
    valid: { lo: { ref: "@constitution-1937", edge: start } }
    source:
      - ref: src:constitution-of-ireland-1937
        loc: "Article 4"
        quote: The name of the State is Éire, or, in the English language, Ireland.
      - ref: src:constitution-of-ireland-1937
        loc: title page
        quote: In operation as from 29th December, 1937
      - ref: src:eire-confirmation-of-agreements-act-1938
        loc: "section 1"
        quote: The territory which, in accordance with the provisions of the Irish Free State (Agreement) Act, 1922, and the Irish Free State Constitution Act, 1922, (Session 2) was required to be styled and known as the Irish Free State shall be styled and known as Eire
    rank: preferred
    note: >-
      The state's name since its second Constitution, and today's, preferred as the label. A
      renaming and not a new state: British law answered in 1938 that the same territory "shall
      be styled and known as Eire", taking the Irish name into English and not the English one,
      which is also the island's.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in constitution-of-ireland.txt (sha256 c9749b4c0848b0c0) and eire-confirmation-of-agreements-act-1938.txt (sha256 3e285ef7edda1887), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  name-republic-of-ireland:
    prop: name
    value: { en: Republic of Ireland }
    valid: { lo: 18 April 1949 CE }
    source:
      - ref: src:republic-of-ireland-act-1948
        loc: "section 2"
        quote: It is hereby declared that the description of the State shall be the Republic of Ireland.
      - ref: src:republic-of-ireland-act-commencement-order-1949
        loc: "article 2"
        quote: The 18th day of April, 1949, is hereby appointed as the day on which The Republic of Ireland Act, 1948 (No. 22 of 1948), shall come into operation.
      - ref: src:ireland-act-1949
        loc: "section 1(3)"
        quote: by the name attributed thereto by the law thereof, that is to say, as the Republic of Ireland
    note: >-
      In Irish law a description of the State, whose name stays Ireland; in the British Act that
      answered it, the state's name. It is written as a name in use beside the other, because
      the vocabulary has one kind of name and no way to say whose usage a name is.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in republic-of-ireland-act-1948.txt (sha256 1f605a60327767b8), republic-of-ireland-act-commencement-order-1949.txt (sha256 3dfde2bf04376456) and ireland-act-1949-enacted.txt (sha256 22d4e5fc32a9f720), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  start:
    prop: start
    value: 6 December 1922 CE
    source:
      - ref: src:irish-free-state-proclamation-1922
        loc: "p. 8690"
        quote: to the intent that the said Constitution shall come into operation forthwith, do hereby announce and proclaim that the Constitution of the Irish Free State as the same was passed and adopted by the said Constituent Assembly has been passed and adopted by Parliament
      - ref: src:irish-free-state-proclamation-1922
        loc: "p. 8690"
        quote: Given at Our Court at Buckingham Palace, this Sixth day of December, in the year of our Lord One thousand nine hundred and twenty-two
      - ref: src:constitution-of-the-irish-free-state-act-1922
        loc: "First Schedule (the Constitution), Article 83"
        quote: not later than the sixth day of December, Nineteen hundred and twenty-two, by Proclamation of His Majesty, and this Constitution shall come into operation on the issue of such Proclamation
      - ref: src:irish-free-state-constitution-act-1922
        loc: "section 1"
        quote: shall come into operation on the same being proclaimed by His Majesty in accordance with Article eighty-three of the said Constitution
    method: documentary
    note: >-
      The Free State began when its Constitution came into operation, which the Irish and the
      British Act alike hung on the King's proclamation. That was given on 6 December 1922, the
      last day allowed and a year to the day after the Treaty was signed. The two Acts rest the
      Constitution on different authority: the Irish constituent assembly enacted it "in the
      exercise of undoubted right" and had already proclaimed the Free State's establishment
      in its own Act, whose day the text read does not give; the British Act, of 5 December,
      made it the Constitution by authority of Parliament. They agree on the day.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in london-gazette-32775.txt (sha256 87b003344c0694f8), constitution-of-the-irish-free-state-act-1922.txt (sha256 95a8eec68b54a395) and irish-free-state-constitution-act-1922.txt (sha256 808f1cd6f0b8af68), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  free-state-end:
    prop: end
    subject: "@free-state"
    value: 29 December 1937 CE
    source:
      - ref: src:constitution-of-ireland-1937
        loc: title page
        quote: In operation as from 29th December, 1937
      - ref: src:constitution-of-ireland-1937
        loc: "Article 48"
        quote: shall be and are hereby repealed as on and from that date
      - ref: src:constitution-of-ireland-1937
        loc: "Article 49.3"
        quote: The Government shall be the successors of the Government of Saorstát Éireann as regards all property, assets, rights and liabilities.
    method: documentary
    note: >-
      The Constitution of 1937 repealed that of Saorstát Éireann from the day it came into
      operation, and carried the state over: its citizens became citizens of Ireland (Article
      9), its laws stayed in force (Article 50) and its Government's property and debts passed
      to the new one. The same day is written again in the spans of the two names, since a
      name's span cannot point to a phase.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in constitution-of-ireland.txt (sha256 c9749b4c0848b0c0), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  territory:
    prop: territory
    value:
      from: src:cliopatria-0.2.1
      names: [Irish Free State, Éire]
    source: { ref: src:cliopatria-0.2.1, loc: rows named Irish Free State and Éire }
    method: compilation
    basis: reconstruction
    note: >-
      The dataset gives the state under two names, Irish Free State for 1922 to 1937 and Éire
      from 1938 to 2024; here they are one state. It changes the name with the calendar year,
      and keeps for all the years since a name the state has in Irish only.
relations:
  from-united-kingdom:
    rel: arose-from
    to: people/polities/united-kingdom
    source:
      - ref: src:constitution-of-the-irish-free-state-act-1922
        loc: "Second Schedule (the Treaty), Article 5"
        quote: The Irish Free State shall assume liability for the service of the Public Debt of the United Kingdom as existing at the date hereof
      - ref: src:irish-free-state-constitution-act-1922
        loc: "section 2(1)(b)"
        quote: to or from any other part of the United Kingdom
      - ref: src:irish-free-state-constitution-act-1922
        loc: preamble
        quote: the rest of the United Kingdom
      - ref: src:ireland-act-1949
        loc: "section 1(2)"
        quote: Northern Ireland remains part of His Majesty's dominions and of the United Kingdom
    note: >-
      A secession in which the parent went on. The Free State was made of land that had been
      part of the United Kingdom, took a share of its debt, and left what the British Act calls
      the rest of the United Kingdom, with Northern Ireland, which the Treaty let stay out
      (Articles 11 and 12), still in it. The United Kingdom has no end here and no new record:
      it is the same state, smaller, and from 1927 under a changed name.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in constitution-of-the-irish-free-state-act-1922.txt (sha256 95a8eec68b54a395), irish-free-state-constitution-act-1922.txt (sha256 808f1cd6f0b8af68) and ireland-act-1949-enacted.txt (sha256 22d4e5fc32a9f720), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
