        loc: "Results and Discussion"
        quote: "Hazelnuts (Corylus avellana), a key comestible for Mesolithic communities before the arrival of agriculture, dominate the starchy plant data up to ∼4000 BCE, decline in relative popularity with the earliest Neolithic"
    method: compilation
    note: >-
      Arrival of Neolithic cereal farming in Britain and Ireland around 4000 BCE, bracketed editorially by ±100 years.
