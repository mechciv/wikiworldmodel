id: people/agriculture/britain-ireland-mixed-farming
kind: tradition/agriculture
summary: >-
  Cereal farming in Britain and Ireland from the Early Neolithic onward, anchored by wheat and barley, with oats entering in consequential amounts from the Roman period.
author: machine:antigravity
