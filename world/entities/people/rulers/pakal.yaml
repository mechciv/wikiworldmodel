        quote: E6-F6 (9.9.2.4.8) 5 Lamat 1 Mol (accession date)
    method: documentary
    rank: preferred
    note: >-
      His accession as Mathews and Schele give it, 5 Lamat 1 Mol in the Calendar Round. Its day
