id: people/rulers/pakal
kind: person
summary: >-
  Ruler of the Maya city of Palenque, whose birth, accession and death are carved at the site in
  the Maya Long Count.
author: machine:claude-code
same_as: { wikidata: Q371384 }
phases:
  - id: before
    label: Before his reign
  - id: reign
    label: Lord of Palenque
claims:
  name:
    prop: name
    value: { en: "K'inich Janaab' Pakal" }
    source:
      ref: src:mathews-schele-1974-lords-of-palenque
      loc: "text"
      quote: Lord Shield Pacal
    note: >-
      Mathews and Schele call him Lord Shield Pacal, after the sign for his name; the label
      K'inich Janaab' Pakal is Wikidata's, the later reading.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mathews-schele-1974-lords-of-palenque.txt (sha256 bb8f9f4893ca49da), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  start-long-count:
    prop: start
    value: 9.8.9.13.0 Long Count
    source:
      - ref: src:mathews-schele-1974-lords-of-palenque
        loc: "online text, page 2 (RT01_lords002.html)"
        quote: his birthdate was 9.8.9.13.0 8 Ahau 13 Pop in the Maya Long Count
      - ref: src:mathews-schele-1974-lords-of-palenque
        loc: "online text, page 15 (RT01_lords015.html)"
        quote: the birth of Lord Shield Pacal on 9.8.9.13.0 8 Ahau 13 Pop
    method: documentary
    rank: preferred
    note: >-
      His birth as Mathews and Schele give it, with its place in the Calendar Round, 8 Ahau 13
      Pop. Which day of our calendar that was is not written here: it follows the correlation
      chosen on people/calendars/long-count-zero-day, as every date in the Long Count does. On
      page 21 of the online text the date stands once as 9.9.8.13.0, with the same 8 Ahau 13
      Pop: two places exchanged, in the paper or in its transcription.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mathews-schele-1974-lords-of-palenque.txt (sha256 bb8f9f4893ca49da), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  start:
    prop: start
    value: { lo: 21 March 603 CE, hi: 23 March 603 CE }
    source:
      - ref: src:mathews-schele-1974-lords-of-palenque
        loc: "text, on the name glyph"
        quote: his birthdate was 9.8.9.13.0 8 Ahau 13 Pop in the Maya Long Count
      - ref: src:wikipedia-long-count
        loc: "section on correlation, and its table"
        quote: GMT 584,283 Modified Thompson 1 584,284 Thompson (Lounsbury) 584,285
    method: documentary
    rank: deprecated
    note: >-
      The Julian dates are worked out here from the Long Count day number and the correlation
      constant, 584,283 (the GMT correlation) or 584,285 (Thompson-Lounsbury); the range is the
      difference between them. Mathews and Schele give no Western date. Superseded by
      start-long-count, which gives the date as they do and leaves its day to the correlation
      chosen on people/calendars/long-count-zero-day: this range was a result worked out by
      hand and stored, and it holds two of the three correlations argued there.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mathews-schele-1974-lords-of-palenque.txt (sha256 bb8f9f4893ca49da) and wikipedia-long-count.txt (sha256 b0c3dddb06c58115), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
