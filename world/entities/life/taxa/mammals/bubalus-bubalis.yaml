      loc: "section \"Characteristics\""
      quote: "Height at the withers is 129–133 cm (51–52 in) for bulls and 120–127 cm (47–50 in) for cows"
    method: compilation
    note: >-
      Of the domestic buffalo, from the lowest cows to the tallest bulls, from Wikipedia, as no better source stating it
      for the domestic animal could be read. A height at the withers, taken for the height of the back at the hips.
    checked:
