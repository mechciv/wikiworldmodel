      ref: src:animal-diversity-web
      loc: "account of Bubalus bubalis, Physical Description"
      quote: "has a body length of 240 to 300 cm"
    method: compilation
    note: >-
      The account gives this for the species, wild and domestic together, and its wild buffalo are the heavier, so it may
      be long for the domestic animal; no length for that alone was read. It is given because without it the animal is
      drawn at the middle of all bovids' lengths, half as long as it is.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in animal-diversity-web.txt (sha256 5ae3d0bcfbf74dd9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
