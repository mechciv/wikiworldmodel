            stand: { y: 0.35, z: 0.88, pitch: 0.38 }
            alert: { y: 0.345, z: 0.98, pitch: 0.2 }
        horns: { tint: 170, points: [[0.045, 0.0, 0.03, 0.022], [0.11, -0.03, 0.04, 0.02], [0.17, -0.09, 0.05, 0.016], [0.19, -0.17, 0.06, 0.011], [0.165, -0.24, 0.07, 0.004]] }
        ears: { mat: hide }
    unsourced: >-
      A machine's editorial drawing of a water buffalo: the ox it starts from, whole, in bare hide and with no
      dewlap, standing lower at the hips, the head carried level with the nose forward on a drooping neck and, as the
      account of Bubalus bubalis on the Animal Diversity Web and Wikipedia's article describe the swamp buffalo,
      heavy horns set far apart that sweep out and back in a half circle, on the plane of the forehead. The body,
      legs, face and ears are the ox plan's. Its proportions are a drawing's, and no measurements of any animal. Only
      compared with its sheet.
  length:
    prop: body_length
    value: { lo: 2.4, hi: 3.0 }
