id: life/taxa/bos-indicus
kind: taxon
summary: >-
  Zebu, the humped cattle domesticated in South Asia. Open Tree keeps them as a species of their own; some classifications make them a subspecies of Bos taurus.
same_as: { ott: 490109 }
