    value: { en: "domestic pigs", la: "Sus scrofa domesticus" }
    source: { ref: src:opentree-taxonomy-3.7, loc: "tnrs/match_names: Sus scrofa domesticus, ott729998" }
    note: Open Tree gives the scientific name; the English name is an editorial gloss.
