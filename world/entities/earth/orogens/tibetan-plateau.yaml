id: earth/orogens/tibetan-plateau
kind: landform/mountain-range
summary: The high plateau north of the Himalaya, the widest stretch of high ground on Earth.
author: machine:claude-code
# Phases tile the lifetime: the plateau rises from the start of its growth, and then stands at about the height it has
# today. Where its sources show it standing so, today's relief is carried back for it (model:earth/relief-carried).
phases:
  - id: rising
    label: Rising
  - id: standing
    label: At about its present height
claims:
  name:
    prop: name
    value: { en: Tibetan Plateau }
    unsourced: An editorial label.
  extent:
    prop: extent
    value:
      type: Polygon
      frame: frame:earth/present-day
      coordinates:
        - [[79.5, 35.6], [82.0, 36.0], [86.0, 36.2], [90.0, 36.3], [94.0, 35.9], [97.5, 35.2], [98.5, 33.5], [97.0, 31.5], [96.0, 30.5], [94.0, 29.4], [91.0, 29.3], [88.0, 29.2], [85.0, 29.5], [82.0, 30.5], [79.5, 32.1], [79.0, 33.8], [79.5, 35.6]]
    unsourced: >-
      An outline drawn loosely round the plateau on today's relief, from the valleys of the Indus and the Tsangpo,
      where it laps a tenth of a degree over the Himalaya's outline so that no ground between the two is left to
      neither, north to the crest of the Kunlun, and from Aksai Chin east to the headwaters of the Yangtze and the
      Mekong, to say which ground its record speaks for. The Karakoram and the
      Pamir, the basins and ranges north of the Kunlun, and the country cut by gorges east of it are left out: the
      heights cited here were measured in the south and the middle of the plateau. The plateau has no agreed edge.
    method: editorial
    basis: reconstruction
  location:
    prop: location
    value: { lat: 32.033, lon: 89.767, frame: frame:earth/present-day }
    source:
      ref: src:su-2019-no-high-tibet
      loc: abstract
      quote: >-
        They were recovered from the Late Paleogene (Chattian), ca. 25.5 ± 0.5 million years, paleolake sediments
        within the Lunpola Basin (32.033°N, 89.767°E), central QTP at a present elevation of 4655 m
    method: survey
    note: >-
      The place of the fossil palm leaves in the Lunpola Basin, in the middle of the plateau, where most of the
      heights cited here were measured: chosen to place the marker, since the plateau has no single location.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in su-2019-no-high-tibet.txt (sha256 6754497dca6a0e24), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  frame:
    prop: frame
    value: frame:paleomap/plate-613
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
  # When the plateau began to grow: a bound, since the sources read date no first rise.
  start-before-wang-2008:
    prop: start_before
    value: { ref: ics/eocene, edge: start }
    source:
      ref: src:wang-2008-tibet-early-uplift
      loc: abstract
      quote: >-
        Elevation gain started in pre-Eocene time in the Lhasa and Qiangtang terranes and expanded throughout the
        Neogene toward its present southern and northern margins in the Himalaya and Qilian Shan.
    method: stratigraphic
    note: >-
      Read from the last beds laid down in the sea, Lower Cretaceous in the Qiangtang terrane and Upper Cretaceous
      in the Lhasa terrane, which were folded before the beds laid down on land came to lie across them: the
      middle of the plateau had left the sea and its crust had begun to thicken well before the Eocene. The
      source sets this beside models of the plateau's growth that begin before India met Asia and models that
      begin after, so no cause is written here.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wang-2008-tibet-early-uplift.txt (sha256 c64d0640176a9ddc), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  # When the plateau came to stand at about its present height: what its sources dispute. The claims of start are
  # the readings, of which one is preferred; the bound below them holds whichever is taken.
  standing-start-xiong-2022:
    prop: start
    subject: "@standing"
    value: { ref: ics/chattian }
    source:
      ref: src:xiong-2022-central-tibetan-valley
      loc: "Discussion, 'Implications of the revised dating and elevation change scenarios'"
      quote: >-
        The valley floor rose rapidly by ~2.4 to 2.7 km during the Late Eocene to Early Oligocene at a rate of 0.24
        to 0.27 mm/year, and central Tibet likely reached its near-present elevation in the Late Oligocene (Fig. 7B)
        and thus just before the Neogene
    method: paleoaltimetry
    rank: preferred
    note: >-
      The Lunpola Basin in the middle of the plateau, now at about 4.7 km: its floor rose from under 2 km at 55 to
      38 Ma to more than 4.0 km by 29 Ma, by the temperatures at which the carbonate nodules of old soils grew
      (clumped isotopes), in beds dated by zircons from nine layers of volcanic ash. The Late Oligocene is written
      as the Chattian. Preferred as the latest of the readings, and the one that says in so many words when the
      middle of the plateau came near its present height; it dates the beds by radiometric ages through the whole
      succession, and it accounts for both the fossil palms and the light isotopes that the older readings rest on.
      It speaks for the valley between the plateau's older highlands: the source has the ranges on either side of
      it high in the Eocene already, and Fang et al. (2020) have the low ground north of it raised to 4 km by
      24 Ma at the latest.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in xiong-2022-central-tibetan-valley.txt (sha256 fead06ac2de63c8a), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  standing-start-fang-2020:
    prop: start
    subject: "@standing"
    value: { lo: 39.5 Ma, hi: 26 Ma }
    source:
      ref: src:fang-2020-lunpola-chronology
      loc: abstract
      quote: >-
        The updated ages reconcile previous results and indicate that the elevations of central Tibet were generally
        low (<2.3 km) at 39.5 Ma and high (3.5 to 4.5 km) at ~26 Ma
    method: paleoaltimetry
    note: >-
      The same basin, dated anew by the magnetic reversals of a section 1890 m thick, tied to three zircon ages
      of ash layers in it: the bed of the fossil palms is about 39.5 Ma old, not 25.5 Ma, and the old soils whose
      isotopes speak of a high plateau are 26.5 to 21.5 Ma old, not older than 35 Ma. The heights are the earlier
      workers'. So the plateau's middle came to its height between the two ages. Elsewhere the source puts the
      rise of the plateau's low ground at about 25 to 20 Ma, which sits oddly with a height reached by 26 Ma: the
      abstract's figures are kept. Xiong et al. (2022) accept the age of the palms and reject the dating of the
      upper beds, which they hold to be older; the two agree that the ground was low in the late Eocene and high
      by the late Oligocene.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fang-2020-lunpola-chronology.txt (sha256 a8805319d09af53b), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  standing-start-wang-2008:
    prop: start
    subject: "@standing"
    value: { hi: 40 Ma }
    source:
      ref: src:wang-2008-tibet-early-uplift
      loc: "Discussion, third paragraph"
      quote: >-
        support the idea that the Lhasa and southern Qiangtang terranes were at or near their modern elevation since
        40 Ma and formed the proto-Tibetan Plateau
    method: stratigraphic
    note: >-
      The older view, of a high plateau in the middle of Tibet since the Eocene, which then grew north and south.
      It rests on the Hoh Xil Basin north of it, read as the basin at the foot of high ground: the dated beds,
      their coarsening at about 40 Ma and the way their rivers ran, with the ages of lavas and of cooling in the
      ranges, and on the isotope heights of Rowley and Currie (2006) and others for the Lunpola and Nima basins;
      the Lunpola beds have since been dated anew. Written with only its later end, since the source gives a time
      by which the ground stood high. It takes in the valley that the preferred claim speaks for, and of that it
      does not agree with it; of the ranges on either side, which Su et al. (2019) and Xiong et al. (2022) also
      have high in the Paleogene, it may still hold.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wang-2008-tibet-early-uplift.txt (sha256 c64d0640176a9ddc), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  standing-start-rowley-currie-2006:
    prop: start
    subject: "@standing"
    value: { hi: 35 Ma }
    source:
      ref: src:rowley-currie-2006-lunpola
      loc: abstract
      quote: which indicate that the surface of Tibet has been at an elevation of more than 4 kilometres for at least the past 35 million years
    method: paleoaltimetry
    rank: deprecated
    note: >-
      Oxygen isotopes in the beds of the Lunpola Basin, then taken to be late Eocene and younger. Written with
      only its later end, since the source gives a time by which the ground stood high. Superseded in its date,
      not in its height: Fang et al. (2020) date the old soils that gave the heights to 26.5 to 21.5 Ma, and
      Xiong et al. (2022) to the early Oligocene. Read only in the abstract.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in rowley-currie-2006-lunpola.txt (sha256 0738a1a8737dc47f), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  standing-start-su-2019:
    prop: start
    subject: "@standing"
    value: { lo: 25 Ma }
    source:
      ref: src:su-2019-no-high-tibet
      loc: "Discussion, last paragraph"
      quote: >-
        suggests that a combination of valley fill and predominantly compressional tectonics raised the surface
        elevation after ~25 Ma to form the present high plateau
    method: paleoaltimetry
    rank: deprecated
    note: >-
      Fossil palm leaves in the Lunpola Basin, in a bed the authors dated to 25.5 ± 0.5 Ma: palms do not survive
      frost, and with the fall of temperature with height that a climate model gives for the place, the valley floor
      cannot have stood above about 2.3 km. So the plateau was not yet high then, and the claim is written with only
      its earlier end. Superseded in its date: Fang et al. (2020) date the palm bed to about 39.5 Ma and Xiong et al.
      (2022), several of this paper's authors among them, to 40 to 38 Ma, and hold that the valley had become
      plateau before the Neogene.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in su-2019-no-high-tibet.txt (sha256 6754497dca6a0e24), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
  standing-start-before-spicer-2003:
    prop: start_before
    subject: "@standing"
    value: 15 Ma
    source:
      ref: src:spicer-2003-southern-tibet
      loc: abstract
      quote: >-
        we reconstruct the elevation of the Namling basin 15 Myr ago to be 4,689 +/- 895 m or 4,638 +/- 847 m,
        depending on the reference data used. This is comparable to the present-day altitude of 4,600 m.
    method: paleoaltimetry
    note: >-
      Fossil leaves of the Namling basin in the south of the plateau, whose shapes give the warmth of the air they
      grew in, and with a climate model the height of the ground: as high about 15 million years ago as today.
      The abstract dates the leaves to approximately 15 Myr ago and gives no uncertainty for the date. A bound
      that every reading above keeps to. Read only in the abstract.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in spicer-2003-southern-tibet.txt (sha256 a81cfdb57eba010b), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-23" }
