  core-hariharalaya:
    prop: core
    value: { lat: 13.335986, lon: 103.974117, frame: frame:earth/present-day }
    valid: { hi: 889 CE }
    source:
      - { ref: src:wikidata-bakong, loc: "P625 coordinate location" }
      - ref: src:pottier-soutif-2014-hariharalaya
        loc: "p. 147"
        quote: à Bakong, temple central de l’ancienne capitale de Hariharālaya, dans le district actuel de Roluos au sud-est d’Angkor
      - ref: src:lustig-2009-angkor-political-economy
        loc: "p. 19, section 1.2.2"
        quote: Jayavarman II is considered to have established the Khmer kingdom in the early 9th century CE at Roluos, near present day Angkor, on the northern shore of the Tonle Sap. The capital moved in the late 9th century to sites around Phnom Bakheng, the designated centre of Angkor.
      - ref: src:pleiades-angkor
        loc: "place 531398484, description"
        quote: founded in the late 9th century by Yasovarman I (889-901)
    method: gazetteer
    note: >-
      Bakong, the central temple of Hariharalaya at Roluos, about 16 km south-east of the record's point, where the
      kingdom's capital stood before it moved to Yasodharapura. The point is Bakong's in the gazetteer. The years are
      until 889, when the gazetteer says Yasovarman I founded the city round Phnom Bakheng, the late 9th century Lustig
      gives for the move; Pottier and Soutif date Bakong's moats and enclosures earlier than the conventional 881.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in pottier-soutif-2014.txt (sha256 31ec941547763b3e), lustig-2009.txt (sha256 494d50a16c137857) and pleiades-531398484.txt (sha256 24d98dcbf5e2871f), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-25" }
  core-yasodharapura:
    prop: core
    value: { lat: 13.43333, lon: 103.8333, frame: frame:earth/present-day }
    valid: { lo: 889 CE }
    source:
