      - ref: src:pleiades-angkor
        loc: "place 531398484, description"
        quote: founded in the late 9th century by Yasovarman I (889-901)
      - ref: src:lustig-2009-angkor-political-economy
        loc: "p. 19, section 1.2.2"
        quote: The capital moved in the late 9th century to sites around Phnom Bakheng, the designated centre of Angkor.
    method: gazetteer
    note: >-
      Yasodharapura, the city round Phnom Bakheng from Yasovarman I's founding of it, as the gazetteer dates it; its point
      is the record's own, the gazetteer's representative point for Angkor.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in pleiades-531398484.txt (sha256 24d98dcbf5e2871f) and lustig-2009.txt (sha256 494d50a16c137857), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-25" }
