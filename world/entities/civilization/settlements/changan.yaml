id: people/cities/changan
kind: settlement
summary: >-
  Chang'an of the Sui and Tang, the capital whose building an edict of 582 began on the Longshou plain, south-east of
  the Han city: Daxingcheng under the Sui, Chang'an under the Tang. Its outer walls enclosed a rectangle of 9,721 by
  8,651.7 m, laid out on a grid of 11 streets running north and south and 14 running east and west, with some 110
  wards, two major markets, the palaces in the north and the government's Imperial City south of them. About a million
  people lived in it at its two peaks, in 742 and 803, as Xiong reports the estimates. Looted and burned again and
  again from the Huang Chao rebellion on, it was dismantled in 904 on the orders of Zhu Wen. The smaller town then
  walled round the former Palace and Imperial Cities, where modern Xi'an grew, is not this record, nor is the Han city.
author: machine:claude-code
same_as: { wikidata: Q10923028 }
claims:
  name-daxingcheng:
    prop: name
    value: { en: Daxingcheng }
    valid: { hi: 618 CE }
    source:
      - ref: src:xiong-1988-sui-tang-changan
        loc: "Introduction, p. 2"
        quote: which was to be known as Daxingcheng in the Sui and as Chang'an in the Tang dynasties
      - ref: src:xiong-1988-sui-tang-changan
        loc: "ch. 3, \"The Taiji Hall\", p. 67"
        quote: In 618, Li Yuan decided to replace the Sui with his own Tang empire.
    note: >-
      The city's name under the Sui, after the title of Duke of Daxing that the emperor Wen had held (Xiong, p. 23), or
      after its palace, the Daxing Palace (pp. 66–67). Its turn ends with the dynasty, in 618.
