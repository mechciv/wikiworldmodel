  name-changan:
    prop: name
    value: { en: "Chang'an" }
    valid: { lo: 618 CE }
    source:
      - ref: src:xiong-1988-sui-tang-changan
        loc: "Introduction, p. 2"
        quote: which was to be known as Daxingcheng in the Sui and as Chang'an in the Tang dynasties
      - ref: src:xiong-1988-sui-tang-changan
        loc: "ch. 3, \"The Taiji Hall\", p. 67"
        quote: In 618, Li Yuan decided to replace the Sui with his own Tang empire.
    rank: preferred
    note: >-
      The city's name under the Tang, from the founding of the dynasty in 618. Preferred as the name the record goes by,
      for most of its life.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in xiong-1988-sui-tang-changan.txt (sha256 39e26db59877529e), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
  start:
    prop: start
    value: 582 CE
    source:
      - ref: src:xiong-1988-sui-tang-changan
        loc: "Preface, p. i"
        quote: The construction of the city started in 582.
      - ref: src:xiong-1988-sui-tang-changan
        loc: "Introduction, p. 2"
        quote: On the 24th of the sixth month (29 July) 582, an imperial edict initiated the construction of the city
    method: historical-account
    note: >-
      The edict that began the building, dated 29 July 582 as Xiong converts the Chinese date. The first stage was
      finished early in 583, when the first settlers came, and the emperor moved in on 15 April 583.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in xiong-1988-sui-tang-changan.txt (sha256 39e26db59877529e), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
  end:
    prop: end
    value: 904 CE
    source:
      ref: src:xiong-1988-sui-tang-changan
      loc: "Conclusions, p. 287"
      quote: In 904, on orders from general Zhu Wen, Sui-Tang Chang'an was physically destroyed and its remaining structures dismantled and transported to Luoyang.
    method: historical-account
    note: >-
      Early in 904 Zhu Wen (Zhu Quanzhong) made the emperor move the capital to Luoyang, with the city's registered
      people, and its palaces and houses were taken down and their timbers shipped downriver. Han Jian, left to govern
      the area, then had the city walls demolished and a new wall built round the former Palace and Imperial Cities
      (Xiong, pp. 279–280): that smaller town is not this record.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in xiong-1988-sui-tang-changan.txt (sha256 39e26db59877529e), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
