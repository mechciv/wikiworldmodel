id: people/cities/tenochtitlan
kind: settlement
summary: >-
  The city of the Mexica on islands in the salt lake of Texcoco, Mexico Tenochtitlan, with Tlatelolco its twin on
  the north of the island (people/cities/tlatelolco), taken by the Spaniards and their allies in 1521 and rebuilt by
  them as the city of Mexico, today Mexico City. One record: Cortés found it all destroyed, chose to settle it again
  because it was so famous, and wished it rebuilt; the natives rebuilt their own part under their own officers,
  beside the Spaniards' town; and the list of cities the world draws has one row for it from 1500 to 1975. Wikidata
  cuts it in two at 13 August 1521, and its item for Mexico City carries both 1521 and 1325 as the city's inception.
  How many lived in it in 1519 is estimated from 60,000 to 700,000 people: the chroniclers counted houses or
  householders, and the estimates turn on what they counted and how large the city was.
author: machine:claude-code
# Natural Earth's point for Mexico City today, the city this record is in its last phase.
same_as: { natural-earth: 1159151587 }
phases:
  - id: mexica
    label: Mexico Tenochtitlan
    same_as: { wikidata: Q13695 }
  - id: rebuilt
    label: Mexico, rebuilt under the Spaniards
    same_as: { wikidata: Q1489 }
claims:
  name-tenochtitlan:
    prop: name
    value: { en: Tenochtitlan }
    valid: { hi: { ref: people/conquest/fall-of-tenochtitlan, edge: start } }
    unsourced: >-
      An editorial label, the city's name before the conquest as historians write it; Cortés wrote Temixtitan, Bernal
      Díaz Tenustitlan, Méjico, and Book 12 and its Spanish say Mexico, which Gómara says was the name of the southern
      half of the city, the other being Tlatelolco.
  name-mexico-city:
    prop: name
    value: { en: Mexico City, es: Ciudad de México }
    valid: { lo: { ref: people/conquest/fall-of-tenochtitlan, edge: start } }
    rank: preferred
    unsourced: >-
      An editorial label, the city's name today, preferred as the record's name of today: names whose turns end at
      another record cannot be told apart by their dates alone. Cortés still called the rebuilt city Temixtitan in 1524; Zuazo wrote
      "la cibdad de México ó Teneztutan" in 1521.
  start:
    prop: start
    value: 1325 CE
    source:
      ref: src:valero-1990-indios-tenochtitlan
      loc: "\"Dimensiones de la ciudad\", p. 29"
      quote: La isla original sobre la que se funda Tenochtitlan pudo haber tenido una extensión aproximada de 180 hectáreas hacia 1325
    method: tradition
    note: >-
      Valero: the original island on which Tenochtitlan was founded, about 1325, may have covered about 180 hectares;
      the city grew out over the lake by building chinampas. The year is the traditional founding; Wikidata gives 1
      March 1325 for Tenochtitlan and 13 March 1325, beside 1521, for Mexico City, from no source read here.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-estudios-americanos-778.txt (sha256 e2b341ec7d870461), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  rebuilt:
    prop: start
    subject: "@rebuilt"
    value: { ref: people/conquest/fall-of-tenochtitlan }
    source:
      - ref: src:cortes-1522-third-letter
        loc: "p. 418 (scan 429)"
        quote: pareciénos que en ella era bien poblar, porque estaba toda destruida; y yo repartí los solares á los que se asentaron por vecinos
      - ref: src:cortes-1524-fourth-letter
        loc: "p. 503 (scan 513)"
        quote: porque como siempre deseé que esta ciudad se reedificase, por la grandeza y maravilloso asiento
    method: documentary
    note: >-
      The city taken was all destroyed, and Cortés chose to settle it again and gave out house lots to those who
      settled as householders (third letter, 15 May 1522); he always wished this city to be rebuilt, for its
      greatness and marvellous site (fourth letter, 1524). He and the Spaniards lived at Coyoacán meanwhile, and the
      repair had gone on four or five months by May 1522. The phase begins with the fall: the city was not abandoned,
      and its people were set to rebuild their houses within two months (Bernal Díaz, cap. CLVII).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in es-cortes-1522-third-letter.txt (sha256 b72ff8bf42100af3) and es-cortes-1524-fourth-letter.txt (sha256 d9604f830bed44e9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  location:
    prop: location
    value: { lat: 19.435, lon: -99.13138889, frame: frame:earth/present-day }
    source: { ref: src:wikidata-tenochtitlan, loc: "Q13695, P625 coordinate location" }
    method: gazetteer
    note: The gazetteer's point for Tenochtitlan, at the site of the great temple, in the centre of Mexico City.
  frame:
    prop: frame
    value: frame:paleomap/plate-104
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
  area-smith:
    prop: settlement_area
    value: 1350
    valid: 1519 CE
    source:
      - ref: src:smith-2008-aztec-city-planning
        loc: "\"Tenochtitlan\", p. 142"
        quote: Most of Tenochtitlan's 13.5 km2 were reclaimed from Lake Texcoco.
      - ref: src:smith-2005-city-size
        loc: "Table 5, \"High-density site\", p. 412"
        quote: 212,500 1,350 157.4
    method: compilation
    rank: preferred
    note: >-
      13.5 km², with Tlatelolco, most of it land made in the lake. Smith (2005) tabulates 1,350 ha. Preferred as the
      figure of the recent syntheses; it lies within Calnek's 12 to 15 km² of continuous habitation in 1519, as
      Jiménez Martínez (2020, p. 30) reports Calnek.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-smith-2008-aztec-city-planning.txt (sha256 2af75a49398182ad) and city-smith-2005-city-size.txt (sha256 8519c80746cd81da), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  area-jimenez:
    prop: settlement_area
    value: 944
    valid: 1519 CE
    source:
      ref: src:jimenez-2020-superficie
      loc: "abstract, p. 15"
      quote: un resultado aproximado de 9,44 km2
    method: map-trace
    note: >-
      9.44 km² for Tenochtitlan with Tlatelolco in 1519, drawn on the national digital map from the limits of the
      city's quarters, and leaving out the islets of Nonoalco, Mixiuhcan and Atztacalco: the smallest area, which
      his population of 75,000–95,000 rests on.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-jimenez-2020-superficie.txt (sha256 de0eb47de70c2086), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  houses-sixty-thousand:
    prop: houses
    value: 60000
    valid: 1519 CE
    source:
      - ref: src:gomara-1552-conquista
        loc: "ch. [79] \"De Mexico Tenuchtitlan\", p. 220 of the UNAM edition (Chimalpáhin's copy)"
        quote: "Era Mexico quando Cortes [LdeG: entro] pueblo de sesenta mill casas"
      - ref: src:jimenez-2022-poblacion
        loc: "p. 132, quoting Zuazo's letter of 14 November 1521"
        quote: Está la cibdad de México ó Teneztutan, que será de sesenta mill vecinos.
    method: expert-estimate
    rank: preferred
    note: >-
      Gómara (1552): Mexico, when Cortés entered, was a town of sixty thousand houses (the bracket is the editors'
      word from the printed text, missing from Chimalpáhin's copy); small as they were, they seldom had fewer than two
      or three dwellers, and some ten. Zuazo, writing from Cuba in November 1521: the city will be of sixty thousand
      vecinos, householders, as Jiménez Martínez quotes him. Houses in the one, householders in the other: the
      number is one, what it counts is not, and most of the spread in the estimates of the people comes from that.
      Preferred as the figure of the writers closest to the event.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-gomara-chimalpahin-71-80.txt (sha256 5adc6abb4fc88f1d) and city-dialnet-8205553.txt (sha256 658c0c042ea488d2), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  houses-torquemada:
    prop: houses
    value: 120000
    valid: 1519 CE
    source:
      ref: src:torquemada-1615-monarquia-indiana
      loc: "book 3, ch. XXIII, p. 399"
      quote: tenia ciento y veinte mil casas y en cada una tres y cuatro y hasta diez vecinos, por manera que a esta cuenta eran sus vecinos más de trescientos mil
    method: expert-estimate
    note: >-
      Torquemada (1615), at second hand ("it is said"): a hundred and twenty thousand houses, with three, four and up
      to ten householders in each, so more than three hundred thousand householders. Twice Gómara's houses, nearly a
      century after the conquest.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-torquemada-1615-joined.txt (sha256 688c18b2f2d9d7a3), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-calnek:
    prop: population
    value: { lo: 150000, hi: 200000 }
    valid: 1519 CE
    source:
      - ref: src:jimenez-2022-poblacion
        loc: "p. 139, quoting Calnek (1974) in Spanish"
        quote: parecería que el mínimo de población no puede haber sido mucho menor que 150.000 habitantes. Por otra parte, puede haber sido considerablemente mayor de 200.000.
      - ref: src:jimenez-2022-poblacion
        loc: "p. 140, quoting Sanders, Parsons and Santley (1979), p. 154"
        quote: que con una población estimada de 150,000 a 200,000 (Calnek 1972) es tan diferente
    method: expert-estimate
    rank: preferred
    note: >-
      Calnek, from the chroniclers' 60,000 houses with fewer people to a house than the usual five to seven, by his
      study of the kinds of residence: the minimum cannot have been much below 150,000, and it may have been well over
      200,000. Sanders, Parsons and Santley adopted it. Preferred as the range most repeated in later work, read here
      only as Jiménez Martínez quotes it: Calnek's own papers could not be read.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-dialnet-8205553.txt (sha256 658c0c042ea488d2), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-smith:
    prop: population
    value: 212500
    valid: 1519 CE
    source:
      ref: src:smith-2005-city-size
      loc: "Table 5, \"High-density site\", p. 412"
      quote: 212,500 1,350 157.4
    method: compilation
    note: >-
      Smith's table of the sizes of Late Postclassic cities: 212,500 people on 1,350 ha, 157.4 to the hectare (the
      table's columns run together in the text). Compiled, from Calnek (1976) and Rojas (1986) in his note 17, and
      given as comparable only roughly. Wikidata cites this figure.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-smith-2005-city-size.txt (sha256 8519c80746cd81da), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-sanders:
    prop: population
    value: { lo: 125000, hi: 140000 }
    valid: 1519 CE
    source:
      ref: src:jimenez-2022-poblacion
      loc: "p. 140, summarizing Sanders (2003)"
      quote: concluyendo con una extensión de 12 a 13 Km2 para la ciudad, una densidad media de 10-11.000 hab/Km2 para áreas residenciales y un rango de población entre 125-140.000 habitantes
    method: expert-estimate
    note: Area times density, 12–13 km² at 10,000–11,000 to the km², as Jiménez Martínez reports Sanders (2003).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-dialnet-8205553.txt (sha256 658c0c042ea488d2), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-jimenez:
    prop: population
    value: { lo: 75000, hi: 95000 }
    valid: 1519 CE
    source:
      ref: src:jimenez-2022-poblacion
      loc: "section 5, p. 146"
      quote: la superficie de la ciudad no sobrepasaría en 1519 los 9,44 Km2 … la densidad de la población estaría comprendida en un rango de 8.000 - 10.000 hab/Km2. Se obtendría una cifra de población de entre 75.000 a 95.000 habitantes.
    method: expert-estimate
    note: >-
      His own area, 9.44 km², times a density chosen from Seville and Córdoba about 1500 and from boroughs of Mexico
      City today: the lowest modern estimate read.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-dialnet-8205553.txt (sha256 658c0c042ea488d2), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-anonymous-conqueror:
    prop: population
    value: 60000
    valid: 1519 CE
    source:
      ref: src:conquistador-anonimo-1858
      loc: "ch. XVIII \"De la gran ciudad de Temistitán México\", p. 391 (Icazbalceta's Spanish)"
      quote: juzgan que tiene sesenta mil habitantes, antes mas que menos
    method: expert-estimate
    note: >-
      The Anonymous Conqueror, in the Spanish of Icazbalceta's edition (from Ramusio's Italian, "meglio di sessanta
      mila habitatori"): those who have seen it judge that it has sixty thousand inhabitants, rather more than less.
      Whether his "inhabitants" stood for householders is an old dispute; Saville's English of 1917 says seventy
      thousand, a slip carried from Icazbalceta's note. Lombardo (1973) took sixty thousand people as the most
      reasonable figure.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-icazbalceta-1858-coleccion-t1.txt (sha256 132249c507131f3a), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-soustelle:
    prop: population
    value: { lo: 560000, hi: 700000 }
    valid: 1519 CE
    source:
      ref: src:jimenez-2022-poblacion
      loc: "p. 137, quoting Soustelle, La vida cotidiana de los aztecas, p. 27"
      quote: 80,000 a 100,000 hogares de siete personas, o sea una población total de 560,000 a 700,000 almas
    method: expert-estimate
    note: >-
      Soustelle (1955), as Jiménez Martínez quotes him: 80,000 to 100,000 households of seven, taking Torquemada's
      householders for households. The highest estimate read; he concluded more than 500,000 and probably fewer than a
      million.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-dialnet-8205553.txt (sha256 658c0c042ea488d2), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-prescott:
    prop: population
    value: 300000
    valid: 1519 CE
    source:
      ref: src:prescott-1843-conquest
      loc: "Book IV, ch. I, at footnote 318"
      quote: No contemporary writer estimates it at less than sixty thousand houses, which, by the ordinary rules of reckoning, … would give three hundred thousand souls.
    method: expert-estimate
    note: >-
      Prescott (1843): the chroniclers' sixty thousand houses at five to a house; several families often shared a
      house, he adds, which would swell the number. His editor Munro (1904) thought sixty thousand people nearer the
      truth.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in city-prescott-1843-conquest-vol2.txt (sha256 923f72cf273db7be), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-19" }
  population-chandler:
    prop: population
    value: 80000
    valid: 1520 CE
    source:
      ref: src:reba-2016-chandler-v2
      loc: "row \"Mexico City\" (OtherName \"Tenochtitlan\"), column AD_1520"
    method: compilation
    note: >-
      Chandler's figure, which the world's human landscape draws for the city (field:people/cities): 80,000 in 1500
      and 1520, and 30,000 in 1524. Near the low end of the estimates. Chandler's method is not in the row.
  town-form:
    prop: town_form
    value: { streets: canals, square: true }
    valid: { hi: { ref: people/conquest/fall-of-tenochtitlan, edge: start } }
    source:
      - ref: src:smith-2008-aztec-city-planning
        loc: "\"Tenochtitlan\", p. 142"
        quote: Spanish observers were struck by the great number of canals in the city, which they likened to Venice.
      - ref: src:smith-2008-aztec-city-planning
        loc: "\"Tenochtitlan\", p. 142"
        quote: Tenochtitlan’s orthogonal layout is seen in the major avenues
      - ref: src:smith-2008-aztec-city-planning
        loc: "\"Tenochtitlan\", p. 143"
        quote: The sacred precinct occupies the place of the public plaza in other Aztec (and Mesoamerican) cities.
    method: compilation
    note: >-
      The Mexica city before the conquest: canals among its streets, an orthogonal plan whose avenues ran out from the walled
      sacred precinct at its centre in the cardinal directions, and that precinct in place of a public plaza, drawn here as a
      square. Smith names no wall round the city, only the precinct's, so no wall is claimed.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in smith-2008-aztec-city-planning.txt (sha256 8ad06786d1178be1), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
