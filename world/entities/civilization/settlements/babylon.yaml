    value: { en: Babylon }
    source: { ref: src:pleiades-babylon, loc: "place 893951, names" }
  start-before-first-mention:
    prop: start_before
    value: 2193 BCE
    source:
      - ref: src:wikipedia-babylon
        loc: lead section
        quote: The earliest known mention of Babylon as a small town appears on a clay tablet from the reign of Shar-Kali-Sharri (2217–2193 BC)
      - ref: src:wikipedia-babylon
        loc: section "History"
        quote: during the reign of the Akkadian ruler Shar-Kali-Sharri, one of whose year names mentions the construction of two temples there
    method: documentary
    note: >-
      The town is first named in a year name of Shar-kali-sharri of Akkad, which records the building of two temples
      there, so it stood by the end of his reign: 2193 BCE in the dates the article gives, those of the middle chronology.
      How much older it was is not known, as its earliest levels lie below the water table, where Koldewey could not dig;
      the city is drawn from this bound, the latest the evidence allows. An encyclopedia is cited because the works it
      rests on could not be read here (src:wikipedia-babylon names them).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-babylon.txt (sha256 214a26d3e90fa45d), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-25" }
  end:
    prop: end
    value: 1200 CE
    source:
      - ref: src:koldewey-1914-excavations-at-babylon
        loc: "ch. LI, Retrospect, p. 313"
        quote: At that time began the process of demolishing the city area, which perhaps was now only occupied by isolated dwellings
      - ref: src:koldewey-1914-excavations-at-babylon
        loc: "ch. LI, Retrospect, p. 313"
        quote: Amran alone was inhabited, and that only scantily
      - ref: src:koldewey-1914-excavations-at-babylon
        loc: "ch. LI, Retrospect, p. 314"
        quote: is shown by the uppermost levels there, which reach down as late as the Arab middle age (czvca 1200 a.p.)
      - ref: src:koldewey-1914-excavations-at-babylon
        loc: "ch. III, General view of the city, p. 15"
        quote: after all the other sites were abandoned it was occupied for habitation right up to the Middle Ages
    method: excavation
    note: >-
      The end of settlement, not of the city, which had emptied long before. From the Greek or the Parthian period on, the
      city's area was being demolished, perhaps with only isolated dwellings left in it, and at last only the mound of
      Amran ibn Ali, over Esagila, was lived on, as its uppermost levels show. Circa 1200 CE is Koldewey's date: the OCR of
      the text read prints it "czvca 1200 a.p.", for the italic circa and the A.D. he writes elsewhere. No figure of the
      city's people in its decline was read.
    checked:
