id: people/cities/babylon
kind: settlement
summary: >-
  Babylon, on the Euphrates in central Iraq. First named as a town of the Akkadian empire, it was the city of Hammurabi's
  dynasty (people/polities/babylon-first-dynasty), and Nabopolassar and Nebuchadnezzar II rebuilt it as the city the
  German excavations begun in 1899 uncovered: houses in blocks along straight streets that crossed about 16° west of
  north, the river through the middle, an inner double wall of mud brick, and an outer wall of crude brick faced with
  burnt brick that ran about 18 km round with the river. The Seleucid kings moved their residence to Seleucia on the
  Tigris, and by Strabo's day the greater part of Babylon was deserted; people went on living on the mound of Amran, over
  the temple of Esagila, until about 1200 CE. Its walls are told three ways, by the excavator, by Herodotus and by Strabo,
  and their measures disagree.
author: machine:claude-code
same_as: { wikidata: Q5684, pleiades: 893951 }
