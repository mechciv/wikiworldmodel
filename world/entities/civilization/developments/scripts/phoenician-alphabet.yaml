id: people/writing/phoenician-alphabet
kind: development/script
summary: >-
  The alphabet of twenty-two letters, all consonants, written from right to left, that took a fixed form in the Levant around the start of the first millennium BCE and fits the sounds of the Phoenician language. It grew out of the
  second-millennium Proto-Canaanite inscriptions, and Hebrew, Aramaic and, by tradition, Greek writing were taken from it. Its earliest dated monument here is the inscription on the sarcophagus of Ahiram of Byblos.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Phoenician alphabet }
    source:
      ref: src:woods-2010-visible-language
      loc: p. 13 (Time Line of Writing)
      quote: 1000 Phoenician alphabet
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in scripts-oimp32-visible-language.txt (sha256 b84714a8f838fe33), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  start-ahiram:
    prop: start
    value: { ref: people/writing/ahiram-sarcophagus }
    source:
      - ref: src:lam-2010-alphabet
        loc: p. 192
        quote: With the turn of the first millennium bc came the stabilization of the alphabet in terms of the orientation of the letters and the direction of writing (right to left).
      - ref: src:woods-2010-visible-language
        loc: p. 13 (Time Line of Writing)
        quote: 1000 Phoenician alphabet
    method: expert-estimate
    rank: preferred
    note: Preferred as a named, dated monument, against a phrase for a process.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in scripts-oimp32-visible-language.txt (sha256 b84714a8f838fe33) and scripts-oimp32-visible-language.txt (sha256 b84714a8f838fe33), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  start-waal:
    prop: start
    value: { lo: 1100 BCE, hi: 1001 BCE }
    source:
      ref: src:waal-2018-phoenician-letters
      loc: p. 85
      quote: In the course of the 11th century bc the stances of the letters become stabilized and the writing direction is fixed from right to left
    method: expert-estimate
    note: The same stabilization, set a little earlier, with no one find named for it.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in scripts-waal-2018-phoenician-letters.txt (sha256 15d6828f21b7acfa), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  end:
    prop: end
    value: unknown
    unsourced: No source read says when the script was last written.
  location:
    prop: location
    value: { lat: 34.119249, lon: 35.646125, frame: frame:earth/present-day }
    source: { ref: src:pleiades-byblos, loc: "place 668216, representative point" }
    method: gazetteer
    note: Marked at Byblos, where the first monument here was found.
  frame:
    prop: frame
    value: frame:paleomap/plate-508
    source: { ref: src:paleomap-plate-model, loc: PALEOMAP_PlatePolygons.gpml }
    method: plate-polygon
    basis: reconstruction
relations:
  first-attestation:
    rel: evidenced-by
    to: people/writing/ahiram-sarcophagus
    source:
      ref: src:lam-2010-alphabet
      loc: p. 192, fig. 12.3, caption
      quote: Ahiram Sarcophagus (Early Phoenician, ca. 1000 bc)
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in scripts-oimp32-visible-language.txt (sha256 b84714a8f838fe33), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
  from-proto-sinaitic:
    rel: arose-from
    to: people/writing/proto-sinaitic
    source:
      - ref: src:waal-2018-phoenician-letters
        loc: p. 85
        quote: it is clear that they can be considered the forerunners of the later Phoenician consonantal script
      - ref: src:lam-2010-alphabet
        loc: p. 191
        quote: within the Proto-Canaanite texts, one can observe a gradual evolution away from purely pictographic shapes to more abstract, stylized forms
      - ref: src:lam-2010-alphabet
        loc: p. 197 (catalog no. 91)
        quote: a script that represents a transitional stage between Proto-Canaanite and early Phoenician
    note: >-
      Waal's "they" are the early Proto-Sinaitic or Proto-Canaanite inscriptions, which she adds are not yet completely understood. This is descent by slow change within one tradition, not
      an adaptation made at one time: the signs lose their pictures through the Proto-Canaanite inscriptions of Palestine, in the second millennium BCE, and around the turn of the first
      their stances and the direction of writing are fixed. That middle stage has no record (people/writing/proto-canaanite, wanted by the Greek alphabet's record): this relation passes
      over it, and should name it once it is written. Lam calls the evidence spotty and inconclusive overall (p. 191).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in scripts-waal-2018-phoenician-letters.txt (sha256 15d6828f21b7acfa) and scripts-oimp32-visible-language.txt (sha256 b84714a8f838fe33), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-17" }
