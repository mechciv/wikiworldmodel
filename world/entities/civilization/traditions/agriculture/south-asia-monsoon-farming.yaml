id: people/agriculture/south-asia-monsoon-farming
kind: tradition/agriculture
summary: >-
  South Asian dual-season monsoon agriculture combining summer kharif rice, millets, and pulses with winter rabi wheat, barley, and peas across the subcontinent from c. 500 BCE onward.
author: machine:antigravity
