    value: 7000 BCE
    source:
      ref: src:sharif-thapar-1992-food-producing-communities
      loc: "p. 124"
      quote: "In absolute chronology this period is dated to around 7000 b.c."
    method: expert-estimate
    note: >-
      The date the review gives to Period I at Mehrgarh. The same review doubts it once in passing (sixth millennium); the animals are still kept, so there is no end claim.
