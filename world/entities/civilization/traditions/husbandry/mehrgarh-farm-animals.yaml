id: people/husbandry/mehrgarh-farm-animals
kind: tradition/husbandry
summary: >-
  The sheep, goats and zebu cattle of the first farmers of Baluchistan, kept at Mehrgarh from the aceramic Neolithic, about 7000 BCE, with zebu growing in importance.
author: machine:claude-code
