    prop: name
    value: { en: "Farm animals and fowl of Iron Age Greece and Italy" }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 776 BCE, hi: 540 BCE }
    source:
      ref: src:peters-2022-chickens
      loc: "Results, \"Europe.\""
      quote: "the earliest directly dated chickens in southern Europe have been excavated in Italy from two Greek colonies dated to 776 to 540 BCE"
    method: expert-estimate
    note: >-
      The dates of the earliest directly dated chickens in southern Europe. The animals are still kept, so there is no end claim.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in peters-2022-chickens.txt (sha256 b75c9dadef531c16), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
