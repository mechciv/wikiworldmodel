        loc: "Introduction, \"The Indus Civilisation and evidence for animal use\""
        quote: "Indus zooarchaeological assemblages typically have a high proportion of cattle (largely Bos indicus) and/or water buffalo (Bubalus bubalis)"
      - ref: src:peters-2022-chickens
        loc: "Results, on the Indian subcontinent"
        quote: "prominent in the subsequent early Jorwe levels dating from ∼1500 to 1200 BCE"
    method: excavation
    note: >-
      The animals of the broader tradition, with chickens.
