    value: [farmers]
    source:
      ref: src:peters-2022-chickens
      loc: "Results, on the Indian subcontinent"
      quote: "poultry farming in South Asia was a post-Harappan development"
    method: editorial
    note: >-
      Farmers, as the broader tradition.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in peters-2022-chickens.txt (sha256 b75c9dadef531c16), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  livestock:
    prop: livestock
    value: [life/taxa/bos-indicus, life/taxa/bubalus-bubalis, life/taxa/ovis-aries, life/taxa/capra-hircus, life/taxa/sus-domesticus, life/taxa/gallus-domesticus]
    source:
