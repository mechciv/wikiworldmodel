id: people/husbandry/xiongnu-herds
kind: tradition/husbandry
summary: >-
  The sheep, goats, cattle and horses, and a few dogs, of the herders of the Mongolian steppe from the Xiongnu period, moved between seasonal pastures and foddered in winter.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: "Herds of the Mongolian steppe" }
    unsourced: An editorial label.
  start:
    prop: start
    value: 250 BCE
    source:
      ref: src:makarewicz-2024-xiongnu-elites
      loc: "caption of Fig 1"
      quote: "The extent of the Xiongnu Empire (ca 250 BCE– 150 AD)"
    method: expert-estimate
    note: >-
      The start of the Xiongnu period, the earliest the source read dates these herds to; herding there is older, and goes on today, so there is no end claim.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in makarewicz-2024-xiongnu-elites.txt (sha256 bf88a829bea80f16), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-20" }
  extent:
