id: people/traditions/joseon-tiled-town-house
kind: tradition/building
summary: >-
  The tile-roofed house (giwa-jip) of Korea's towns under the Joseon dynasty, from 1392: the house of the upper and
  middle classes and of urban commoners, a timber frame whose posts stood on cornerstones, under a roof of fired tiles,
  as against the thatched house of the provincial commoners. The county seats (eupchi) where townspeople lived were
  the seats of the magistrates; about a third of them, the larger ones most, stood inside walls (eupseong), which
  Joseon rebuilt or built anew in stone, low and, where there was one, with a moat too narrow to defend.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Tile-roofed town house of Joseon Korea }
    unsourced: An editorial label.
  start:
    prop: start
