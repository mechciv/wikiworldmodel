      loc: "p. 103, Introduction"
      quote: Joseon (1392–1910), born from the dynasty-changing revolution
    method: expert-estimate
    note: >-
      The start of the Joseon dynasty, the period whose classes the encyclopedia's sentence describes; tiled roofs are
      far older in Korea. No end is given within this record's span.
    checked:
