  town:
    prop: town_form
    value: { wall: stone }
    source:
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 125"
        quote: >-
          This process involved the renovation and expansion of existing earthen fortresses into stone ones, or the
          construction of new stone fortresses
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 125"
        quote: The number of eupseong increased from approximately 110
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 112"
        quote: >-
          Even if the eupchi had a wall, the larger scale the wall had, the more likely private residences formed a
          community within it.
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 123"
        quote: Joseon’s fortresses were built too low for defensive purposes.
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 123"
        quote: the moats, which were only built in some fortresses
    method: documentary
    note: >-
      A stone wall, which Joseon gave its walled county seats from the fifteenth century. Only some had one: about 110
      of some 330 county seats in the early fifteenth century, 132 to 144 in the late nineteenth (p. 125), and houses
      stood inside the larger walls. So a wall is drawn round towns that in most counties had none. The wall was low,
      and its height is not given; the moat, built at some, is not claimed. The streets are not described.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in kim-2025-eupchi-eupseong.txt (sha256 5a260fd60a988efb), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
