    source:
      - ref: src:wikipedia-hanok
        loc: section "Variations", "By social class"
        quote: >-
          Typically the houses of yangban (upper class), jungin (middle class) and urban commoners, with giwa (tiled
          roof), emphasized not only the function of the house, but also its aesthetics.
      - ref: src:wikipedia-hanok
        loc: section "Characteristics"
        quote: >-
          The posts, or daedulbo, are not inserted into the ground, but are fitted into the cornerstones to keep hanok
          safe from earthquakes.
      - ref: src:kim-2025-eupchi-eupseong
        loc: "p. 123"
        quote: The walls also contributed to differentiate the magistrate and local officials, who work from their splendid tile-roofed houses
      - ref: src:wikipedia-hanok
        loc: section "Materials"
        quote: >-
          A form of traditional Korean paper (hanji), lubricated with bean oil to make it waterproof and polished, is
          used to make breathable windows and doors.
      - ref: src:wikipedia-hanok
        loc: section "Characteristics"
        quote: >-
          the Ondol (Gudeul), a floor-based heating system, and the Daecheong, a cool wooden-floor style hall, were
          devised long ago
      - ref: src:wikipedia-ondol
        loc: opening section
        quote: >-
          a raised masonry floor underlain by horizontal smoke passages, and a vertical, freestanding chimney on the
          opposite exterior wall providing a draft.
    method: expert-estimate
    note: >-
      A tiled roof on a timber frame set on cornerstones. The walls (the article speaks of wooden beams and stone-block
      construction, without saying which), the plan (in a line, L-shaped or square by region) and the size are left
      out; no source read here gives a town house's size. The windows are of oiled paper (hanji), which is "large", in
      the article's section on the materials of the tile-roofed house; it does not say how many or how big. The smoke
      left by the chimney of the heated floor (ondol): the hanok article names the ondol as the house's heating, and
      the ondol article puts a freestanding chimney on the outer wall opposite the firebox. The ondol's raised masonry
      floor is not written as the floor, since the hanok's wooden-floored hall (daecheong) stood beside it; how high
      either stood is not given.
    checked:
