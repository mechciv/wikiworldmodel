          a number of people lived in a community, often forming four or five miles of continuous garden with families
          living each on their own plot
    method: documentary
    note: >-
      Each family's house on its own plot in the gardens, the houses a little apart, with no village of the European kind.
      A fence enclosed the back premises of a house, as Roscoe mentions it in the ceremonies for twins (chap. II, p. 68),
      which is the yard's fence; he describes how the reed fences of the royal and chiefs' enclosures were built (chap.
      XI, pp. 368-369) but not a peasant's. The plots' own boundaries were vague, a gutter or a shrub here and there (chap.
      I, p. 15). No building by the house is described for a peasant: the cattle kraals of thorn are the King's and the
      chiefs' (chap. XII, p. 417).
