    value: { plan: round, walls: none, roof: conical, roof_material: thatch, height: { lo: 4, hi: 5.5 }, rooms: 2, floor: ground, porch: true, smoke: none, byre: true }
    source:
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 369"
        quote: In the building of a round house, the work was begun from
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 371"
        quote: The central pillars of a good house were about fifteen or twenty feet long
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 372"
        quote: They were planted two feet in the ground
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 372"
        quote: This reedwork-roof was carried down to the ground on all sides, except in the doorways.
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 372"
        quote: The grass for thatching was a special broad-bladed variety which grew in every part of the country.
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 373"
        quote: adding layer upon layer, to the top of the conical house.
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 374"
        quote: over the doorway a hood was built to form a porch
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 374"
        quote: Floor-making was also a special occupation ; the earthen … floor was first dug up and levelled
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 375"
        quote: >-
          A wall across the middle divided the house into two equal … portions, one of which was the sitting room, and the
          other the … sleeping room
      - ref: src:roscoe-1911-baganda
        loc: "chap. XI, p. 376"
        quote: >-
          No house was provided with a chimney ; the smoke from the fires had to find its way out through the doorway or the
          roof.
      - ref: src:roscoe-1911-baganda
        loc: "chap. XII, p. 417"
        quote: Poor people took their cows into their houses by night
      - ref: src:roscoe-1911-baganda
        loc: "chap. XII, p. 422"
        quote: Goats were kept in the houses by night
    method: documentary
    note: >-
      A round house whose roof of stitched reeds came down to the ground, so it had no walls, thatched with grass to the top
      of the cone. The height is from the central pillars, on which the ring at the top of the roof rested: fifteen or
      twenty feet long, two of them in the ground, so the top stood some thirteen to eighteen feet, 4 to 5.5 m, above the
      floor; that reckoning is the writer's, and it is of "a good house". The only diameter given is a large house's,
      thirty feet at the base (p. 376), and as peasants' houses differed from chiefs' in their dimensions it is not
      entered. Roscoe's chapter on building gives the rest: a porch, a hood built over the doorway at a gentler slope than
      the roof (p. 374); an earthen floor, beaten hard and smeared with clay and cowdung (pp. 374-375), at the level of
      the ground; two rooms, a sitting room and a sleeping room either side of a wall across the middle (p. 375); no
      chimney, the smoke leaving by the doorway or through the roof, entered as smoke none (p. 376). Goats were kept in
      the houses by night, tethered where the roof sloped down low, and poor people took their cows in too (pp. 417,
      422): entered as a byre under the same roof. Where the doorway faced is not said; large houses had a second door at
      the back.
