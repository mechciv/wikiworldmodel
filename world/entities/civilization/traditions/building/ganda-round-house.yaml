id: people/traditions/ganda-round-house
kind: tradition/building
summary: >-
  The round house of the Baganda, north and west of Lake Victoria, as Roscoe described the customs before colonial rule:
  a cone of stitched reeds on rings of posts, built from the top down and carried to the ground on every side but the
  doorway, thatched a foot thick with broad-bladed grass, standing among the plantain gardens of its family, each a
  little apart from the next. The span is a reading: it starts with the founding of the kingdom as the encyclopedia
  dates it from tradition, which is not a date for the house, and has no end, as no source read says when such houses
  ceased to be built.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Ganda round house }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 1200 CE, hi: 1400 CE }
    source:
      ref: src:wikipedia-buganda
      loc: section "Clans of Baganda", "Kintu migration"
      quote: >-
        The Abalasangeye dynasty came to power through the conquests of Kabaka of Buganda ssekabaka Kintu, which are
        estimated to have occurred sometime between 1200 and 1400 AD.
    method: tradition
    note: >-
      When the kingdom is reckoned to have been founded, from its king lists, taken as a bound by which the Ganda way of
      life, and so its house, is taken to have stood. No source read here describes a Ganda house before Speke's of 1862
      or dates one by excavation, so this is a reading, not a date for the house. There is no end claim: Roscoe writes of
      these houses in the past tense, of the customs of before about 1900, but no source read says when they ceased to be
      built.
    checked:
