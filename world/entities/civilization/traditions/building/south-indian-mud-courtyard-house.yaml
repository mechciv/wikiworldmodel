id: people/traditions/south-indian-mud-courtyard-house
kind: tradition/building
summary: >-
  The common house of the villages and towns of southern India, from the Carnatic plain to Mysore and Hyderabad: low,
  of one storey, with walls of mud, its few rooms set round a small court open to the sky, and one door to the street,
  on which side there was usually a veranda. The labourer's hut of one room was thatched; better houses were tiled, or on
  the dry plateau roofed flat with a terrace of mud. Houses of one storey, flat-roofed and each within a low wall,
  were seen in the city of Vijayanagar about 1520; mud walls round a court are described at Conjeveram and above the
  Ghats in 1800, and in the gazetteer of 1908. No end is given: it was still the ordinary house when the gazetteer was
  written.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Mud-walled courtyard house of southern India }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 1520 CE, hi: 1522 CE }
    source:
      - ref: src:paes-1520-narrative-vijayanagar
        loc: "heading of the narrative, p. 235"
        quote: WRITTEN PROBABLY … 1520-22
      - ref: src:paes-1520-narrative-vijayanagar
        loc: "p. 290"
        quote: >-
          Of the city of Bisnaga they say that there are more than a hundred thousand dwelling-houses in it, all
          one-storeyed and flat-roofed, to each of which there is a low surrounding wall
    method: documentary
    note: >-
      The years in which the translator thinks Paes wrote, the earliest account read: the houses of the city of
      Vijayanagar, all of one storey and flat-roofed, each within a low wall. It bounds the start and does not date it:
      the house is surely older, and no earlier account of the common house of the south was read. Paes does not say
      what the walls were made of, and gives the houses as what was said of the city; walls of mud and rooms round a
      court are first described, in what was read, in 1800. No end is given, and none is known from what was read: the
      latest account, the gazetteer of 1908, has it as the ordinary house of its own day.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in paes-1520-narrative-vijayanagar.txt (sha256 0bcec8f487ccba8d), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
