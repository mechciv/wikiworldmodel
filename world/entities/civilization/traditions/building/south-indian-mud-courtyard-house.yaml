        quote: The houses and huts have their walls universally built of this mud
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, above the Ghats, p. 33"
        quote: >-
          the mud being smoothed, and painted on the outside, with alternate vertical broad stripes of white and red.
          The white is lime
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, above the Ghats, p. 33"
        quote: >-
          The huts are built in the form of a parallelogram, without veranda or windows, or any other vent for the
          smoke than the doors.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XVI, article Madras Presidency, p. 266"
        quote: >-
          On the street side is usually a veranda, which is not considered to be part of the house and so can be used
          by strangers
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, the plain behind Madras, p. 2"
        quote: >-
          many of the huts being built of mud, and neatly covered with tiles, have a better appearance than those in
          Bengal: but the roofs of such as are thatched look ragged
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XVI, article Madras Presidency, p. 266"
        quote: >-
          Houses vary in degree from the one-roomed, mud-walled, thatched-roof hut of the labouring classes to the
          elaborate dwelling of the rich money-lender or landowner. The ordinary house contains a central court,
          surrounded by various rooms and opening by one door into the street.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XVI, article Madras Presidency, p. 266"
        quote: In the Deccan there is usually no court and no outer veranda, and the roofs are flat.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XVIII, article Mysore State, p. 208"
        quote: >-
          The dwellings of the people are generally of mud, one-storeyed and low, with few, if any, openings outwards
          except the door, but possessed of courtyards within, surrounded with verandas and open to the sky.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XVIII, article Mysore State, p. 208"
        quote: >-
          The huts of the outcaste and poorer classes are thatched … the houses of the higher orders are covered with
          either terraced or tiled roofs
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XIII, article Hyderabad State, p. 250"
        quote: >-
          of the common cultivator consists of three or four small rooms, the walls being of mud and the roof tiled or
          thatched, the rooms being built round a bhavanti or courtyard
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XIII, article Hyderabad State, p. 244"
        quote: The houses are usually built of mud with thatched roofs.
    method: documentary
    note: >-
      The plan is Buchanan's of 1800, a square with a small court in the centre at Conjeveram and, by the contrast he
      draws with the houses of Vencataghery, a square court and a veranda in the Tamil villages; it is the
      gazetteer's of 1908 for Madras, Mysore and Hyderabad alike. Mud is taken
      as earth built up without a frame, which the vocabulary calls cob: above the Ghats Buchanan has walls of a
      reddish clay that stand the rains for many years. One storey is Buchanan's of Conjeveram and the gazetteer's of
      Mysore, as it was Paes's of Vijayanagar; three or four rooms are those of the common cultivator of Hyderabad,
      and the labourer's hut had one. The roof differed with the place and the means and no one word holds it. Thatch
      is written, as the roof of the labourer's hut in Madras, of the poorer classes in Mysore and of the usual house
      in Hyderabad; in the plain behind Madras it was of palmyra leaves. Tiles covered the houses of Conjeveram and
      many huts of that plain in 1800 and the better houses of Mysore in 1908, and the gazetteer says the proportion
      of tiled to thatched dwellings in Madras had risen. On the plateau many houses had flat roofs terraced with mud
      in 1800, and in the Deccan districts of Madras the roofs were flat in 1908, with no court and no veranda: the
      Telugu houses Buchanan saw at Vencataghery had neither. The shape of the roof is left to the generator, and no
      size is given. In the Mysore sentence the ellipsis stands for "; but", which the scan's text spaces oddly. The
      finish is Buchanan's above the Ghats in 1800: the mud of houses and huts alike was smoothed and painted outside in
      broad upright stripes of white lime and red clay, as the little walls along the streets of Conjeveram were. No
      windows and no vent for the smoke but the door are his of the huts above the Ghats, and the gazetteer has the mud
      houses of Mysore in 1908 with few, if any, openings outwards except the door. The veranda is the gazetteer's for
      Madras, usually on the street side, where strangers could sit without entering; Buchanan's Tamil villages had
      one; in Mysore the verandas surrounded the court within. The huts above the Ghats had none, nor had the Telugu
      houses of Vencataghery, nor the houses of the Deccan districts of Madras in 1908: the veranda is of the courtyard
      house this record draws, not of the one-roomed hut. Which side the door was in is not said beyond its opening
      on the street.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in buchanan-1807-journey-mysore-vol-1.txt (sha256 98b82efda7c1eefb) and imperial-gazetteer-of-india-1908.txt (sha256 6cdf9985eed79137), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  settlement:
    prop: settlement_form
    value: { pattern: nucleated, enclosure: wall, yard: wall, household: 5.2 }
    source:
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, above the Ghats, p. 32"
        quote: while the village, or Pettah, is surrounded by a weaker defence of mud.
      - ref: src:paes-1520-narrative-vijayanagar
        loc: "p. 290"
        quote: >-
          all one-storeyed and flat-roofed, to each of which there is a low surrounding wall
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, above the Ghats, p. 32"
        quote: All the houses are collected in villages … the smallest village, of five or six houses, is fortified
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. I, chapter IX, p. 456"
        quote: >-
          Elsewhere again, as in the greater part of Madras and Bengal proper, the houses, while still collected on a
          common site, are well separated and each stands in its own ground.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XIII, article Hyderabad State, p. 244"
        quote: walled villages are found all over the State
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. I, chapter IX, p. 458"
        quote: compared with a general mean of 5-2), but elsewhere it is generally very uniform
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. I, chapter IX, p. 458"
        quote: >-
          the figures for Bombay and Madras, where the … criterion was adopted, differ scarcely at all from those for
          Bengal and Burma
    method: survey
    note: >-
      Houses gathered in villages: above the Ghats in 1800 every village was fortified, down to one of five or six
      houses, and in 1908 walled villages were found all over Hyderabad State, while in most of Madras the houses
      stood on one site but apart, each in its own ground. The household is the mean of all India at the census of
      1901, 5·2 persons to a house; the gazetteer gives no figure for Madras by itself, and says that outside the
      Punjab and Kashmir the provinces vary little and that Madras, where the house counted was the enclosure, differs
      scarcely at all from Bengal. The scan's text writes the decimal point as a hyphen, and the quote keeps its
      characters; the second ellipsis stands for the word enclosure in quotation marks, which the scan's text spaces
      oddly. The gazetteer gives Hyderabad's villages about 500 people each, a census village and not a count of
      houses, so the number of houses in a village is not stated. The enclosure is a wall: above the Ghats in 1800 a
      larger village or a town had a fort for a citadel and the village round it a weaker defence of mud, and the
      smallest had a round stone tower forty feet across and six feet high to flee into; walled villages are the
      gazetteer's for all Hyderabad in 1908. Most of Madras, where the houses stood apart each in its own ground, had
      no such wall that the sources read describe, so the word holds for the plateau more than for the plain. Each
      house within a low wall of its own is Paes's, of the houses of the city of Vijayanagar about 1520.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in buchanan-1807-journey-mysore-vol-1.txt (sha256 98b82efda7c1eefb), paes-1520-narrative-vijayanagar.txt (sha256 0bcec8f487ccba8d) and imperial-gazetteer-of-india-1908.txt (sha256 6cdf9985eed79137), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
