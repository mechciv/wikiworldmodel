        quote: >-
          The dwellings of the people are generally of mud, one-storeyed and low, with few, if any, openings outwards
          except the door, but possessed of courtyards within, surrounded with verandas and open to the sky.
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XIII, article Hyderabad State, p. 250"
        quote: >-
          of the common cultivator consists of three or four small rooms, the walls being of mud and the roof tiled or
          thatched, the rooms being built round a bhavanti or courtyard
    method: editorial
    note: >-
      Region 110 (Southern India), which holds Conjeveram (Kanchipuram) and the plain behind Madras, the Mysore
      plateau, the city of Hyderabad and the ruins of Vijayanagar, by their coordinates against the region outlines.
      The Madras Presidency and Hyderabad State of 1908 reached beyond it, into regions 111 and 108, which are left to
      other records. The house is not claimed for all of the region. The west coast is in it and built otherwise:
      there, the gazetteer says, there was no village site and each cultivator made his dwelling where it suited him,
      and Buchanan found the people of Malabar in detached houses among gardens. No record is written for that house,
      and this one will be drawn there.
    checked:
