      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, above the Ghats, p. 33"
        quote: in many towns and villages, the houses have flat roofs terraced with this mud
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, Conjeveram, p. 12"
        quote: >-
          none of the houses are more than one story high. The streets are tolerably wide and clean, and cross one
          another at right angles.
    method: editorial
    note: >-
      Farmers: the common cultivator of Hyderabad State in 1908, and the villages above the Ghats in 1800.
      Townspeople: the towns of the same country in 1800, the town of Conjeveram, most of whose houses were lived in
      by Brahmans of its temples, and the city of Vijayanagar about 1520. The gazetteer of Madras has the same plan
      from the labourer's hut of one room up to the elaborate dwelling of the rich money-lender or landowner, which
      this record does not draw.
    checked:
