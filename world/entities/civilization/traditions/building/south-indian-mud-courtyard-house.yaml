        quote: >-
          none of the houses are more than one story high. The streets are tolerably wide and clean, and cross one
          another at right angles.
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, Conjeveram, p. 12"
        quote: >-
          The houses have mud walls, and are roofed with tiles. Each is built in the form of a square with a small court
          in the centre.
      - ref: src:buchanan-1807-journey-mysore-vol-1
        loc: "chapter I, Vencataghery, p. 30"
        quote: >-
          The houses are much inferiour to those in the Tamul villages. They are built of mud, with thatched roofs; but
