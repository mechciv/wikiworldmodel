    source:
      - ref: src:imperial-gazetteer-of-india-1908
        loc: "vol. XIII, article Hyderabad State, p. 250"
        quote: In the evenings they gather at the village chaiiri and join in gossip
    method: documentary
    note: >-
      The village chauri of Hyderabad State in 1908, where the cultivators gathered in the evenings (the scan misreads
      the word as "chaiiri", and the quote keeps it); what it was like is not said. The fort or tower of the villages
      above the Ghats, which Buchanan describes, has no word among the outbuildings and is left to the settlement's
      note. Temples are described only for towns, such as the great temples of Conjeveram, and are not written.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in imperial-gazetteer-of-india-1908.txt (sha256 6cdf9985eed79137), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  town:
    prop: town_form
    value: { wall: earth }
    source:
      - ref: src:paes-1520-narrative-vijayanagar
        loc: "p. 237"
        quote: >-
          The whole country is thickly populated with cities and towns and villages; the king allows them to be
          surrounded only with earthen walls for fear of their becoming too strong.
    method: documentary
    note: >-
      Walls of earth, the only walls the king of Vijayanagar allowed his cities, towns and villages about 1520; a city
      at the edge of his territory might have walls of stone, Paes adds, but never a town. In 1800 Buchanan still
      found towns and villages above the Ghats fortified with mud walls and hedges. It is not the wall of every town
      of the region or the time. The streets are not stated: Buchanan found those of Conjeveram tolerably wide and
      crossing at right angles, in a town he calls very regularly built, and that is one town.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in paes-1520-narrative-vijayanagar.txt (sha256 0bcec8f487ccba8d), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
