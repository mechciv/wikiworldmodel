    prop: dwelling
    value: { plan: courtyard, court: true, storeys: 1, rooms: { lo: 3, hi: 4 }, walls: cob, finish: painted, roof_material: thatch, windows: none, smoke: none, veranda: true }
    source:
      - ref: src:buchanan-1807-journey-mysore-vol-1
