    method: survey
    note: >-
      What stood in the court of the tulou, the house of a whole clan, so written as the house's: two or three wells,
      and at the centre a small building open at the front, the ancestral hall, used for worship and for the clan's
      festivals and meetings (the encyclopedia). The paper has an ancestral common area in every tulou. The ancestral
      hall is written as a shrine, the use it is named for; it served as the clan's hall too. The wells of each
      household's kitchen in the richer tulou were inside the ring, and are not written. The paper's granaries and
      schools are "in some cases" and left out.
