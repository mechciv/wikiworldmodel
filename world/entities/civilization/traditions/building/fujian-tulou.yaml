    method: survey
    note: >-
      The round tulou, the kind all eight of the paper's cases are; it has square, oval and other shapes too, and
      the encyclopedia calls the rectangular and the circular the commonest. Storeys, the rammed-earth outer wall and
      the central court are the paper's. Its "hip and gable roof" was first written as gable, when the vocabulary had
      no word for it, and is now the vocabulary's hip-and-gable, in the paper's own words. The diameters are the smallest and the largest round tulou the encyclopedia
      names, cited because the paper gives ceilings only, 60 m for the Hakka's and 80 m for the Minnan's, and an
      area from about 500 to 4,000 or 5,000 square metres, for which a dwelling has no parameter; the tiled roof is
      the encyclopedia's too. Inside, the Hakka's have a timber frame with partitions of mud brick, their ring of
      rooms and gallery 4 to 6 m deep, and the Minnan's have cross-walls of rammed earth. The outer wall had few
      openings, and those high up: no window in the two lowest storeys, windows only from the third up, written as
      the vocabulary's small windows, as the sources give their number and height and not their size. Round the court,
      on every storey above the ground, ran a gallery of boards on beams set into the earth wall, which is the
      vocabulary's veranda. There was a single gate (both sources), which for a round house has no word of the
      vocabulary's, and is left out; Chengqi Lou has two main gates and two side gates.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in colafranceschi-2020-tulou.txt (sha256 9fe40f5380e77788) and wikipedia-fujian-tulou.txt (sha256 d7741233f1f05fed), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
