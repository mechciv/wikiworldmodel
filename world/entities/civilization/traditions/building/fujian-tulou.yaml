      loc: "p. 937, section 1"
      quote: Tulou are traditional rural architectures built in southern Fujian between XIV and XX century
    method: expert-estimate
    rank: preferred
    note: >-
      The fourteenth century, as the paper dates the first of them, from the literature it follows. Preferred to the
      encyclopedia's twelfth century because the paper is the better source and the encyclopedia's own oldest tulou
      is of 1371.
