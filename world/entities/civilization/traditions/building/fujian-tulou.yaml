id: people/traditions/fujian-tulou
kind: tradition/building
summary: >-
  The tulou of the hill country of southern Fujian: one great enclosed building of three or four storeys, most often
  round or rectangular, its outer wall of rammed earth with a single gate and few openings, rooms of timber ranged
  inside it round a central court, under a tiled roof, built by the Hakka and the Minnan as the house of a whole clan
  of farmers. They were built from the fourteenth century to the twentieth, and some three thousand still stand. It is
  one house of the region's hills, not the house of its lowland farmers, of which nothing was read.
author: machine:claude-code
