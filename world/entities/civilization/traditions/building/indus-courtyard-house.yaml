id: people/traditions/indus-courtyard-house
kind: tradition/building
summary: >-
  The house of the cities and towns of the Indus civilization in its urban phase, about 2600–1900 BCE: rooms of brick
  around an inner courtyard, of one or two storeys, opening onto the courtyard and the side lanes rather than the street.
  It is known from Harappa, Mohenjo-daro, Rakhigarhi and Lothal. Where the houses were of fired brick is a narrower
  tradition; what the houses of the villages were like is not said here.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Courtyard house of the Indus cities }
    unsourced: An editorial label.
  start:
    prop: start
    value: 2600 BCE
    source:
      - ref: src:wikipedia-indus-valley-civilisation
        loc: opening section
        quote: in its mature form from 2600 BCE to 1900 BCE
      - ref: src:lancelotti-2018-indus-fuel
        loc: Abstract
        quote: At its urban apex, the populations of the Indus Civilisation (2600–1900 BC) produced a wide range of objects and crafts
    method: expert-estimate
    note: The start of the mature, urban phase of the civilization, taken as the start of its city house.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-indus-valley-civilisation.txt (sha256 746600d1d517eb71) and lancelotti-2018-indus-fuel.txt (sha256 1dc0c9208e2b87a1), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  end:
    prop: end
    value: 1900 BCE
    source:
      - ref: src:wikipedia-indus-valley-civilisation
        loc: opening section
        quote: in its mature form from 2600 BCE to 1900 BCE
      - ref: src:lancelotti-2018-indus-fuel
        loc: Abstract
        quote: At its urban apex, the populations of the Indus Civilisation (2600–1900 BC) produced a wide range of objects and crafts
    method: expert-estimate
    note: >-
      The end of the urban phase. People went on living at Lothal and elsewhere after it, the Lothal article says in "poorly
      built houses and reed huts"; that later housing is not this tradition.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-indus-valley-civilisation.txt (sha256 746600d1d517eb71) and lancelotti-2018-indus-fuel.txt (sha256 1dc0c9208e2b87a1), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  extent:
    prop: extent
    value: { from: src:archaeoglobe-2019-regions, names: ["105", "107", "109"] }
    source:
      - ref: src:wikipedia-indus-valley-civilisation
        loc: section "Mature Harappan", "Cities"
        quote: >-
          As seen in Harappa, Mohenjo-daro and the 2010s partially excavated Rakhigarhi, this urban plan included the world's
          first known city sanitation systems. … Houses opened only to inner courtyards and smaller lanes.
      - ref: src:wikipedia-lothal
        loc: section "Acropolis and lower town"
        quote: The identified bathing platforms are located in the acropolis, and part of mostly two-roomed houses with open courtyards.
    method: editorial
    note: >-
      Region 105 (Pakistan) for Harappa and Mohenjo-daro, region 107 (Northern India) for Rakhigarhi in Haryana, and region
      109 (Northwestern India) for Lothal in Gujarat, matched by the sites' coordinates on Wikipedia against the region
      outlines. The house is not claimed for all of any of them: the sources describe the cities, and say that most people
      lived in the countryside.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-indus-valley-civilisation.txt (sha256 746600d1d517eb71) and wikipedia-lothal.txt (sha256 b445624a22f203aa), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  lifeway:
    prop: lifeway
    value: [townspeople]
    source:
      - ref: src:wikipedia-indus-valley-civilisation
        loc: section "Mature Harappan", "Cities"
        quote: >-
          Within the city, individual homes or groups of homes obtained water from wells. … Houses opened only to inner
          courtyards and smaller lanes.
      - ref: src:wikipedia-indus-valley-civilisation
        loc: section "Mature Harappan", "Cities"
        quote: >-
          Most city dwellers appear to have been traders or artisans, who lived with others pursuing the same occupation in
          well-defined neighbourhoods.
    method: editorial
    note: >-
      The courtyard houses the article describes stood inside the cities, whose people were mostly traders and artisans.
      Farmers are not named: no source read says the houses of the villages were built round a courtyard.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-indus-valley-civilisation.txt (sha256 746600d1d517eb71), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  dwelling:
    prop: dwelling
    value: { plan: courtyard, court: true, storeys: { lo: 1, hi: 2 } }
    source:
      - ref: src:wikipedia-harappan-architecture
        loc: section "Materials"
        quote: Houses range from 1–2 stories in height, with a central courtyard around which the rooms were arranged
      - ref: src:wikipedia-indus-valley-civilisation
        loc: section "Mature Harappan", "Cities"
        quote: Houses opened only to inner courtyards and smaller lanes.
      - ref: src:wikipedia-lothal
        loc: section "Acropolis and lower town"
        quote: The identified bathing platforms are located in the acropolis, and part of mostly two-roomed houses with open courtyards.
    method: excavation
    note: >-
      The plan and the storeys are from the first quote, which the article itself quotes from Miller and from World History
      Encyclopedia; the other two place courtyards at the cities named and at Lothal. The walls are left to the narrower
      tradition and the generator: the same article says the houses of the cities were of baked brick and those of the
      countryside of mud brick, and the Lothal article has houses of mud and brick there. No source read gives a house's size.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-harappan-architecture.txt (sha256 05a5b1f9eeb040d5), wikipedia-indus-valley-civilisation.txt (sha256 746600d1d517eb71) and wikipedia-lothal.txt (sha256 b445624a22f203aa), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  outbuildings:
    prop: outbuildings
    value:
      - { use: well, per: settlement }
    source:
      - ref: src:wikipedia-harappan-architecture
        loc: section "Overview", "Planning"
        quote: with each block containing a network of houses and public wells
      - ref: src:wikipedia-lothal
        loc: section "Excavated Lothal", "Dockyard"
        quote: The identification of just two wells in the town, one on the southern edge of the dock and the other on the acropolis
    method: excavation
    note: >-
      Public wells among the houses of the blocks, in the article on Harappan architecture, which is an encyclopedia
      cited because nothing better was read; at Lothal two wells were identified in the whole town, one by the dock and
      one on the acropolis, a count put forward by those who read the dock as a tank. How many to a town is not stated for the tradition. The houses' own wells of the great
      cities are the narrower tradition's. The granaries of the citadels are not written: they stood in the citadels,
      not among the houses, and their use as granaries is disputed.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-harappan-architecture.txt (sha256 05a5b1f9eeb040d5) and wikipedia-lothal.txt (sha256 b445624a22f203aa), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  town:
    prop: town_form
    value: { streets: grid }
    source:
      ref: src:wikipedia-harappan-architecture
      loc: section "Overview", "Planning"
      quote: >-
        The cities were divided into rectilinear grids divided by roads which intersected at right angles, encircled by
        fortifications, with each block containing a network of houses and public wells.
    method: excavation
    note: >-
      The Indus cities on a grid of streets crossing at right angles, inside fortifications. What the walls were built of, and
      the size of a block, are not given there, so only the streets are claimed; at Lothal a wall of mudbrick, at Kanmer one of
      stone, show that the walls' material varied.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-harappan-architecture.txt (sha256 05a5b1f9eeb040d5), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
