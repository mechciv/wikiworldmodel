id: people/traditions/roman-domus
kind: tradition/building
summary: >-
  The town house (domus) of the well-off in Roman Italy, from the second century BCE: a house turned inward on its
  atrium, a hall whose roof sloped down on all sides to an opening over a basin, and behind it a peristyle, a garden
  within a colonnade, with the rooms about the two. It was low, of one storey with rooms over parts of it, of rubble set
  in mortar under tiled roofs, with few and small windows on the street, and its front rooms on a busy street were
  often shops. Known from Vitruvius, from the houses dug at Pompeii as Mau describes them, and from Smith's dictionary;
  in Rome it was the house of the rich, of which the fourth-century catalogue counted about 1,790 against some 44,000 to
  46,600 apartment blocks (people/traditions/roman-insula).
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Atrium house (domus) of Roman Italy }
    unsourced: An editorial label.
  start:
    prop: start
    value: { lo: 200 BCE, hi: 101 BCE }
    source:
      ref: src:mau-1902-pompeii
      loc: "chap. XXXIII, p. 246"
      quote: >-
        We find the union of atrium and peristyle with their respective groups of apartments fully accomplished in the
        second century B.C., the Tufa Period; the type of dwelling thus developed remained in vogue during Roman times
        and is often called the Roman house.
    method: expert-estimate
    note: >-
      The second century BCE, by when the atrium and the peristyle had been joined in one house at Pompeii, in Mau's
      Tufa Period, which he puts at about 200 to 90 BCE (p. 40). The atrium house without a peristyle is older there;
      the dictionary has houses of any splendour built at Rome only in the last century of the Republic.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mau-1902-pompeii.txt (sha256 35b30b5906cc32ba), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
  end:
    prop: end
    value: { lo: 334 CE, hi: 357 CE }
    source:
      ref: src:smith-1890-dictionary-of-antiquities
      loc: 's.v. "Domus", III. Roman, p. 665 a'
      quote: >-
        The number of insulae at Rome naturally exceeded that of the domus … which was compiled between A.D. 334 and 357,
        that there were at Rome 44,171 insulae and 1782 domus
    method: expert-estimate
    note: >-
      An end of the evidence and not of the house: the latest count read of the city's domus, in the fourth-century
      catalogue as the dictionary dates it. When the house ceased to be built or lived in, nothing read says.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in smith-1890-dictionary-of-antiquities-vol1.txt (sha256 6870cebc90dd52e4), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
  extent:
    prop: extent
