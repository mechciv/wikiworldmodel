    source:
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, p. 245"
        quote: >-
          Our chief sources of information regarding the domestic architecture of ancient Italy are two,—the treatise of
          Vitruvius, and the remains found at Pompeii.
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 667 b'
        quote: There can be no doubt that the latter are constructed upon the model of the houses at Rome
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 667 b'
        quote: The municipal towns imitated in their buildings those of Rome
    method: editorial
    note: >-
      Region 44 (Southern Europe), which holds Rome and Pompeii, by their coordinates against the region outlines. The
      dictionary has the houses of Pompeii built on the model of Rome's, and the towns of Italy imitating Rome's
      buildings. The house is not claimed for the rest of the region, Greece and the Balkans.
    checked:
