  lifeway:
    prop: lifeway
    value: [townspeople]
    source:
      - ref: src:vitruvius-de-architectura
        loc: "6.5.3 (Gwilt's translation)"
        quote: >-
          These rules are no less applicable to country than to town dwellings, except that in town the atria must be
          close to the gates
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 666 b'
        quote: We now turn to the history and construction of the domus, or mansion of the great and wealthy.
    method: editorial
    note: >-
      The town house: Vitruvius sets the atrium by the gates in town, and the peristyle by the entrance in the country
      house, which is not this record's and is not claimed for the countryside's people.
    checked:
