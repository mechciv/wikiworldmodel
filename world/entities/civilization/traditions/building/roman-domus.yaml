  dwelling:
    prop: dwelling
    value: { plan: courtyard, court: true, storeys: { lo: 1, hi: 2 }, walls: stone, roof_material: tile, windows: small }
    source:
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, p. 245"
        quote: >-
          They took their light and air from the inside, the apartments being grouped about a court or about a large
          central room which ordinarily had an opening in the ceiling
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, p. 245"
        quote: >-
          The ancient houses were relatively low, in most cases, if we except the crowded tenements of imperial Rome, not
          exceeding two stories.
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, section XI, p. 273"
        quote: With few exceptions the houses of pre-Roman Pompeii were built in only one story
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, section XI, p. 273"
        quote: A complete second story was rare
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 665 a'
        quote: >-
          was a separate house, in later times a palace, usually with only one story above the ground-floor, the abode of
          the rich and great
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 679'
        quote: >-
          The presence of stairs in apparently all the houses proves that one-storied buildings were practically unknown
          in Pompeii
      - ref: src:mau-1902-pompeii
        loc: "chap. VI, p. 38"
        quote: >-
          Rubble work is the prevailing masonry at Pompeii; in comparison the other kinds described may be considered
          exceptional.
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, section II, p. 251"
        quote: >-
          carrying the tiles, the arrangement of which can be seen in Figs. 114, 117, and 118. This was the most common
          arrangement of the roof at Pompeii.
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, p. 245"
        quote: The windows in the outside walls were generally few and small
      - ref: src:mau-1902-pompeii
        loc: "chap. XXXIII, section V, p. 259"
        quote: >-
          In front there were rooms at either side of the entrance, ordinarily fitted up as shops and opening on the
          street
    method: excavation
    note: >-
      The house as dug at Pompeii, which the dictionary takes for the model of Rome's: rooms about the atrium, and in the
      larger houses about the peristyle too, so a courtyard plan. The atrium's roof sloped down on all sides to the
      opening over its basin (Mau, p. 250), which the vocabulary has no word for, and its covering was tile on the
      common Tuscan atrium. One storey or two: Mau has the houses of pre-Roman Pompeii of one storey, with rooms built
      over those about the atrium in Roman times and a complete second storey rare; the dictionary has the domus usually
      with one storey above the ground floor, and holds that stairs in apparently all the houses of Pompeii show that
      houses of one storey were all but unknown there. A second storey drawn whole is more than most had. The walls are
      rubble laid in mortar (opus incertum), the prevailing masonry of Pompeii, with corners and door-posts of squared
      stone or brick, for which stone is the vocabulary's word; under the Empire many of Rome's substantial buildings
      were of concrete faced with burnt brick (people/traditions/roman-insula), which nothing read says of its houses.
      The walls of the rooms were plastered and painted (Mau, p. 278); their outer face is not described, and no finish
      is written. Rooms facing a busy street were often shops, which the vocabulary has no word for. No size of a house
      is written: they ranged from small houses to whole blocks like the house of the Faun, about 315 by 115 feet (Mau,
      p. 289).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mau-1902-pompeii.txt (sha256 35b30b5906cc32ba) and smith-1890-dictionary-of-antiquities-vol1.txt (sha256 6870cebc90dd52e4), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-24" }
