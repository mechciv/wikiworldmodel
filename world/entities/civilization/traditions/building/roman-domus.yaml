  prevalence:
    prop: prevalence
    value: few
    source:
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 665 a'
        quote: >-
          was a separate house, in later times a palace, usually with only one story above the ground-floor, the abode of
          the rich and great
      - ref: src:smith-1890-dictionary-of-antiquities
        loc: 's.v. "Domus", III. Roman, p. 665 a'
        quote: >-
          The number of insulae at Rome naturally exceeded that of the domus … which was compiled between A.D. 334 and 357,
          that there were at Rome 44,171 insulae and 1782 domus
      - ref: src:platner-ashby-1929
        loc: "s.v. Insula, p. 281"
        quote: Assigning to one-third of the 44,300 … insulae enumerated in Reg. (Brev. gives 46,602)
      - ref: src:platner-ashby-1929
        loc: "s.v. Insula, p. 281"
        quote: adding 500 square metres for each of the 1790 domus
      - ref: src:vitruvius-de-architectura
        loc: "6.5.1 (Gwilt's translation)"
        quote: >-
          Hence, for a person of middling condition in life, magnificent vestibules are not necessary, nor tablina, nor
          atria, because persons of that description are those who seek favours which are granted by the higher ranks.
      - ref: src:vitruvius-de-architectura
        loc: "6.5.2 (Gwilt's translation)"
        quote: >-
          But for nobles, who in bearing honours, and discharging the duties of the magistracy, must have much intercourse
          with the citizens, princely vestibules must be provided, lofty atria, and spacious peristylia
    method: editorial
    note: >-
      A few: in Rome the domus was the house of the rich and great, 1,782 or 1,790 of them in the fourth-century
      catalogue against some 44,000 to 46,600 insulae, and Vitruvius gives the atrium and the peristyle to the houses of
      the higher ranks. In smaller towns the atrium was more widely built: the dictionary describes shopkeepers' houses
      at Pompeii with small atria behind their shops (pp. 679–680), so there the word says too few. The rest of the
      townspeople of the region lived in the insula (people/traditions/roman-insula) or in houses no record yet
      describes.
    checked:
