  dwelling:
    prop: dwelling
    value: { plan: rectangular, width: { lo: 3, hi: 6 }, length: { lo: 10, hi: 15 }, storeys: { lo: 1, hi: 2 }, walls: wattle-and-daub }
    source:
      - ref: src:ohlrau-2020-maidanetske
        loc: section 3.1.2, p. 44
        quote: The burnt remains were generally between 3-6 m wide (median=4.5) and 10-15 m long (median=12.6)
      - ref: src:ohlrau-2020-maidanetske
        loc: section 3.1.3, p. 44
        quote: The burnt architectural remains at Maidanets’ke were made of wood and daub.
      - ref: src:ohlrau-2020-maidanetske
        loc: section 4.3.8, on dwelling 54, p. 93
        quote: >-
          With a median of 2 cm, most rounded imprints are associated with the remains of wattle-and-daub walls.
      - ref: src:ohlrau-2020-maidanetske
        loc: section 9.4.1, p. 283
        quote: >-
          With the help of the wooden imprints, it could be shown in this study that buildings with a platform were indeed
          ‘two-storeyed’ as suggested by many Ukrainian scholars.
      - ref: src:hofmann-2019-governing-tripolye
        loc: section "Comparison with residential buildings"
        quote: >-
          The architecture of mega-structure 3 (covering ca. 190 m2) differs substantially from that of dwellings 44 (77.5
          m2) and 59 (42 m2). While the latter are characterized by massive platforms and indications of two storeys, the
          former is a one-storey construction.
      - ref: src:fuchs-2024-kosenivka
        loc: 'Introduction, section "The Trypillia settlement of Kosenivka"'
        quote: >-
          uncovered a chaotic, rectangular accumulation of burnt daub measuring 12 × 4.5 m, which was designated house 6
    method: excavation
    note: >-
      The width and length are those of the burnt remains of the buildings excavated at Maidanets'ke in central Ukraine
      between 1971 and 1991, with medians of 4.5 and 12.6 m; house 6 of Kosenivka, of 12 by 4.5 m, is of the same size.
      The walls were of wattle and daub on posts. Whether there was an upper floor is an old dispute: at Maidanets'ke the
      houses with a platform of clay laid on split timbers are read as of two storeys, living rooms above a ground
      floor, and the house of Kosenivka, which had no such platform, was assumed by its excavators to be raised or of two
      storeys, which its damage leaves unsure; so one or two. The sizes are of one settlement of the middle Trypillia period and of
      the Ukrainian side: no measure of a Cucuteni house in Romania was read. The roof is not stated, and is left to
      the generator.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in ohlrau-2020-maidanetske.txt (sha256 9d7b262e19cb3624), hofmann-2019-governing-tripolye.txt (sha256 ace77f81b1f55775) and fuchs-2024-kosenivka.txt (sha256 dd1e9941e9f589a8), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  settlement:
    prop: settlement_form
    value: { pattern: nucleated, layout: ring, household: { lo: 3.9, hi: 7 } }
    source:
      - ref: src:fuchs-2024-kosenivka
        loc: 'Introduction, section "Cucuteni–Trypillia phenomena"'
        quote: >-
          In the early phase (Trypillia A1–B1, ca. 4800–4300/4100 BC), the population lived in small and medium-sized
          settlements of less than 30 ha.
      - ref: src:fuchs-2024-kosenivka
        loc: 'Introduction, section "Cucuteni–Trypillia phenomena"'
        quote: >-
          From its middle phase onwards, the unifying attributes are very specific, including settlement layouts of
          several concentric circles, some with monumental assembly houses
      - ref: src:hofmann-2019-governing-tripolye
        loc: Introduction, first paragraph
        quote: >-
          Between ca. 4100–3600 BCE ‘giant-settlements’ or ‘mega-sites’ with thousands of houses arranged in a very
          specific centripetal layout emerged in a concentrated area of the Southern Bug-Dnieper Interfluve in the eastern
          part of the Tripolye distribution area
      - ref: src:ohlrau-2020-maidanetske
        loc: section 7.2, p. 233
        quote: >-
          In result, the size of a nuclear family sharing a household was estimated to lie between 4.5-7 members
      - ref: src:ohlrau-2020-maidanetske
        loc: section 7.2, p. 233
        quote: The average nuclear family size was then reconstructed to lie between 3.9-4.7 members
      - ref: src:fuchs-2024-kosenivka
        loc: section "Archaeological analogies"
        quote: >-
          Based on a commonly used size of a nuclear family, given as 4.5 to 7 people per household (according to Cook
          [162])
    method: expert-estimate
    note: >-
      Houses together in settlements: of less than 30 hectares in the early phase, and from the middle phase laid out in
      concentric rings, which in central Ukraine between about 4100 and 3600 BCE grew to thousands of houses over more
      than a hundred hectares, and grew smaller again after. No number of houses is given for an ordinary settlement,
      and none is claimed. The household spans the two figures the second source reports: Cook's (1972) 4.5 to 7 for a
      nuclear family in one dwelling, which is reckoned from many peoples and which both sources use for these houses,
      and the 3.9 to 4.7 that Diachenko (2016) reconstructed from a cemetery of the latest Trypillia. Neither is a count
      of who lived in a house; the remains of seven people in the burnt house 6 of Kosenivka, six of whom may have died
      there, are probably of one household. The layout is the rings of the second quote, from the middle phase on, as
      the third has the mega-sites' centripetal layout; the settlements of the early phase are not said to have been
      laid out so, and the ring stands for the tradition as a whole. The large ditched enclosure of Maidanets'ke (the
      second source, section 4.3.20) is one site's, and no enclosure is claimed.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fuchs-2024-kosenivka.txt (sha256 dd1e9941e9f589a8), hofmann-2019-governing-tripolye.txt (sha256 ace77f81b1f55775) and ohlrau-2020-maidanetske.txt (sha256 9d7b262e19cb3624), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  outbuildings:
    prop: outbuildings
    value:
      - { use: hall, per: settlement }
    source:
      - ref: src:fuchs-2024-kosenivka
        loc: 'Introduction, section "Cucuteni–Trypillia phenomena"'
        quote: >-
          From its middle phase onwards, the unifying attributes are very specific, including settlement layouts of
          several concentric circles, some with monumental assembly houses
      - ref: src:hofmann-2019-governing-tripolye
        loc: section "Comparison with mega-structures in magnetic plans"
        quote: >-
          In Maidanetske, 82% of the total settlement area has been surveyed by high resolution magnetometry, and thirteen
          mega-structures have been identified
      - ref: src:hofmann-2019-governing-tripolye
        loc: section "Comparison with mega-structures in magnetic plans"
        quote: >-
          In addition to this positioning, the buildings show considerable size differences between 120 and 580 m2 and
          also a certain degree of architectural variability.
      - ref: src:hofmann-2019-governing-tripolye
        loc: section "Identifying different positions of mega-structures in magnetic plans"
        quote: >-
          In the site plans of Tripolye settlements, mega-structures are located not within concentric house rings, but
          within the ring corridor, radial trackways, or at the outskirt of the settlement.
    method: excavation
    note: >-
      The settlement's houses of assembly, the mega-structures: "some" settlements of the middle phase on had them, as
      the first source says, and Maidanetske had thirteen, of 120 to 580 square metres, the one excavated partly roofed
      and others perhaps wholly roofed or unroofed, placed in the corridor between the rings of houses, in the radial
      ways or outside the rings, not among the houses. How many an ordinary settlement had is not counted, and their
      sizes are given as areas, which an outbuilding has no word for; both are left to the generator.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fuchs-2024-kosenivka.txt (sha256 dd1e9941e9f589a8) and hofmann-2019-governing-tripolye.txt (sha256 ace77f81b1f55775), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
