      - ref: src:fuchs-2024-kosenivka
        loc: 'Introduction, section "Cucuteni–Trypillia phenomena"'
        quote: In the late phase (C2, ca. 3600–3300/3000 BCE), the domestic sites became smaller once more
    method: expert-estimate
    note: >-
      About 3000 BCE; the source ends the last phase at 3300 or 3000 BCE. The sizes and storeys of the dwelling claim are
      of a settlement of the middle phase, and the houses of the late phase, in smaller settlements, are less known.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fuchs-2024-kosenivka.txt (sha256 dd1e9941e9f589a8), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
