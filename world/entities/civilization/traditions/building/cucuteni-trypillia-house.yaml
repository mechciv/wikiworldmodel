id: people/traditions/cucuteni-trypillia-house
kind: tradition/building
summary: >-
  The house of the Cucuteni–Trypillia settlements of Romania, Moldova and Ukraine, about 4800 to 3000 BCE: a rectangular
  house of timber and daub, some 3 to 6 m wide and 10 to 15 m long, in many cases with a platform of clay on split
  timbers that its excavators read as an upper floor. From the middle phase the settlements were laid out in concentric
  rings, and between about 4100 and 3600 BCE some in central Ukraine grew to thousands of houses. Most of the houses are
  found burnt. The sizes are those of one such settlement, Maidanets'ke.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: House of the Cucuteni–Trypillia settlements }
    unsourced: An editorial label.
  start:
    prop: start
    value: 4800 BCE
    source:
      ref: src:fuchs-2024-kosenivka
      loc: Introduction, first paragraph
      quote: >-
        Cucuteni-Trypillia societies (CTS) are the earliest Chalcolithic phenomenon in parts of modern-day Romania,
        Moldova, and Ukraine ca. 4800–3000 BCE.
    method: expert-estimate
    note: >-
      About 4800 BCE, the beginning the source gives the Cucuteni–Trypillia societies, which it says followed those with
      Linear and Bug–Dniester pottery (people/traditions/linearbandkeramik-longhouse for the first).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fuchs-2024-kosenivka.txt (sha256 dd1e9941e9f589a8), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
