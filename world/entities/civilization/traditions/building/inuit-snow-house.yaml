id: people/traditions/inuit-snow-house
kind: tradition/building
summary: >-
  The snow house (igdlu) of the Inuit of the central and eastern Arctic: a dome of blocks of snow cut with a snow knife and
  laid in a rising spiral, its joints packed with snow, reached through a passage of smaller vaults and lined inside with
  skins, put up for the winter on the sea ice or the shore, a hut of two families with a lamp each, a few to a score of
  them to a village. Parry found a village of them at Winter Island in 1822; Boas in 1888 has it built every winter by
  all the tribes from Smith Sound to Labrador and from Davis Strait to Victoria Land.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Inuit snow house }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1822 CE
    source:
      - ref: src:parry-1824-second-voyage
        loc: 'ch. VII, Winter Island, February 1822, p. 160'
        quote: >-
          at finding an establishment of five huts, with canoes, sledges, dogs, and above sixty men, women
      - ref: src:parry-1824-second-voyage
        loc: 'ch. VII, Winter Island, February 1822, p. 160'
        quote: >-
          to enter these extraordinary houses, in the construction of which we observed that not a single material was used
          but snow and ice.
    method: documentary
    note: >-
      1822, the earliest account read: Parry's ships, wintering at Winter Island in Foxe Basin, found a village of snow
      houses within sight of them on 1 February 1822. It bounds the start and does not date it; the snow house is surely
      older, and no source read here says how much. No end is given: Boas in 1888 has it built every winter, and no source
      read says when it went out of use as a winter dwelling.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in parry-1824-second-voyage.txt (sha256 b70638d41d56c734), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  extent:
    prop: extent
    value: { from: src:archaeoglobe-2019-regions, names: ["3", "4", "12", "13"] }
    source:
      ref: src:boas-1888-central-eskimo
      loc: 'section "Habitations and dress: The house", p. 539'
      quote: >-
        All the tribes from Smith Sound to Labrador and from Davis Strait to Victoria Land are in the habit of building
        snow houses in winter.
    method: editorial
    note: >-
      Nunavut (4), which holds Baffin Island, Davis Strait's western shore, Hudson Bay's west coast and Iglulik; Greenland
      (13), where the Smith Sound tribe lives, on its north-west coast; Newfoundland and Labrador (12), for Labrador; and
      the Northwest Territories (3), where the western half of Victoria Island lies. Labrador in 1888 may also have meant
      the north of Quebec (10), which is left out. The house is not claimed for the rest of Greenland, nor for Alaska or the
      Mackenzie coast, which the source does not name.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in boas-1888-central-eskimo.txt (sha256 67966135935241e9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  lifeway:
    prop: lifeway
    value: [foragers]
    source:
      ref: src:boas-1888-central-eskimo
      loc: 'section on daily life in winter'
      quote: >-
        In winter the staple food of the Eskimo is boiled seal and walrus meat, though in some parts of the western
        districts it is musk ox and venison
    method: editorial
    note: >-
      Foragers: hunters of the seal and the walrus in winter, of the deer and the salmon in summer, who left the snow
      houses for tents when the snow melted.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in boas-1888-central-eskimo.txt (sha256 67966135935241e9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  dwelling:
    prop: dwelling
    value:
      plan: round
      diameter: { lo: 3.7, hi: 4.6 }
      height: { lo: 3, hi: 3.7 }
      walls: snow
      roof: dome
      roof_material: snow
      entrance: tunnel
      windows: small
      smoke: hole
    source:
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", pp. 539–540'
        quote: >-
          Thus the whole building becomes a tight vault, without any holes through which the warm air inside may escape. Such
          a snow house, about five feet high and seven feet in diameter, is used as a camp in winter journeys. It takes about
          two hours for two skilled men to build and finish it. For winter quarters the vaults are built from ten to twelve
          feet high and twelve to fifteen feet in diameter.
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", the snow house of the Davis Strait tribes (Figs. 491–492)'
        quote: >-
          The entrance to the main building is formed by two, or less frequently by three, small vaults.
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", the snow house of the Davis Strait tribes (Fig. 493)'
        quote: >-
          Directly over the entrance a window is cut through the wall, either square or more frequently forming an arch,
          which is generally covered with the intestines of ground seals
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", the snow house of the Davis Strait tribes (Fig. 493)'
        quote: >-
          Close to the top of the building a small hole (qangirn) is cut through the wall for ventilation. The lamps require
          a good draught, which is secured by this hole.
      - ref: src:parry-1824-second-voyage
        loc: 'ch. VII, Winter Island, February 1822, p. 160'
        quote: After creeping through two low passages, having each its arched door-way
      - ref: src:parry-1824-second-voyage
        loc: 'ch. VII, Winter Island, February 1822, p. 160'
        quote: >-
          a cheerful and sufficient light was admitted to them by a circular window of ice neatly fitted into the roof of
          each apartment.
    method: survey
    note: >-
      The house of winter quarters: 12 to 15 feet across (3.7–4.6 m) and 10 to 12 feet high (3.0–3.7 m), a vault of snow
      blocks that is wall and roof at once (Boas). The smaller snow house of a winter journey, 5 feet high and 7 across, is
      not this one. The entrance is a low passage of two or three small vaults, Boas says of the Davis Strait tribes, and
      Parry crept through two low passages with arched doorways at Winter Island: a tunnel. The window is small: over the
      entrance, of seal gut sewn together with a peephole, sometimes of fresh-water ice (Boas); Parry's were circular
      windows of ice in the roof of each room. Unglazed, it is written small, the nearest word. The smoke is the lamps':
      a small hole cut near the top for the draught, through which the warmed air escapes (Boas). The skin lining of the
      vault, the bench of snow at the back on which the family slept, and Parry's three rooms opening off one domed
      antechamber have no word and are not drawn; the storerooms are the outbuildings claim.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in boas-1888-central-eskimo.txt (sha256 67966135935241e9) and parry-1824-second-voyage.txt (sha256 b70638d41d56c734), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  outbuildings:
    prop: outbuildings
    value:
      - { use: store, per: house, count: { lo: 2, hi: 5 }, walls: snow, roof: dome, roof_material: snow }
      - { use: rack, per: house }
    source:
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", the snow house of the Davis Strait tribes (Fig. 491)'
        quote: >-
          Two very small vaults are always attached to the whole building (Fig. 491). One is situated alongside of the
          uadling and the igdluling, and serves as a storeroom for clothing and harness (sirdloang).
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", the snow house of the Davis Strait tribes (Fig. 491)'
        quote: >-
          On the left side of the entrance of the main building is another small vault (igdluarn), which is accessible from
          the main building. It serves for keeping spare meat and blubber. Frequently there is a second igdluarn on the
          opposite side, and sometimes even a third one in the igdluling. Another appendix of the main building is
          frequently used, the audlitiving
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", on the storehouses (ikan, Fig. 503)'
        quote: >-
          Sometimes two pillars, about ten feet apart, are found near the huts. In winter the kayak is placed upon them in
          order to prevent it from being covered by snowdrifts or from being torn and destroyed by the dogs. In snow
          villages these pillars are made of snow.
    method: survey
    note: >-
      Boas, of the Davis Strait tribes. The storerooms are small vaults of snow built against the house, two always (one
      for clothing and harness beside the entrance passage, one for spare meat and blubber beside the door of the main
      room), with a second and sometimes a third meat store and often a vault at the back for meat, so two to five to a
      house; their size is "very small" and not given. The rack is the pair of pillars, of snow in a snow village, found
      near the huts to keep the kayak from the drifts and the dogs; "sometimes", so not every house had one, and its
      height in a snow village is not given. The tall stone pillars on which meat and blubber were kept, at Ukiadliving,
      stood by stone houses and are not written here.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in boas-1888-central-eskimo.txt (sha256 67966135935241e9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  settlement:
    prop: settlement_form
    value: { pattern: camp, houses: { lo: 5, hi: 21 } }
    source:
      - ref: src:parry-1824-second-voyage
        loc: 'ch. VII, Winter Island, February 1822, p. 160'
        quote: >-
          at finding an establishment of five huts, with canoes, sledges, dogs, and above sixty men, women
      - ref: src:parry-1824-second-voyage
        loc: 'ch. XIV, April 1823, p. 423'
        quote: consisting of five snow-huts built upon the ice ; the people, who were twenty-eight in number
      - ref: src:boas-1888-central-eskimo
        loc: 'section "Habitations and dress: The house", pp. 543–546'
        quote: >-
          These huts are always occupied by two families, each woman having her own lamp and sitting on the ledge in front
          of it
      - ref: src:boas-1888-central-eskimo
        loc: 'section on the Netchillirmiut, citing Ross p. 389'
        quote: >-
          as 21 snow houses were found which had been inhabited by them during the winter (p. 389). The number of
          inhabitants of this village was about one hundred and seventy
      - ref: src:boas-1888-central-eskimo
        loc: 'section on the Netchillirmiut, citing M''Clintock p. 257'
        quote: On the 4th of May, twenty deserted snow huts were found on the southwest point of Matty Island (p. 257).
    method: survey
    note: >-
      Winter villages put up on the snow or the sea ice and left in spring: Parry's two of 1822 and 1823 had five snow
      houses each, with above sixty and with twenty-eight people; the two Boas counts from Ross and M'Clintock had 21 and
      20, the first with about 170 people. A house held two families, Boas says. The people in one house are not given as a
      number, and the villages' counts are not divided here into one: the generator's choice stands in.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in parry-1824-second-voyage.txt (sha256 b70638d41d56c734) and boas-1888-central-eskimo.txt (sha256 67966135935241e9), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
