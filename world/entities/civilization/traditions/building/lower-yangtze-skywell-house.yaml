      - ref: src:li-2022-hongcun-dwellings
        loc: section 3, "Materials"
        quote: >-
          two-floor or three-floor brick and wood buildings are constructed rather than the single-level courtyard
          houses more commonly seen elsewhere
      - ref: src:pan-2023-southern-anhui-folk-houses
        loc: section 2.2, "Research Subjects"
        quote: >-
          The dwellings face north and south, with an axisymmetric layout, 9 m in width and 23.3 m in depth. There are
          two patios of different scales in the dwelling
      - ref: src:li-2022-hongcun-dwellings
        loc: section 3, "Materials"
        quote: The lime is often used in wall plastering, creating a white wall, which is an important element of traditional dwellings in Hongcun
      - ref: src:min-zhang-2026-yangtze-delta-dwellings
        loc: section "Methods", "Field survey"
        quote: >-
          with inclusion criteria requiring structural integrity, clearly defined spatial layouts, intact key spatial
          elements such as sky-wells and eaves corridors
    method: survey
    note: >-
      The plan round a sky-well, the brick outer walls on a timber frame that bears the load and the tiled roof are
      from the surveys of the delta, of 264 houses in and around Jiangnan and of Hongcun. A gable roof is read from
      Hongcun's stepped gable walls; no source names the roof's shape. The storeys join the delta's sky-wells, one or
      two storeys high, with Hongcun's houses of two or three floors, built so where level ground is scarce. The
      width and length are those of one house, Yao's House at Xixinan in southern Anhui, of two courts and of a
      layout its source calls typical: the only measures of a whole house read, and no range. The houses run from one
      court to nine on an axis, and Hongcun's outer walls stand 7 to 8 m high; the delta's sky-wells are 6 to 13 m
      wide and 3 to 7 m deep, for which a dwelling has no parameter. The walls were plastered with lime, white (Hongcun;
      the delta's "white-lime walls"). The eaves corridor along the sky-well was one of the key spaces of the house in
      the delta survey, which chose its houses for having one: the vocabulary's veranda. The walls towards the
      sky-well had full-height windows in the delta survey's words, and the outer walls' windows are not described,
      so windows are left out; so is the direction the houses faced, as Yao's House "faces north and south".
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in min-zhang-2026-yangtze-delta-dwellings.txt (sha256 7b37735a8ee5003f), wang-2016-jiangnan-closed-halls.txt (sha256 0cb32369883a0166), li-2022-hongcun-dwellings.txt (sha256 f71f8fa6ecff9248) and pan-2023-southern-anhui-folk-houses.txt (sha256 7c9abdde92013f4d), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
