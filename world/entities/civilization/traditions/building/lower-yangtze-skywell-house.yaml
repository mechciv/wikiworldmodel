        quote: 71 in central and southern Zhejiang, 37 in southeastern Anhui, 19 in eastern Jiangxi
      - ref: src:min-zhang-2026-yangtze-delta-dwellings
        loc: section "Study area", "Data source"
        quote: >-
          the Yangtze River Delta encompasses parts of Jiangsu, Zhejiang, and Anhui Provinces, as well as the entire
