id: people/traditions/lower-yangtze-skywell-house
kind: tradition/building
summary: >-
  The house of the villages and towns of the lower Yangtze under the Ming and the Qing: halls and rooms set on a
  central axis around small open courts called sky-wells, a timber frame carrying a grey-tiled roof, and high outer
  walls of brick that carry no load, lime-washed white. It is read from houses still standing in southern Jiangsu,
  Zhejiang, southern Anhui and eastern Jiangxi, the oldest of them of the Ming; how much older the form is, the works
  read do not say. In the water towns of the delta the houses stand along canals and lanes.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Sky-well courtyard house of the lower Yangtze }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1368 CE
    source:
      - ref: src:pan-2023-southern-anhui-folk-houses
        loc: section 2.2, "Research Subjects"
        quote: the village now has more than 10 well-preserved Ming Dynasty buildings and more than 100 Qing Dynasty dwellings
      - ref: src:li-2022-hongcun-dwellings
        loc: section 2, "Research significance and methods"
        quote: there are still 110 traditional dwellings dating to the Ming and Qing Dynasties
      - ref: src:zhou-2002-one-bright-two-dark
        loc: "p. 171, section 1"
        quote: the standard plan in Ming(1368-1644) and Qing dynasty(1644-1912)
    method: expert-estimate
    note: >-
      The first year of the Ming dynasty, as the third source gives its years. The dynasty stands for the time the
      evidence belongs to: the oldest houses the works read count as standing, at Xixinan and Hongcun in southern
      Anhui, are of the Ming, and none says in which of its years they were built. It bounds the start rather than
      dating it, for nothing read says how the house was built before.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in pan-2023-southern-anhui-folk-houses.txt (sha256 7c9abdde92013f4d), li-2022-hongcun-dwellings.txt (sha256 f71f8fa6ecff9248) and zhou-2002-one-bright-two-dark.txt (sha256 ab926c4c48d1e397), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  end:
    prop: end
    value: 1949 CE
    source:
      ref: src:wang-2016-jiangnan-closed-halls
      loc: "p. 140, section 3.2"
      quote: The chosen dwellings were mainly constructed during the Qing Dynasty and the Republican Period (before 1949).
    method: expert-estimate
    note: >-
      The bound the survey of 264 houses sets on its own cases, taken here as the end of building in this way; it is
      not a date any source gives for the last such house, and the houses are lived in still.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wang-2016-jiangnan-closed-halls.txt (sha256 0cb32369883a0166), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
