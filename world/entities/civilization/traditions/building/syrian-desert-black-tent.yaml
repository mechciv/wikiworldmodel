  dwelling:
    prop: dwelling
    value:
      plan: rectangular
      length: { lo: 7.6, hi: 9.1 }
      width: 3
      wall_height: 1.5
      height: 2.1
      walls: cloth
      roof: tent
      roof_material: cloth
      floor: ground
      rooms: 2
      entrance: side
    source:
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", p. 37'
        quote: >-
          The covering of a tent, zkaker el beit, consists of pieces of stuff made of black goat's-hair, about three quarters
          of a yard in breadth, its length being equal to that of the tent
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", p. 37'
        quote: >-
          It is usual to have nine poles or posts, three in the middle and an equal number on each side of the tent
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", p. 42'
        quote: >-
          The height of the makdoum and wasat is about seven feet ; that of the other posts about five feet. The tent, if it
          have two wasat, is between twenty-five and thirty feet
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", p. 42'
        quote: The Aeneze tents are always of black goat's-hair.
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", pp. 39-40'
        quote: >-
          The tent is divided into two parte ; the men's apartment (mekaad rabiaa), and the women's {meharrem) ; the men's on
          the left … of one , entering the tent, the women's oh the right
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", pp. 38-39'
        quote: The back part of the tent is closed by the rowdky
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "The tent, and its different parts", p. 42'
        quote: >-
          In summer, the three front posts are sometimes not employed, and the tent is supported only by the middle and hind
          poles, being wide open in front.
    method: survey
    note: >-
      Burckhardt gives the sizes in feet: the middle posts about 7 ft (2.1 m), the side posts about 5 ft (1.5 m), here the
      height of the eaves; a tent with two middle posts 25 to 30 ft long (7.6 to 9.1 m), and its depth, with all the poles
      up, "at most ten feet" (3.0 m), so the width given is the most, not the usual. Smaller tents had one middle post and
      a sheikh's four or five. The cloth is woven goat's hair, the cover and the hanging back wall alike, so walls and roof
      are cloth; the roof is a tent on poles. The ground is the floor, covered with carpets in the men's part. Two rooms,
      the men's and the women's, divided by a carpet drawn across the tent at the middle posts, the men's on the left of
      one entering and the women's on the right, though Burckhardt saw it the other way among the Arabs of the Hauran
      (pp. 39-40). The entrance is in a long side: the back was closed by a hanging wall, the front stood open in summer,
      and the tent was 25 to 30 ft long and at most 10 ft deep from front to back, so the front is a long side; that
      reading of the sizes is the writer's (OCR in the quote: "parte" for parts, "oh" for on). Which way the tents faced is
      not said: the sheikh's stood on the camp's west side, as guests and enemies came from the west (p. 33).
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in burckhardt-1831-notes-on-the-bedouins.txt (sha256 d485a71826c744ed), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  settlement:
    prop: settlement_form
    value: { pattern: camp, houses: { lo: 10, hi: 800 } }
    source:
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Mode of encamping", p. 33'
        quote: >-
          The encampments vary in number of tents, from ten to eight hundred : when the tents are but few, they are pitched
          in a circle
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Mode of encamping", p. 33'
        quote: >-
          The whole tribe then spreads itself over the plain in parties of three or four tents each
    method: survey
    note: >-
      Camps of ten to eight hundred tents, in a circle when few and in rows along a stream when many; in winter a tribe
      spread out in parties of three or four tents. The layout is left out, as it was a ring or rows by the camp's size.
      One family to a tent: Burckhardt says the richest man has but one, unless a second wife or a kinsman's family
      needs another. How many people lived in a tent is not stated.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in burckhardt-1831-notes-on-the-bedouins.txt (sha256 d485a71826c744ed), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
