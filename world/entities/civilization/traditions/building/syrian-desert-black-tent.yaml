id: people/traditions/syrian-desert-black-tent
kind: tradition/building
summary: >-
  The black tent of the Bedouin of the Syrian desert and northern Arabia: a long, low tent of strips of black goat's-hair
  cloth stitched together and stretched on rows of poles and ropes, its back closed by a hanging wall of the same cloth and
  its inside parted by a curtain into the men's side and the women's. The 'Aneze and the other tribes pitched their tents in
  circles or rows and moved them with their herds between the desert and the edge of the sown. Its earliest description read
  here is Burckhardt's, of 1810 to 1816; it is surely older, and no earlier source was read.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Black goat's-hair tent of the Syrian desert }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1810 CE
    source:
      ref: src:burckhardt-1831-notes-on-the-bedouins
      loc: 'vol. 1, chapter "Classification of Bedouin tribes", on the Hdib, pp. 14-17'
      quote: I found them encamped, with their cattle in September 1810, on the Ardh Lahlouh
    method: documentary
    note: >-
      The year of the earliest account read: Burckhardt lived among the Arabs of the Syrian desert from 1810 and dates his
      stays in their camps from then. It bounds the start and does not date it; the tent is surely older. No end is given:
      no source read says when it went out of use.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in burckhardt-1831-notes-on-the-bedouins.txt (sha256 d485a71826c744ed), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  extent:
    prop: extent
    value: { from: src:archaeoglobe-2019-regions, names: ["58", "59", "63"] }
    source:
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Classification of Bedouin tribes", pp. 1-2'
        quote: >-
          The Aenezes are the most powerful Arab … nation in the vicinity of Syria, and, if we add to them their brethren in
          Nedjd, may be reckoned one of the most considerable bodies of Bedouins in the Arabian deserts.
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Classification of Bedouin tribes", p. 2'
        quote: have likewise been known to pass the Euphrates and encamp in Irak Arabi, and near Baghdad.
    method: editorial
    note: >-
      The Syrian desert and the edge of the sown in Syria (58), where the 'Aneze summered and Burckhardt saw their tents;
      Najd (63), where their brethren lived, whom he knew by report; and Iraq (59), where they sometimes camped. The tents
      he describes are of the 'Aneze and the tribes of the north; he says other tribes' differ in the number of poles.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in burckhardt-1831-notes-on-the-bedouins.txt (sha256 d485a71826c744ed), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  lifeway:
    prop: lifeway
    value: [herders]
    source:
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Mode of encamping", p. 33'
        quote: >-
          The Aenezes are nomades in the strictest acceptation of the word, for they continue during the whole year in
          almost constant motion.
      - ref: src:burckhardt-1831-notes-on-the-bedouins
        loc: 'vol. 1, chapter "Mode of encamping", p. 33'
        quote: >-
          as soon as their cattle have consumed the herbage near a watering-place, the tribe removes in search of pasture
    method: editorial
    note: >-
      Herders who moved their tents with their camels, sheep and goats. Burckhardt also has tribes who camped the year
      round among the villages of Syria, some of whom tilled; their tents are not described apart, and farmers are not named.
    checked:
