    value: { plan: semicircular, diameter: { lo: 2, hi: 3 }, walls: stone, roof_material: bark, floor: ground }
    source:
      - ref: src:fink-1987-lake-condah-stone-shelters
        loc: p. 6
        quote: >-
          The houses are semi-circular dry-stone walled structures about two to three metres in diameter and have only
          been recorded in Western Victoria from areas of lava flow, known as the Stoney Rises.
      - ref: src:fink-1987-lake-condah-stone-shelters
        loc: p. 6
        quote: >-
          Only a few descriptions of the stone houses have been found in historical records, but it appears that the walls
          originally supported a sapling and bark roof.
      - ref: src:mcniven-2017-kurtonitj-stone-house
        loc: abstract
        quote: >-
          Fine-grained excavation of KSH-1 within the Budj Bim (stony rises) cultural landscape revealed house construction
          directly on to lava bedrock.
    method: survey
    note: >-
      The walls, their size and the roof from the survey report; the floor on the bare rock from the excavation. The
      plan was first written "round", the nearest word then; it is now "semicircular", the word since added for a half
      circle open along one side, which is what the report's "semi-circular dry-stone walled structures" says: a
      refinement of the same reading, not a new one. The roof's shape is not given, nor is which way the open side
      faced, nor any building beside the houses.
