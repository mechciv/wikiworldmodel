id: people/traditions/stony-rises-stone-house
kind: tradition/building
summary: >-
  The stone house of the Gunditjmara in the Stony Rises of western Victoria: a small horseshoe of dry-stone walling, two to
  three metres across, built straight onto the lava and roofed with saplings and bark, found by the hundred near the
  hollows of the lava that hold water around Lake Condah. The only one excavated and dated was lived in about 1840 to
  1870, on the pastoral frontier; whether such houses stood before European contact, and whether they made villages, is
  still argued, so the span here is the dated house's alone.
author: machine:claude-code
claims:
  name:
    prop: name
    value: { en: Stone house of the Stony Rises }
    unsourced: An editorial label.
  start:
    prop: start
    value: 1840 CE
    source:
      ref: src:mcniven-2017-kurtonitj-stone-house
      loc: abstract
      quote: >-
        Dating of metal objects to c.1840–1870 points to occupation during the period of violent resistance to European
        pastoral invasion in the 1840s and/or during the subsequent period of negotiated resistance while living and working
        on pastoral properties during the 1850s and 1860s.
    method: excavation
    note: >-
      About 1840, the earliest date the metal objects give for the one excavated house, KSH-1 at Kurtonitj. It is not the
      start of building in stone: the paper sets dating stone houses unambiguously before European contact as a task for
      future excavation, so older ones may stand undated.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mcniven-2017-kurtonitj-stone-house.txt (sha256 ede6b0ca60c529ca), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  end:
    prop: end
    value: 1870 CE
    source:
      ref: src:mcniven-2017-kurtonitj-stone-house
      loc: abstract
      quote: >-
        Dating of metal objects to c.1840–1870 points to occupation during the period of violent resistance to European
        pastoral invasion in the 1840s and/or during the subsequent period of negotiated resistance while living and working
        on pastoral properties during the 1850s and 1860s.
    method: excavation
    note: About 1870, the latest date for the excavated house. When the last of these houses was lived in, the sources do not say.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mcniven-2017-kurtonitj-stone-house.txt (sha256 ede6b0ca60c529ca), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  extent:
    prop: extent
    value: { from: src:archaeoglobe-2019-regions, names: ["141"] }
    source:
      ref: src:fink-1987-lake-condah-stone-shelters
      loc: p. 6
      quote: >-
        The houses are semi-circular dry-stone walled structures about two to three metres in diameter and have only been
        recorded in Western Victoria from areas of lava flow, known as the Stoney Rises.
    method: editorial
    note: >-
      Region 141 (Victoria and Tasmania). The houses are known only from the lava flows of western Victoria, a small part of
      the region; it is not claimed for the rest of it, nor for Tasmania.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in fink-1987-lake-condah-stone-shelters.txt (sha256 29ed20fcf0b4f5f1), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  lifeway:
    prop: lifeway
    value: [foragers]
    source:
      - ref: src:mcniven-2017-kurtonitj-stone-house
        loc: abstract
        quote: >-
          Key challenges for future excavations are documenting stone houses dating unambiguously to before European
          contact and determining how their history of use integrates with the development of eel trapping facilities over
          the past 6600 years.
      - ref: src:fink-1987-lake-condah-stone-shelters
        loc: p. 6
        quote: >-
          The majority of newly recorded sites were found in close proximity to previously known house sites and, with few
          exceptions, were close to volcanic depressions. Many of these depressions contain water, aquatic plants and
          probably eels
    method: editorial
    note: >-
      The houses stand by the hollows that held water and eels, and the excavators tie their use to the eel traps of the
      same country: Aboriginal people who lived by trapping eels are foragers, however settled. Neither source says so in
      as many words. The one dated house was lived in during the resistance to the pastoral invasion of the 1840s, or in
      the two decades after, when its people lived and worked on pastoral properties.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in mcniven-2017-kurtonitj-stone-house.txt (sha256 ede6b0ca60c529ca) and fink-1987-lake-condah-stone-shelters.txt (sha256 29ed20fcf0b4f5f1), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
  dwelling:
