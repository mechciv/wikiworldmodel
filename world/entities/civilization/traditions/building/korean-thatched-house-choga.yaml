    method: expert-estimate
    note: >-
      Each house's yard was walled: a low earth wall (todam) round the residence, of dry stone (chukdam) on Jeju. Its
      height is not given beyond "low". The article says the walls enclosed several smaller buildings, more for the
      richer, but does not say what they were for, so no outbuildings are written; how the houses stood together in a
      village is not given either.
