          stands on a platform to support its roof.
      - ref: src:wikipedia-choga-architecture
        loc: section "Characteristics", "Ondol heating system"
        quote: >-
          Residents of choga commonly used a heatable brick bed made of mud and stone as a heating method called Ondol
      - ref: src:wikipedia-choga-architecture
        loc: section "Characteristics", "Ondol heating system"
        quote: >-
          The heating system includes a 20–30 cm high firebox and stove and flues built in underfloor to convey the heat
          to the chimney.
    method: expert-estimate
    note: >-
      Walls of wattle and daub, the earlier way, which rammed earth joined over a time the article does not date; a
      narrower record of the later house should give rammed earth. A roof of rice straw. The plan is left out: the
      layouts were L-shaped around Seoul, in two rows of rooms in the centre and in a straight line in the west, and
      one region cannot tell them apart. The floor is "raised" for the platform the timber frame stood on, which the
      article states for the choga generally; how high it was is not given. The heated floor (ondol) has no word of
      its own; its flues led the smoke of the firebox to a chimney, which is "chimney". The article says choga
      residents commonly used it, and also that some sources say heat from the kitchen alone was more usual; the
      ondol spread through the sixteenth and seventeenth centuries and was widely used in thatched houses only in the
      late Joseon, so the chimney is the later house's more than the earlier's. No size is given by any source read
      here, nor are the windows or the door.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in wikipedia-choga-architecture.txt (sha256 cbbec5f071f39d24) and wikipedia-ondol.txt (sha256 b3e9bd80168fb51f), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
