        loc: "chap. on manners and customs, p. 177"
        quote: >-
          The roof of the house protrudes or overhangs the front verandah, which is enclosed on three sides
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 178"
        quote: with only one entrance to their houses
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 178"
