    method: documentary
    note: >-
      The house of the Haka, which the source describes for all as built on the same principles and varying in size and
      quality with the owner's wealth. Twenty feet high is 6.1 m, 30 feet broad 9.1 m, and 50 to 200 feet long 15 to 61 m.
      It stood on the hillside some three feet off the ground uphill and fifteen or twenty downhill, on posts, over the
      pen. The shape of the roof is not given. The walls, first written as timber, are now plank, the vocabulary's
      narrower word for the source's "built of plank"; a refinement, not a disagreement. The floor's height is the one
      house's from the uphill side to the downhill, some 3 feet to 15 or 20, 0.9 to 6.1 m. No windows and no chimney,
      the smoke escaping as it could. The veranda is the front verandah, enclosed on three sides under the overhanging
      roof, with a back verandah at the other end. The entrance is in an end: the house ran from the front verandah
      through the front room, the back room and the closet to the back verandah, the length of a house 50 to 200 feet
      long and some 30 broad, so the front was one of its short sides; that is read from the order of the rooms, as the
      source does not name the side. The northern Chins said their houses had only one entrance. The pigs and the
      cattle were penned under the floor, written as animals under the same roof.
    checked:
