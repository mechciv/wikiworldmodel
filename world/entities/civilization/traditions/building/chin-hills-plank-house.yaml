  settlement:
    prop: settlement_form
    value: { pattern: compound, enclosure: fence, yard: fence, household: 5 }
    source:
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 175"
        quote: >-
          Each platform is surrounded with a timber fence or a cactus hedge and often with both.
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 175"
        quote: trenches outside the village fence.
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 176"
        quote: >-
          Besides the gates, cactus and stiff thorn hedges, palisades, stone breastworks and rifle-pits surround and
          defend the village.
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "chap. on manners and customs, p. 175"
        quote: >-
          When the site is chosen, the village is marked off in compounds, and each household constructs its own
          platforms, builds its own house, and plants its own hedges or in lieu builds a fence.
      - ref: src:carey-tuck-1896-chin-hills-vol-1
        loc: "introduction, p. 4"
        quote: >-
          it is probable that the Chin household will not average more than five persons in any part of the hills.
    method: documentary
    note: >-
      Each household's house in its own compound, fenced or hedged, on a platform cut into the hillside. The household of
      five is the source's upper bound on the average, from enquiries and not a census; it multiplied the houses by five to
      estimate the people. Each compound's yard was fenced: its platform had a timber fence or a cactus hedge round it,
      often both, which is written as a fence. The village too was fenced: rifle trenches were dug outside the village
      fence, and the village was defended by hedges of cactus and thorn, palisades and stone breastworks besides its
      narrow gates, which the one word cannot all hold; the source says some villages once fortified on peaks had since
      moved down by the streams and were not fortified. The large wooden trough fed by wooden leads, which stood in
      every compound, has no word among the outbuildings and is not written.
    checked:
      - { step: quoted, by: machine:quote-check, how: "Found in carey-tuck-1896-chin-hills-vol-1.txt (sha256 550f7d4928681337), after normalizing whitespace and typography, by npm run world -- quote-check.", on: "2026-11-21" }
