    method: documentary
    note: >-
      Farmers of fixed villages, whose hillside fields were partly terraced with logs and stones. The source sets apart a
      few Thado who cleared fresh land every year and moved their villages, and who lived in bamboo huts, not in these
      houses. It also has the land enriched by burning, on old ground and on ground cleared for the first time, so some
      fields were new clearings; how long a field was kept is not said. The model calls the region's cultivators shifting
      cultivators, for whom this house stands in.
