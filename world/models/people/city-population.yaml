# A model run here (section 4.10 of the design). It makes no field: what it derives is each settlement's people
# through time, on each ground its figures count, which the settlement generator lays its town out from
# (docs/plans/MODELS.md, the pilot; docs/plans/CITIES.md, The models).
id: model:people/city-population
type: model
title: A settlement's people through time, from every figure of them
description: >-
  Reads every figure the world has of a settlement — historical lists (Chandler and Modelski, as Reba, Reitsma and Seto
  placed them), modern urban-centre anchors (GHSL UCDB R2019A and Natural Earth 1:10m fallback, matched strictly by name
  and proximity), and its own record's claims — as observations of what each counts, and conditions on them all together.
  The log of the settlement's people follows a random walk with local regional demographic drift driven by HYDE 3.2.1
  (Δx ~ γ Δ log(H(t) + H₀)), so that across multi-century gaps the trajectory follows regional demographic booms and
  collapses while uncertainty grows with time from the nearest figure. Between observed figures, absence from global
  historical benchmark columns (e.g. Chandler's multi-country census years) acts as a soft left-censored observation via
  Laplace approximation, gently pulling an unlisted gap below the benchmark's inclusion cutoff without fabricating sharp
  cliffs or leaking into held-out observations. A figure of the settlement's people observes their mean over the years it
  is for, and says the people were there from the start of those years; one that gives no years observes the whole of the
  settlement's life, weakly, and is never a point at its founding. A figure of its core observes a part of its people, a
  count of its houses its people over a household, and its ground its people over the density they lived at, whose prior
  is model:people/density's. A figure of its region observes the settlement's people and the land's about it together,
  over a prior of the settlement's and HYDE's in the region's ground; the bounds of a site today observe none of its
  people. Each source's figures for a settlement share a bias, a factor by which they may all be high or low (with modern
  lists' mean offset and scatter calibrated empirically at build from 1975 overlap with Chandler). A preferred figure
  passes over its rivals: the record's other figures for the same ground at about the same time, a count of houses then,
  and a list's figure within 25 years of it. For settlements without an explicit record span, a two-state continuous-time
  occupancy Markov chain (standing vs abandoned) combines observed figures, missed global benchmarks, and presence or
  absence in the modern survey (2015) to infer occupancy probability P(Z(t) = 1), bridging living historical gaps while
  letting unanchored ruins lapse after their last evidence.
author: machine:claude-code
code: core/citypop.ts
inputs:
  - { ref: field:people/cities-ancient, note: "Modelski's figures, by city and year, and their global benchmark cutoffs" }
  - { ref: field:people/cities, note: "Chandler's figures, by city and year, and their global benchmark cutoffs" }
  - { ref: field:people/cities-modern, note: "GHSL UCDB R2019A modern urban centres (1975–2015) and Natural Earth 1:10m fallback for surviving smaller towns" }
  - { prop: population, kind: settlement, note: "a settlement's own figures, each with the ground it counts and the years it is for" }
  - { prop: houses, kind: settlement, note: "its houses, where a record counts them" }
  - { prop: settlement_area, kind: settlement, note: "its ground, and its region's, which its people are read over" }
  - { prop: start, kind: settlement, note: "when it was founded" }
  - { prop: end, kind: settlement, note: "when it was left" }
  - { ref: model:people/density, note: "the prior of how densely it lived, from the settlements near it" }
  - { ref: field:earth/population, note: "HYDE's people within a region's ground, and a 3°×3° smoothed local series for regional demographic drift" }
derives: >-
  Each settlement's people through time, as the central reading and the band's edges, from its founding to its end; its
  occupancy probability P(Z(t) = 1) where continuity is modeled; its density scale; and, where its record gives a region,
  the region's people. Each figure's fit, and its prediction from all the others, for the panel and the scores.
params:
  walk:
    choice: >-
      0.004 a year: the variance of the log of the people's random walk, so that a century from the nearest figure the
      people may be about twice or half as many. The build fits it again to the historical lists' figures held out one at
      a time (tools/world/src/holdout.ts), and writes what it fitted in the cities file.
  bias:
    choice: >-
      0.286 for a list's figures and for a work's, where the build has fitted none: the spread of the log of the factor by
      which one source's figures for a settlement may all be high or low. A work's figures of the settlement and its core
      share one bias whatever they count, its people, its ground and its houses: a work that drew a city's ground wide
      counted its people over it, so that how densely they lived is what it says most surely. Its figures of the region
      have a bias of their own. At a list's figure 0.286 makes the band 1.6 times higher and lower, the band this model
      drew before it read figures as observations. The build fits a historical list's to the historical lists' figures
      held out one at a time, calibrates a modern list's mean offset and scatter from 1975 overlap with historical lists,
      and fits a work's to the records' figures held out with their record's, writing what it fitted in the cities file.
  drift:
    choice: >-
      0.5 by default: weight in [0, 1] on local 3°×3° Gaussian-smoothed HYDE regional demographic drift
      Δ log(H(t) + driftFloor) between observations. The build fits it over [0, 0.25, 0.5, 0.75, 1] by leave-one-out log
      predictive density on historical lists (tools/world/src/holdout.ts) and writes what it fitted in the cities file.
  drift_floor:
    choice: >-
      1,000 people: additive floor in log(H(t) + driftFloor) so sparsely populated ancient regions stay well-behaved
      without extreme log jumps near zero.
  censor:
    choice: >-
      Soft left-censoring on missed global benchmark columns strictly between observed figures (tau = 0.5 log-width,
      rho = 0.45 inclusion probability for Laplace population conditioning, occRho = 0.7 for occupancy inference).
      Censoring is suppressed within 25 years of any observation (including held-out ones) to prevent holdout leakage.
  occupancy:
    choice: >-
      Two-state continuous-time Markov chain (abandon = 0.0008/yr, found = 0.00002/yr, modernCutoff = 15,000 people,
      modernCoverage = 0.95 at 2015, standing threshold = 0.5) inferring P(Z(t) = 1) for unrecorded settlements from
      observations, missed global benchmarks, and modern survey presence or absence.
  point:
    choice: >-
      0.05 on the log, about 5%: one figure's own error besides its source's bias, where the figure gives no range, so
      that two lists whose figures for the same two years disagree in their trend, as Chandler's and Modelski's for
      Chang'an in 800 and 900, are both read. A settlement whose figures read are all one source's has none: its error
      is all its source's bias, and it is drawn through its figures exactly.
  core:
    choice: >-
      A settlement 1.25 times its core, in people and in ground, with a spread of 0.35 on the log. No work gives it; the
      civic-ceremonial centres of Greater Angkor and its 12th-century city are about the same size (Klassen et al.
      2021, Table 1, and Chandler's figure), which a larger ratio would not fit.
  household:
    choice: Five people to a house, with a spread of 0.25 on the log, as the settlement generator's own household.
  density:
    follows: model:people/density
  hyde:
    choice: >-
      0.34 on the log: HYDE's people within a region may be 1.75 times higher or lower, at the edges of a 90% band, as
      HYDE's authors give for their numbers at 1 CE (field:earth/population's range).
  founding:
    choice: >-
      A thousand people: how many a settlement had when it was founded and when it was left, where no figure says. It
      only shapes the years before a settlement's first figure and after its last; no work gives it.
  near:
    choice: Twenty-five years, within which a record's preferred figure passes over a list's.
  rivals:
    choice: >-
      Fifty years: two figures for moments this close are rivals, and two for spans are where their years, widened by
      25 either way, overlap by half the shorter.
  hold:
    choice: Fifty years either side of a record's figure, for a settlement whose record gives no start or end.
  band:
    choice: The band's edges are 1.645 standard deviations either side of the central reading, so that 90% lies within.
uncertainty:
  kind: ensemble
  note: >-
    Member 0 is the central reading; members 1 and 2 are the band's higher and lower edges, at each figure's time and
    between, as the model's posterior gives them. The spread comes from the figures' own ranges, their sources' biases,
    left-censoring on missed benchmarks, and the years between them.
checks:
  - { test: core/citypop.test.ts, holds: "reads a list between its figures at a constant rate, and stands only while the list holds it" }
  - { test: core/citypop.test.ts, holds: "passes over a list's figure near a record's preferred one, and reads it elsewhere" }
  - { test: core/citypop.test.ts, holds: "reads a figure that gives no time over the whole span, never as a point at the founding" }
  - { test: core/citypop.test.ts, holds: "stands a figure's people from the start of its years, and ramps from a founding size only before them" }
  - { test: core/citypop.test.ts, holds: "takes a core's figure for a part of the settlement, and a region's for the land about it besides" }
  - { test: core/citypop.test.ts, holds: "passes over a count of houses where a preferred figure gives the people, and reads it where none does" }
  - { test: core/citypop.test.ts, holds: "scores a figure held out by how well the others predict it" }
  - { test: core/citypop.test.ts, holds: "curves a gap between observations with local HYDE regional demographic drift" }
  - { test: core/citypop.test.ts, holds: "applies Laplace left-censoring on missed interior benchmarks without leaking held-out observations" }
  - { test: core/citypop.test.ts, holds: "bridges living cities across long list silences while letting unanchored ruins lapse via occupancy HMM" }
