# The anonymous human landscape: the houses, settlements, fields and pastures of a scene. Nobody recorded any of them:
# how many follows HYDE's people through the anthromes, and the lists of cities and the world's records of settlements;
# what way of life, the anthromes and the archaeologists of the region; what the houses were like, the building tradition
# the world records there and then for that way of life, or a generic house for the way of life and the climate, which
# says so. A house is drawn from every part its tradition's claims state, its door, its windows, its smoke, its finish,
# in one of several shapes within the ranges they give; it stands in its yard, with what its tradition says enclosed
# the yard and stood in it; houses stand in a ring or in rows and face one way where their tradition says so, within
# what it says enclosed them; and a settlement has the hall, the shrine, the well or the pen its tradition names. A town
# has streets and a wall as the tradition of its townspeople or its own record says; the animals people kept are those
# a husbandry tradition names; people, boats and paths rest on no record. Close by, a house has the relief its claims
# support, its walls as thick as their kind where a door or a window is cut through them; and a field under a crop has
# the crop standing on it in rows, one plain stand that names no crop. Where in its 5′ cell a settlement stands is
# weighed by the water, the ground and an invented soil, and its fields grow from its houses over the land nearest it:
# nobody recorded either. Everything it makes is marked as generated.
id: gen:people/settlement
type: generator
title: Houses, villages and fields of any place since 10,000 BCE
version: 10
code: generators/people/settlement/v10.ts
runs_in: [build, client]
outputs: { basis: procedural }
inputs:
  - { ref: field:people/anthromes, note: "where people were, how many to the km² in each class, and what they used a fifth of the land for" }
  - { ref: field:earth/population, note: "the people of each 1° cell, shared over its 5′ cells by their classes" }
  - { ref: field:people/land-use-assessment, note: "which way of life it was where the anthrome names no use of the land" }
  - { ref: field:people/lifeways, note: "the pattern of settlement, from the two above" }
  - { ref: field:people/cities, note: "the cities that stood near, and their people" }
  - { ref: field:people/cities-ancient, note: "the cities that stood near, and their people" }
  - { kind: tradition/building, note: "the building traditions that hold in the region at the time" }
  - { prop: dwelling, note: "what each tradition's houses were like" }
  - { prop: settlement_form, note: "how its houses stood together, in a ring or in rows, round open ground; what enclosed the settlement and each yard; and how many lived in each house" }
  - { prop: outbuildings, note: "what stood by each house and what each settlement had of its own: granaries, byres, pens, wells, shrines, halls" }
  - { prop: field_system, note: "the plots of its fields" }
  - { prop: extent, note: "the regions each tradition was found in" }
  - { prop: lifeway, note: "whom each tradition housed: its house is drawn for those ways of life only" }
  - { prop: prevalence, note: "how many of them lived so, where a tradition says they were not all: the part of their settlements drawn in its house" }
  - { prop: town_form, note: "how a town's streets ran and what enclosed it, as the tradition of its townspeople or its own record says" }
  - { kind: tradition/agriculture, note: "the agricultural traditions that hold in the region at the time, naming the crops grown and their field systems" }
  - { prop: crops, note: "which crops each agricultural tradition's farmers grew, by season and share" }
  - { kind: tradition/husbandry, note: "the ways of keeping animals that hold in the region at the time" }
  - { prop: livestock, note: "which animals each husbandry tradition's people kept" }
  - { prop: body_plan, note: "each kept animal's body, from its taxon's records" }
  - { prop: body_form, note: "each kept animal's body, from its taxon's records" }
  - { prop: body_length, note: "how big each kept animal is drawn" }
  - { prop: body_mass, note: "how big each kept animal is drawn, and whether it grazes in a herd or is kept about the houses" }
  - { kind: settlement, note: "the cities the world has records of: where and when each stood" }
  - { prop: population, kind: settlement, note: "a recorded city's people at the times its claims are for" }
  - { prop: houses, kind: settlement, note: "a recorded city's houses, where a source counts them" }
  - { prop: settlement_area, kind: settlement, note: "the ground a recorded city covered" }
  - { ref: model:people/city-population, note: "a city's people through the whole of its life, which its town is laid out from" }
  - { ref: model:people/settlement-growth, note: "which of a city's ground was built at each time: its plots stand where and when the model has it built" }
  - { ref: gen:life/scene, note: "the ground and the water of the scene the houses stand in; and how its wild animals go about, by which the kept ones do" }
checks:
  - { test: world/generators/people/settlement/v10.test.ts, holds: "keeps the houses and streets of an earlier time where they stood at a later one, as the city grows" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "shrinks back to its oldest ground as its people fall" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "has no most of houses: a great city has a house to each plot it built" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "leads its routes out towards the places it dealt with, and has its wall while the wall stood, with a gate on each route" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "gives a plot to as many people as its tradition says lived to a house: forty to a block of flats is a sixth as many houses" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "keeps its plots where they are when the house its people lived in changes: its plan is its height's" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "builds each plot in the house of the tradition it falls to, in the parts the traditions say their people were" }
  - { test: world/generators/people/settlement/town.test.ts, holds: "builds nothing in its river" }
  - { test: world/generators/people/settlement/division.test.ts, holds: "cuts the face into blocks near its size, and plots that each have a front" }
  - { test: world/generators/people/settlement/division.test.ts, holds: "runs a planned grid on across faces, street for street" }
  - { test: world/generators/people/settlement/division.test.ts, holds: "lays its lanes along the contours where the ground is steep" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "holds as many people as the world puts in the land it draws" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "stands no house in the water or on a cliff" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws fields where people farmed, pasture where they herded, and neither for foragers" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "works as much of a cell as its settlements would, on the average" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "works fields where people farmed, pasture where they herded, and nothing for foragers, and builds where towns stood" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "scales the far land to the plan's by its own settlements, and not by a city's fields" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws the far land with no step at a cell's edge, and none beyond the cells it is told of" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a tradition's house where it holds, and the generic one where none does" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a camp's shelter from the tradition that housed its way of life, and no farmer's house from a herder's tent" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws shifting cultivators in the house of their region's farmers where none is written for them, and says it stands in" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a house that some lived in for that part of the cells of its region, each cell all of one house, and alike from two scenes" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "are drawn where a husbandry tradition names them for that way of life: herds on the pasture, the rest about the houses" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "joins neighbouring farming settlements at the ends of their through lanes" }
  - { test: world/generators/people/scene.test.ts, holds: "hands a view each kind as its own entity: taxa, then houses, then works, then kept animals, then the fields' crop" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a city of the lists where the anthromes have none" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "puts a settlement in the same place from two scenes that overlap" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "stands its settlements near water and on level ground, more than the land there would" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "takes the record's siting and growth where a build has none" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "asks the world for its people as far as the cells it weighs reach, and a cell beyond" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "keeps two settlements' grounds apart where a cell has little room for them" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "puts a settlement in the same place from two scenes when a river lies past where one of them knows water" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "keeps two settlements' grounds apart across the edge of a cell of farmsteads and a cell of large villages" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "grows the fields of a house that stands where nothing is farmed from the land about it" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "puts a settlement in the same place from two overlapping scenes of a plain with a river and hills" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws its settlements in many sizes within their range, the larger on the better ground" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "shows no step at a cell's edge, and stands no two settlements nearer than its spacing allows where the ground has room" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "grows each settlement's fields over the land, not in the water or on the steep, until they are as large as its people farmed, up to its neighbours'" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "seeds each cell and each settlement apart, and each alike from two scenes" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "has the wall its tradition says, round its houses, with gates where its main streets leave it, and towers" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "of a record is drawn from the record's own people, houses, ground and layout" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws each house in one of its shapes, and no bigger than its claims say" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "sets houses in a ring round open ground, their doors to the middle, where its tradition says so" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "sets houses in rows, and turns every house the way its tradition says they all faced" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws round a settlement what its tradition says enclosed it, and the generator's plain wall where it says only that one did" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "lays out connected farming lanes, seasonal regional agriculture, living activity, and slope-gated land use" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws what a settlement had of its own among its houses, and a household's things with its house" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a house that stands for several households wider and longer, and not as a bigger copy of itself" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "draws a town's house no wider than the ground its town gives it, so that none stands in its neighbour" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "lets no house of a town of winding lanes stand in its neighbour, and still houses the town" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "keeps a city's houses off the ground of a city that adjoins it" }
  - { test: world/generators/people/dwellings.test.ts, holds: "draws every word a claim may use, at every detail, about as big as it says" }
  - { test: world/generators/people/dwellings.test.ts, holds: "draws a dwelling in several shapes, each within the ranges its claims give, and each the same every time" }
  - { test: world/generators/people/dwellings.test.ts, holds: "takes from the generator's house only what fits what a tradition says" }
  - { test: world/generators/people/dwellings.test.ts, holds: "draws the yard with the house, within its own ground, and not from far off" }
  - { test: world/generators/people/dwellings.test.ts, holds: "cuts a door through a wall that is built up, as deep as the wall is thick, and leaves it on the face from a way off and in a covering on a frame" }
  - { test: world/generators/people/dwellings.test.ts, holds: "leans a wall of earth in as it rises, close by, and stands one of brick or timber upright" }
  - { test: world/generators/people/dwellings.test.ts, holds: "raises a flat roof's walls past its deck as its parapet, close by, under a coping, with the ends of its beams through them" }
  - { test: world/generators/people/settlement/lanes.test.ts, holds: "connects every threshold to field access without crossing another house" }
  - { test: world/generators/people/crops.test.ts, holds: "stands in angled domain rows, only on cropped/stubble slots, clear of balks and domain edges" }
  - { test: world/generators/people/crops.test.ts, holds: "sows no place twice and leaves none out, whichever squares of ground are asked for" }
  - { test: world/generators/people/crops.test.ts, holds: "draws distinct botanical stands for every crop archetype and stubble within a tight triangle budget" }
  - { test: core/plots.test.ts, holds: "puts each plot under a crop, the plough or fallow by its own number, in the shares it says" }
  - { test: world/generators/people/fieldworks.test.ts, holds: "builds contour-following 3D terrace retaining risers on moderate hillside cropland and keeps clear of yards" }
  - { test: world/generators/people/walls.test.ts, holds: "extrudes a continuous rammed-earth perimeter with deep skirts, watchtowers, and roofed gatehouses on sloping hills" }
  - { test: world/generators/people/works.test.ts, holds: "stands a figure in a robe on feet, close by: under its hem, on the ground" }
  - { test: tools/world/test/landscape.test.ts, holds: "draws a list's city that has a record where the record puts it, with the record's own people about the time they are for" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "sends those who stand, walk or carry about, between places clear of every house; those who sit or kneel stay" }
  - { test: world/generators/people/settlement/v10.test.ts, holds: "feed and move on once they are drawn: a herd keeps out from among the houses, and what is kept by them stays among them" }
limits:
  - with: field:earth/population
    note: >-
      A 5′ cell's people live in the cell, as the world shares them; where in it is the generator's. It weighs a place by
      the scene's water and ground and by a soil that is a noise over the Earth, not by any map of soils or of where
      people lived. It leans a cell's settlements toward its more crowded neighbours, so that a cell's edge is no line on
      the land, but cannot move people from one cell to the next: a river through one cell does not draw the people of
      the cell beside it. A stream too small for the world's rivers is not known, and does not draw them either; nor
      does the sea's coast, which people who fished settled by. The scene draws its rivers to 34 km from its middle: the
      ring of cells weighed past that, only so that those near the scene's edge are placed as a scene centred on them
      would place them, is weighed as if it had no water near. Where a river lies past one scene's water and within the
      other's, the settlements both draw still agree, up to 300 m from either's edge, in the test of it.
      A cell whose ground has no room for all its settlements' houses, as a narrow valley between steep slopes may not,
      leaves its last and smallest settlements out: their people are not drawn.
      A settlement is seeded by its place, fixed by its cell, but its size by the rank of its place's worth among the
      cell's: where two places are worth all but the same, two scenes whose ground differs a little may give them each
      other's sizes.
  - note: >-
      Every build is drawn with this version's siting and fields, whatever version made it: a build made before version 9
      has no `siting` or `growth`, and takes the record's. A link into such a build finds its settlements and fields
      where version 9 puts them, not where that build first drew them. Whether to keep each version's placement for its
      own builds is a maintainer's decision, still open.
  - note: >-
      A cell weighs at least four places for each of its settlements, beyond `candidates`' most, so that a crowded cell
      can place them all, up to four times that most (24,000 places): past it, its last settlements may find no place and
      are left out, as where there is no room. The cost grows with it: in a test world of farmsteads (1–3 houses), a
      scene's plan took about 1.5 s at 120 people to the km², 3 s at 300 and 6 s at 600, against about 0.4 s for hamlets at
      40. The anthromes' classes of farmsteads say 1–10 people to the km², far below these; a cell near a large city is of
      a class of villages or towns, whose settlements are fewer and larger.
  - with: field:people/anthromes
    note: >-
      The far land beyond a scene is scaled to agree with the land its own settlements work, in the cells it holds whole
      that no city's ground or fields reach. A city's fields grow over the land, and a large one's may reach every such
      cell, as a city of some 800,000 does in a living scene: then the scale is weighed in what the cities leave of those
      cells, place by place, which is less sure than whole cells (within a tenth of the scene's without the city, in the
      test of it).
  - with: gen:life/scene
    note: >-
      The ground and the water a settlement is weighed by are the scene's, and two scenes that overlap draw them a little
      differently, from their own grids: where the scenes' ground disagrees, a settlement may take another of its places,
      and its fields end a little differently.
  - with: gen:life/scene
    note: >-
      Who goes about, where to, how fast and how long they stay rests on no record. A person goes to a door or a well
      and back, round and round by the visit's clock, by straight lines: not along the paths between settlements, not
      to the fields or to water, and through whatever of a yard is not a house's walls or an enclosed yard's edge, an
      oven or a rack among them. No one carries anything from one place to another, meets anyone or goes indoors, and
      the hour and the season change nothing. The kept animals go as the living scene's wild ones do, with its limits.
  - note: >-
      For compact farming settlements, a household turns onto a shared lane leading through the enclosure to its
      fields. Dispersed farmsteads keep their own turnoffs. Each layout, field entrance and route is procedural.
      The main track ends at the accessible field margin where the plot and the ground permit it.
  - with: field:people/anthromes
    note: >-
      A class is a band of density, and the people of a 1° cell are shared over its 5′ cells by the middle of each band, so a
      5′ cell's people can be out by the factor its band spans; only the 1° total holds. Houses past the most a scene draws
      stand for more people each, and the panel says how many.
  - with: field:people/anthromes
    note: >-
      Beyond the settlements a scene lays out, the land is drawn worked as much as each 5′ cell's settlements would work
      it on the average (farLand), scaled to agree with what the scene's own settlements work away from any city, a
      degree of latitude each way. Within a band at the scene's edge it fills only the ground the scene's own fields
      leave, as far as they fall short of it. No settlement stands behind it: where its fields lie, in patches of a
      kilometre or two, is the renderer's, and they follow neither the ground nor the water. A cell of towns or a city
      is drawn with its houses' lots as patches of trodden ground and only its fields worked, as the plan lays it out:
      no streets and no houses. The cities of the lists and of records are left out of it, and what the scene works out
      from the ground at each place, how much of a shifting cultivator's land is cleared and how much of a wet field is
      flooded, it takes on the average (FAR_AVERAGE); the share flooded is a guess.
  - with: field:people/cities
    note: >-
      A city of the lists is drawn as houses on the lots of streets, around the list's point: on a grid or along lanes,
      walled or open, as the tradition of its region's townspeople says, and as the generic town where none does. Every
      street's line, every gate's place and the outline, round or square, are invented. It has no temples, palaces or
      districts, which are a city slice's work, as Rome's are. A city with a record covers the ground its record gives,
      as a disc or a square about its point: the outline of the real city, and where within it people lived, are not
      read. A city whose ground is more than params.towns.open_lot to a house is drawn with no streets, its houses apart.
  - note: >-
      A tradition's claims are drawn for every house of it: a porch that some houses had, a byre the poor shared with
      their cattle, a village wall that was often there, are drawn for all or not at all. What a household kept in its
      yard is drawn for a share of the households where no source counts it (params.outbuildings.share), and what a
      settlement had, once to a settlement. Where each stands, where a fence runs and where its ways in are, and that
      one house of a tradition differs from the next, are invented.
  - note: >-
      A town's house stands at the front of a lot as wide as itself and deeper, and is drawn as small as its lot where
      the town gives it less ground than its tradition's house takes. The lot is the generator's, from the town's
      people and its ground, and no record's. Along winding lanes a house fronts its lane as the lane runs there, and a
      lot that the lane's wandering has squeezed against one already taken is passed over for the next: which lots,
      and every lane's line, are invented. Where two cities would take the same ground, the one that comes first in
      the lists keeps it, and the other has fewer houses than its people; nothing says where one ended and the other
      began. A house that stands for several households has a door to each share of its front, as many as it is times
      as wide: fewer than the households it stands for.
  - note: >-
      Regional crop mixes and seasonal rotations come from `tradition/agriculture` records where one holds for the
      region, era and way of life, and fall back to climate-appropriate generic stand-ins (labelled generic) where none
      is recorded. Macro-domain parcel orientations, individual parcel boundaries, contour-following hillside terraces,
      fieldwork walls/bunds/hedges, and individual plant rows are all procedurally generated. Standing crops are drawn
      close by at full quality; elsewhere a field is shaded on the ground with seasonal colours, furrows and terraces.
  - note: >-
      Road-first village street networks, central plazas, continuous terrain-conforming walls and roofed gatehouses,
      and everyday living activity (market stalls, civic altars, pottery kilns, hearth/kiln smoke plumes, grain stooks,
      ploughs, river jetties, road-following carts/barrows, and working figures in streets and fields) are procedurally
      generated and marked as generic where no building or settlement record names them.
  - note: >-
      A wall's thickness, how far a wall of earth leans in, a lintel, a sill, a threshold, a coping and the ends of a
      flat roof's beams are drawn for every house whose walls are built up, by the kind of wall its claims give: no
      tradition's record states them. A house whose door is under its gable or a hood, a house with a rounded end, a
      ring of rooms round a court, a front cut in the earth and every tent are drawn as they were, their openings on
      the face of their walls.
slots:
  any:
    place: >-
      Any place on land the anthromes reach, at the step of theirs nearest the time. Each 5′ cell of the world seeds its
      own settlements at each step, whichever scene draws them, so that overlapping scenes agree.
    seed: people/settlement
# Nothing below is a claim about any place or people. The numbers say how this generator lays out what the records and
# the fields leave open: how many houses stand together where no tradition says, how much ground each takes, how much of
# a settlement's land is in fields, and the generic houses drawn where no tradition holds.
params:
  household: 5
  # Houses a tradition sets in a ring or in rows, and says no more of, stand this many lengths of a house apart.
  compact: 2.4
  # Procedural widths in metres. These routes join the entrances of permanent farming households to their fields.
  lanes: { main: 4, side: 2.8, foot: 1.4 }
  patterns:
    foragers: { houses: [2, 6], lot: 900, fields: 0 }
    herders: { houses: [2, 8], lot: 1600, fields: 0.6 }
    shifting: { houses: [5, 25], lot: 900, fields: 0.2 }
    farmsteads: { houses: [1, 3], lot: 2500, fields: 0.3 }
    hamlets: { houses: [4, 15], lot: 1200, fields: 0.45 }
    villages: { houses: [25, 150], lot: 700, fields: 0.55 }
    towns: { houses: [150, 1500], lot: 350, fields: 0.4, storeys: 2 }
    city: { houses: [500, 5000], lot: 200, fields: 0.3, storeys: 2 }
  generic:
    foragers: { plan: round, diameter: 3.5, walls: none, roof: dome, roof_material: thatch, height: 2 }
    herders: { plan: round, diameter: 5, walls: felt, roof: tent, roof_material: felt, wall_height: 1.4, height: 2.6 }
    town: { storeys: 2 }
    city: { plan: courtyard, storeys: 2, court: true, width: 11, length: 11 }
    farm:
      rainforest: { plan: rectangular, width: 5, length: 8, walls: pole-and-thatch, roof: gable, roof_material: thatch, floor: stilts }
      savanna: { plan: round, diameter: 5, walls: wattle-and-daub, roof: conical, roof_material: thatch }
      temperate: { plan: rectangular, width: 5, length: 10, walls: wattle-and-daub, roof: gable, roof_material: thatch }
      cold: { plan: rectangular, width: 6, length: 10, walls: timber, roof: gable, roof_material: timber }
      steppe: { plan: rectangular, width: 6, length: 8, walls: mudbrick, roof: flat, roof_material: earth }
      desert: { plan: courtyard, width: 12, length: 12, walls: mudbrick, roof: flat, roof_material: earth }
      tundra: { plan: round, diameter: 6, walls: sod, roof: dome, roof_material: turf }
      ice: { plan: round, diameter: 4, walls: snow, roof: dome, roof_material: snow }
  plots:
    rainfed: { kind: blocks, plot: 0.5 }
    irrigated: { kind: basins, plot: 0.3 }
    rice: { kind: paddies, plot: 0.15 }
    swidden: { kind: swidden, plot: 0.8 }
    pasture: { kind: irregular, plot: 3 }
  # The crop of the fields, drawn close by as plants. No record says which crop grew in any of these fields, and the
  # generator names none: where the land use has fields and a plot is under a crop this year, a plain stand of upright
  # blades is sown in rows along the plot, 0.7 m apart, a clump 0.5 m wide every 0.42 m of a row, a green stand 0.35 to
  # 0.75 m tall and a ripe one 0.7 to 1.1 m, each plot its own; from a way off, 1.7 m of a row is drawn as one thing.
  # That fields were sown in rows at all is the generator's look: most grain was sown broadcast.
  crops: { row: 0.7, apart: 0.42, wide: 0.5, green: [0.35, 0.75], ripe: [0.7, 1.1], length: 1.7 }
  site: { steep: 0.25, above_water: 1.5, city_above_water: 0.3 }
  # Where in its 5′ cell a settlement stands (settlement/sites.ts). Nobody recorded where; these say how the generator
  # weighs a place by what people looked for in one, none of it a claim about any place. Fresh water: within `best` m a
  # place lacks nothing, and its worth falls off past it over `falloff` m, to `floor` where people dug wells or carried
  # water; the banks of any water, a river's flooded in a high year and a pond's or a lake's wet, keep only the third of
  # `bank`'s numbers of their worth within the first of its m, and are back to the full by the second. Level ground
  # keeps `floor` of its worth at a slope of `steep` across `over` m. A place a little up from the bottom of the ground
  # about it, `best` m above the mean within `reach` m, is better than a crest or a wet bottom. The soil is a noise over
  # the Earth at two scales, m. A town or a city draws settlements about it. A cell weighs `candidates` places for each
  # of its settlements (the fewest and the most a cell weighs), takes them by worth raised to `sharpness` against
  # chance, keeps them `spacing` of their mean spacing apart (and their houses `gap` m), and draws its settlements'
  # sizes from its range, the smaller oftener by `sizes`. Settlements gather: one place in `per` of a cell's is one the
  # others gather round, and a place's worth falls off with its distance from the nearest such, over `reach` of their
  # mean spacing, to `floor`.
  siting:
    candidates: [10, 48, 6000]
    spacing: 0.4
    gap: 30
    sharpness: 2
    water: { best: 900, falloff: 1500, floor: 0.3, bank: [60, 220, 0.3] }
    level: { over: 60, steep: 0.12, floor: 0.25 }
    relief: { reach: 1000, best: 2, spread: 25, floor: 0.55 }
    soil: { scales: [5200, 1600], weight: 0.75 }
    city: { weight: 1.5, reach: 3000 }
    sizes: 1.2
    gather: { per: 8, reach: 0.5, floor: 0.05 }
  # How a settlement's fields spread over the land about it (settlement/sites.ts): over a grid of `cell` m, from its
  # houses, through the ground least effort to reach and farm, until they are as large as its people farmed (the share
  # of its cell's land its pattern gives), or until the walk to them passes `reach` times the radius of a disc as large
  # as its fields and its houses' ground together; the walk starts at the houses' edge. Settlements within `margin` m
  # beyond the scene's edge grow theirs too. The soil at the fields' own scale, m, moves the effort by `weight`, and
  # `rough` varies it from node to node, so that a field's edge is ragged. A field spreads across the land's grain at
  # `across` more effort than along it: the grain runs along the contours where the ground slopes more than `slope`,
  # along the water within about `water` m of it, and elsewhere as a noise over the Earth at `scale` m turns it. By the
  # water, the growth leaves unfarmed what lies within 15 m of it or less than 0.6 m above it, and farms with less ease
  # what lies under 2.5 m above it (from 0.45 of the ease at 0.8 m); a paddy's ease rises toward the water instead, and
  # pasture takes ground from 0.5 m up. These are the generator's, set in the code. Nobody recorded where any field
  # ended.
  growth: { cell: 50, margin: 2500, reach: 2.4, soil: { scale: 900, weight: 0.85 }, rough: 0.35, grain: { across: 0.8, slope: 0.06, water: 900, scale: 9000 } }
  cities: { reach_km: 30, lot: 160, town_lot: 300, household: 6, city_from: 10000, most_houses: 12000, record_hold: 50, record_gap: 600 }
  # A city or a town of the lists or of a record, laid out through its whole life (town.ts; docs/plans/CITIES.md): how
  # many routes reach one of 1,000 people and one of 1,000,000; what a route's step across water costs against one
  # across level ground, for a bridge, a ford or a ferry; that its wall is laid round it as it stood when it first had
  # `wall_at` of the most people it had while the wall stood, `wall_margin` m out from its last houses; that two routes
  # leaving it closer than `apart` radians are one; and how much of its plot a house covers where the town is thinnest
  # and where it is densest (at 300 people to the hectare). None of these is a claim: which places a city dealt with is
  # read from the lists and the records, its people and areas from them, and its wall's years from its town form.
  town: { routes: [3, 9], ford: 12, wall_at: 0.6, wall_margin: 12, apart: 0.5, coverage: [0.25, 0.7] }
  # A town where nothing says how it was laid out: lanes that wander, and no wall. Where a tradition or a record says a
  # town had a wall and not how high or how thick, or streets and not how wide, these stand in, and the panel says so.
  # How square a town's outline is goes by its streets: a planned town is drawn square, one of lanes round.
  towns:
    generic: { streets: lanes, wall: none }
    block: 60
    street: 3
    main_street: 8
    outline: { grid: 1, lanes: 0, canals: 0.5 }
    walls:
      earth: { height: 3, thickness: 12 }
      rammed-earth: { height: 8, thickness: 8 }
      timber: { height: 3.5, thickness: 0.4 }
      mudbrick: { height: 7, thickness: 4 }
      stone: { height: 8, thickness: 2.5 }
      brick: { height: 9, thickness: 3 }
    unstated_wall: mudbrick
    gates: 4
    tower_every: 60
    square: 0.02
    canal: 6
    moat: 12
    canal_every: 2
    open_lot: 1200
    deep: 3
  # The part of a region's settlements of a way of life drawn in a tradition's house, where the tradition says its people
  # were a few, some or most of them and not all. No source gives these numbers: each word stands for a part, so that a
  # rare house is drawn rarely. Each 5′ cell falls to one tradition, so a rare house stands in clusters, as most did.
  prevalence: { few: 0.03, some: 0.3, most: 0.75 }
  # The animals a husbandry tradition says its people kept are drawn among them: those that graze in herds, on the
  # pasture of people who herd and at the edge of the houses of people who farm; the rest about the houses. Which animals
  # is the tradition's. How many is nobody's: these numbers only say how full a scene is drawn.
  livestock:
    per_household: { foragers: 0.5, herders: 6, shifting-cultivators: 0.8, farmers: 1.5, townspeople: 0.1 }
    herd: [3, 12]
    graze_kg: 15
    most_in_settlement: 240
    most: 12000
  # What stood by the houses, where a tradition's `outbuildings` name it: a household's things are drawn in its yard,
  # with its house; a settlement's, among the houses or at their edge. That they stood there is the tradition's claim.
  # How many, where no source counts them, is the generator's: a household's thing by this share of the houses, a
  # settlement's once. And what each looked like, where its tradition says nothing of it, is the plain one of its use
  # here for its shape and size, built of what the tradition's own houses are built of.
  outbuildings:
    share: 0.6
    generic:
      granary: { plan: round, diameter: 2.2, wall_height: 1.5, roof: conical, floor: raised }
      store: { plan: rectangular, width: 2.4, length: 3.2, wall_height: 1.8 }
      byre: { plan: rectangular, width: 3.5, length: 6, wall_height: 1.9 }
      kitchen: { plan: rectangular, width: 2.6, length: 3.4, wall_height: 1.8 }
      workshop: { plan: rectangular, width: 3, length: 4, wall_height: 1.9 }
      bath: { plan: round, diameter: 2.4, wall_height: 1.3, roof: dome, roof_material: earth }
      shrine: { plan: square, width: 3, wall_height: 2.2, floor: raised }
      hall: { plan: rectangular, width: 7, length: 14, wall_height: 2.8, entrance: end }
      pen: { diameter: 6 }
      oven: { diameter: 1.4 }
      well: { diameter: 1.6 }
      pond: { diameter: 8 }
      rack: { width: 2.6, height: 1.8 }
      stack: { diameter: 2.6, height: 2.8 }
      threshing-floor: { diameter: 8 }
      pole: { height: 5 }
    most: 6000
  # What stood round a settlement, where its tradition's `settlement_form` names it: drawn in lengths of this many
  # metres round its outermost houses, with this many ways in. A settlement its tradition calls walled and says no
  # more of is drawn within the plain wall here, and the panel says that is the generator's. No source places any
  # length of any of them.
  enclosures: { run: 6, gates: 2, unstated: wall, most: 30000 }
  # People by the houses, boats on the water beside a settlement and paths between settlements, so that a scene has its
  # scale and its ways. No record says anything of any of them: they are the plainest there are, the same everywhere,
  # and a click says that they are generic.
  # Those who stand, walk or carry go about once they are drawn (life/routines.ts): at 1.1 m/s, getting going in 0.7 s,
  # 6 to 40 m at a time, to the door of another house or to something the settlement had of its own where one is near,
  # staying 8 to 70 s at each place, over ground that lies no more than 8 cm off the straight line they are carried
  # along, with eight places tried. Who goes, where to, how fast and how long they stay is nobody's record. The animals
  # they kept feed and move on as the living scene's wild ones do, by its parameters (gen:life/scene, animals.routines).
  figures: { per_house: 0.5, most_in_settlement: 300, most: 20000, height: 1.62, walk: { speed: 1.1, go: 0.7, range: [6, 40], stay: [8, 70], sag: 0.08, tries: 8 } }
  boats: { length: 5, beam: 0.9, side: 0.45, reach: 250, depth: 0.6, most_in_settlement: 3 }
  paths: { width: 1.8, reach: 2500, each: 2, most_km: 300, wander: 0.05, patterns: [shifting, farmsteads, hamlets, villages, towns, city] }
  # The most houses a scene keeps: past it, each stands for more people. A city of a million is drawn with a house to each
  # of its plots (docs/plans/CITIES.md, decision 6), and the renderer keeps what is far by rank and distance, so this is
  # a bound on what a worker holds, not on what is drawn.
  most_houses: 400000
