# Builds the world and the viewer, checks the build (reproducible to the byte, and what it holds),
# and publishes it: the build to R2, where each is kept under its id, and the site to Cloudflare
# Pages, master to wikiworldmodel.org. It runs when master
# changes, when a pull request changes how the world is built, and by hand on any branch, which
# publishes a preview. Pull requests that only change records don't need it: the checks validate
# them.
name: Build

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'core/**'
      - 'tools/world/src/**'
      - 'tools/world/importers/**'
      - 'world/generators/**'
      - 'world/manifest.yaml'
      - 'world/schema/**'
      - 'viewer/**'
      - 'site/**'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: wikiworldmodel
      WRANGLER: wrangler@4.151.2
      # Where the builds are kept, and the address they are served at (site/README.md).
      BUILD_BUCKET: wikiworldmodel-builds
      BUILD_STORE: https://builds.wikiworldmodel.org/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/world/importers/requirements.txt

      - name: Install
        run: |
          npm ci
          python -m pip install -r tools/world/importers/requirements.txt

      # The datasets, each version in a directory of its own, which the fetch below downloads only
      # if it is not here with its checksum. So a changed manifest starts from the newest set kept
      # before and asks the hosts only for what that lacks, and a host that does not answer fails
      # only a build that needs something from it. A run can start from a set kept by its own
      # branch or pull request, by the branch a pull request is to merge into, or by master, and
      # never from another pull request's: what one added is fetched once more when it is merged.
      # The set is saved again, under the new key, when the job passes.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/datasets
            .cache/blobs
          key: datasets-${{ hashFiles('world/manifest.yaml') }}
          restore-keys: datasets-

      # What the importers make of the datasets, keyed by everything that could change it. No
      # partial restores: a change to the code imports afresh.
      - uses: actions/cache@v6
        with:
          path: .cache/import
          key: import-${{ hashFiles('world/manifest.yaml', 'tools/world/importers/**', 'tools/world/src/**', 'world/generators/**') }}

      # Content-addressed DAG build stages and blobs: unchanged stages hit cache across builds.
      - uses: actions/cache@v6
        with:
          path: .cache/build
          key: build-dag-${{ hashFiles('world/manifest.yaml', 'tools/world/src/**', 'core/**', 'world/generators/**') }}-${{ github.run_id }}
          restore-keys: |
            build-dag-${{ hashFiles('world/manifest.yaml', 'tools/world/src/**', 'core/**', 'world/generators/**') }}-
            build-dag-

      - name: Fetch the datasets
        run: npm run fetch

      - name: Build the world
        run: npm run build:world

      # That building again gives the same bytes is checked nightly (nightly.yml), not here.
      - name: Check the build
        run: npm run test:build

      - name: Build the viewer and put the site together
        run: |
          npm run build:viewer
          npm run build:site -- dist/public

      # Before the site, whose index names the build: the store must have it first.
      - name: Put the build in R2
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: tools/world/publish-build.sh

      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          # The project is made on the first deployment; after that this fails and is ignored.
          npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=master 2>/dev/null || true
          npx --yes "$WRANGLER" pages deploy dist/public --project-name="$PROJECT" \
            --branch="${{ github.ref_name }}" --commit-hash="${{ github.sha }}"

      # A build meant to be published fails without the secrets, rather than passing with
      # nothing published.
      - name: Fail if the secrets are missing
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::error::Not published: this workflow cannot see the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Add them as repository secrets for Actions (see site/README.md)."
          exit 1
