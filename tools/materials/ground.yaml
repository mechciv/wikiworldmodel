# The scanned materials of the ground (docs/plans/RENDERING.md, "Procedural first"): what earth, sand, pebbles, rock, mud
# and snow look like from a metre or two, as photogrammetric scans, each a square that repeats without a seam. They say
# nothing of any place: which material a ground has, how much of each, and what colour it is are the world's
# (core/substrate.ts) and the scene's (world/generators/life/scene.yaml); a scan gives only a material's grain, in the
# place's own tone. None shows a living thing: what lies under trees is drawn, not photographed.
#
# All are from Poly Haven (https://polyhaven.com), whose assets are dedicated to the public domain under CC0 1.0. Each
# map is pinned by its address and its md5 as Poly Haven's API gave them in November 2026.
#
#   npx tsx tools/materials/pack.ts        # needs ImageMagick 7 (magick) and libwebp (cwebp)
#
# fetches the maps into .cache/materials, and writes each layer as two images under viewer/public/materials/ground,
# `size` pixels square: its colour; and beside one another its normal's two parts, its height and its roughness. It
# writes viewer/public/materials/ground.json, which the viewer reads, and from which ATTRIBUTION.md credits them.
license: CC0-1.0
source: Poly Haven
url: https://polyhaven.com
size: 768
# A layer's place in the list is its number in the renderer (viewer/src/gl/materials.ts): add to the end.
# `metres` is how much ground one repeat covers, as its scan's own dimensions say. `chroma` is how much of a scan's own
# changes of hue are kept, from 0, only its light and dark, to 1: pebbles are of many rocks, snow of none.
