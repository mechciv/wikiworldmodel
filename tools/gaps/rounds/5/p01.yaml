effort:
  fetched: 11
  cited: 8
  failed: 2
  note: >-
    11 fetches tried, 9 texts read, 8 cited (one, Droser & Gehling 2015 in PNAS, was read and dropped because it
    gave no date for the first macrofossils). Refused: the Marwar synthesis in Proc. Indian National Science
    Academy (2019; expired certificate on the publisher's host) and a 2004 paper on the seismic structure of the
    Saurashtra crust (Geophysical Journal International, OUP, 403). Semantic Scholar's search refused every query
    (429), so OpenAlex and Europe PMC were used to find works. `npm run world -- rocks` holds no rock record for the
    place and time. Most time went on looking for anything about the place itself at this age. Nothing was found
    nearer than the Marwar basin, 400 to 500 km off, so every item is `region`.
