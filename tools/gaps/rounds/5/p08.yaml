  - "How much of this valley and its slopes was cleared for fields, terraced or left in forest in 594 BCE. No pollen or charcoal record from north Euboea could be found; the nearest, at Amarynthos in south-central Euboea (Ghilardi et al. 2018), could not be read (its hosts refuse automated reading) and its sequence stops in the Early Iron Age."
  - "Whether any farmstead, hamlet or shrine stood in the frame. The nearest named places of the period are Elymnion at Limni (Pleiades 540761, about 5 km south, behind the camera's right shoulder, out of frame) and Orobiai at Rovies (about 8.5 km west, behind); in front only Kerinthos is known."
  - "Which trees lined the river: plane trees are known in the Kireas valley today (Sargentis et al. 2024 mention plane-tree disease since 2017), but nothing ancient read says so."
  - "Which wild animals a person might see (deer, boar, hares, raptors); no source read lists the fauna of Archaic Euboea."
  - "Whether the walls of Kerinthos's acropolis stood by 594 BCE, and what the town looked like; no excavation report could be read (the Archaeological Reports review of Euboea 2014-2024 gave only its abstract)."
  - "Which polity held this valley in 594 BCE: Chalcis, Histiaia or Kerinthos."
  - "Today's peak names on the skyline ahead (heights from SRTM only) and whether the far mountains had forest to their tops."
