    Wayback), Theophrastus vol. 1 (Internet Archive scan), the 1981 review of the Euboean Neogene, two papers on
    today's north Euboean forests, and Pleiades for Kerinthos. Kept, not cited: Pleiades for Elymnion (in an unknown),
    the abstract page of the Archaeological Reports review of Euboea 2014-2024 (only the abstract shows). Refused:
    the review's PDF host (not resolved), grissh.gr (HTTP error), HAL's Amarynthos record and an aggregator's record
    of Ghilardi et al. 2018 (both behind an anti-bot wall, deleted); a copy of Ghilardi 2018 on ancientportsantiques
    was not used, as a copy of doubtful origin. The place itself was found from SRTM elevations and OSM's reverse
    geocoder: the hint (Lelantine plain, Psachna) was wrong by some 30-45 km; the point is above Limni. Most of the
    time went to looking for a vegetation record of north Euboea, which none of the routes reached.
