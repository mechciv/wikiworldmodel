  failed: 1
  note: >-
    Twelve fetches, eleven texts kept, nine cited. Refused: Steller's De Bestiis Marinis on the University of
    Nebraska's repository (HTTP error), so nothing of Steller's own on the sea animals could be quoted. Read but not
    cited, and deleted: the Coast Pilot's Aleutian chapter (ch. 7) and the Encyclopedia Arctica's article on the
    Aleutians. The useful finds were King's continuation of Cook's third voyage, whose ships passed 210 km north of
    the point in August 1779 and met April's weather 520 km west, and the Coast Pilot's winter climatology. Most of
    the time went on finding something about seabirds and whales in March, where little could be read.
