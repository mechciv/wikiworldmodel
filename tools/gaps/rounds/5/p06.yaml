  note: >-
    Sixteen texts fetched, seven cited, one more (andean-mantle-amazon.txt) kept for an unknown; search through
    OpenAlex and Europe PMC (Semantic Scholar rate-limited at once). Not reached: Antoine et al. 2016 on Contamana
    and Campbell et al. 2006 on the Ucayali Peneplain (Elsevier, closed, no abstract in the indexes), a 2022 MDPI paper
    on Ucayali meanders (refused), and an erosivity paper from near Pucallpa (an empty page). Fetched and dropped for
    giving nothing of this place and time: a Juruá orogeny paper (Jurassic), crocodylians of Urumaco (Venezuela), a
    mid-Pliocene rainfall model study, an Amazon Fan paper (Pleistocene) and a Madre de Dios provenance paper. Most of
    the time went on looking for any Pliocene plant or sediment record of the Ucayali basin itself; none was found.
