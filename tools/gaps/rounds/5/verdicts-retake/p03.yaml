findings:
  - "Unchanged: the atlas's seven taxa recorded here are leaves of one 1889 collection near Richmond, in the lowland 190 to 280 km east and across the drainage divide of the time, so the upland is still given the coastal plain's flora (model:life/atlas). The taxa list in drawn-retake.json is the same seventeen, in the same order."
  - "Unchanged: the life layer's tier still reads unknown, saying the atlases reach only the Phanerozoic, at 104.9 Ma, while the scene has its list and the panel says 7 recorded here, 3 nearby, 7 stand-ins (core/resolve.ts). The same holds at p04."
  - "Unchanged: PBDB collection 107496 (Albian, marine indet., claystone) still sits 80 km from the spot by its coordinates while its own fields name the Puddledock pit, Prince George County, Virginia, some 220 km east."
  - "New look at b: several of the tall conifers are bare spars with a few thin, drooping tiers of branches, so that they read as dead or dying trees among the leafy broadleaves. If the conifer body is meant to be in full leaf, the skeleton is too sparse at this distance. Owner: forms: conifers."
  - "New look at a: the low cover on the open slope is dense narrow-leaved shoots, much like grass or cereal seedlings; the biome gives grasses 0 and grasses are not on the list, so these are the ferns' (or another low group's) body, but at eye level they could be taken for grass, which did not grow here then. Owner: forms: ferns and their allies."
  - "Labels without bodies: Nodosauridae, Ornithischia and beetles are labelled at spots where nothing can be made out at the label, as in the first take."
