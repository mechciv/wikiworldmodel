changes: >-
  The new build draws the same place with more detail and the same faults. The scene now takes the world's relief
  (the eye stands at 887 to 921 m, nearer the globe's 943 m, where it stood at 750 to 800 m), so spot a looks up a
  real slope; the ground is a scanned material, leaf litter under the trees at b and c and a dense low green cover at
  a; the broadleaf trees have forked trunks and leaflet sprays, the conifers tall bare spars with thin tiers, and the
  four small bipeds at a have clearer bodies. The plant list, the mix of trees and the animals are unchanged, and no
  verdict moved.
summary: >-
  The viewer still gets the setting right: dry land on an upland (943 m on the globe, now 887 to 921 m in the scene,
  on a visible slope at a), no sea, no river, a humid climate, and ground over the column's Pennsylvanian sandstone.
  What it draws on that ground is still less right: at b and c a woodland of conifers and round-crowned broadleaf
  trees mixed stem by stem over leaf litter, at a an open slope of low green shoots with trees only on the skyline;
  the flowering plants are tall generic trees, not shrubs in patches, and the only animals in sight are four small
  ornithischian stand-ins. The plant list is still lowland leaves from 190 to 280 km away across the drainage divide.
