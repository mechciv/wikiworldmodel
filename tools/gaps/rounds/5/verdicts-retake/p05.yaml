findings:
  - The ground that the substrate model says is sand is drawn in the new build as a forest floor of fallen leaves (b and
    c) and a brown, stony soil (a). Litter under trees is right for a forest in November, but where the ground is bare
    at a it is not drawn as the sand the panel names; the material the renderer chooses no longer follows the
    substrate there.
  - The life layer still answers "unknown" ("the atlases of who lived where reach only the Phanerozoic") at 17 Ma,
    where the scene lists 47 taxa from the atlas, as in the first take.
  - The atlas's list for this patch is unchanged, and still leaves out Anchitherium and both pliopithecoids of the
    Sihong collection 43400, which it takes other taxa from.
