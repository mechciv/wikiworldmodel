changes: >-
  The plants are new: spot a is now a dense sward of full grass tufts instead of sparse cards on sand, and the trees at
  b and c have real leafy, broad-leaved crowns instead of flat umbrella crowns, over a floor of fallen leaves. That
  litter and a brown, gritty soil at a now hide the sand the viewer says the ground is made of, so the substrate item
  moved from drawn to missing-held. The forest is still an open stand of one kind of tree, and the account's lists
  of taxa, water and ground are the same as before; no other verdict moved.
summary: >-
  The viewer still gets the basin floor, the season and some of the animals: level ground ahead, green growth and no
  snow on a mild November morning, a herd of small deer at spot a and a rhinoceros on its horizon. It still lacks the
  forest: open grass at a, and open stands of one broad-leaved tree at b and c, where the floras say a mixed
  broad-leaved forest, and none of the plants on its list is drawn (gen:life/scene). The ground it says is sand is now
  drawn as leaf litter and brown soil. The Dabie hills are missing because a 1° relief answers at 17 Ma, and the scene
  has no water, so the alligator, turtles, beaver and carp it lists have nowhere to be.
