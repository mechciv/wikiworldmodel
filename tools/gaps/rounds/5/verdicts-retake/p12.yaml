findings:
  - >-
    Still no town: the scene's account has no city at any spot, as in the first take. The cause stands: Khiva has one
    figure on Chandler's list, for 1800, which gen:people/settlement holds for only 50 years either side.
  - >-
    The atlas still places stand-ins from far off: proboscideans at every spot, and now bovids at b; shearwaters (Puffinus)
    and a midge (Chironomus) at b and c, and petrels (Pterodroma) at c.
