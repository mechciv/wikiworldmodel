changes: >-
  Almost nothing changed. The frames are still bare tan desert dappled by cloud shadows. The cloud shadows lie where
  they did, and the dry channel with its line of conifers and bushes has moved a little, so at b it now runs down the
  left of the frame. The comb-striped shadows of b are gone. The account is the same: no city, 860 houses in hamlets
  and herders' camps at a and b and 1,300 at c, now with bovids placed at b. No verdict moved.
summary: >-
  Still no town. From 300 m over the garden quarter of a walled town in an irrigated oasis, the viewer draws bare tan
  desert at every spot, with a thin line of conifers and bushes along a dry channel and a few far clusters of specks,
  which are hamlets and herders' camps. Khiva's only figure on the cities' list is for 1800 and is held only to 1850,
  so gen:people/settlement draws no town in 1890. The oasis itself is not held, so the climate's desert stands in for
  it. The flat ground and its silt are right; the polity is the Russian Empire, where the Khan still ruled.
