changes: >-
  Still no town. The viewer's account is the same as in the first take: no city, and 48,250 houses in 864 farming
  villages, with the same round thatched huts on the skyline at a and b. What changed is the ground. The sparse green
  tufts on bare sand are now a dense, straw-green cover of tussock grass and leafy herbs, with pale gritty sand showing
  through at b and c and leaf litter under the trees at a; the trees now have open, leafy crowns. No verdict moved.
summary: >-
  No town is drawn, for the same reason as before: gen:people/settlement reads Kanchipuram's figures in the cities'
  list as a silence in 1285, so the scene has farming villages of round thatched huts in open woodland and rank
  grassland, and no street, court house, shrine or tank. The flat plain, the bright dry January morning, the pale
  gritty sand, the lack of a towering gateway and the Pandyas' rule are right. The largest gap is still the missing
  town; behind it are no tradition for the houses of 1285, no tanks, no palms and no cattle.
