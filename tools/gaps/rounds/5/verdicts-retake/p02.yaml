findings:
  - As in the first take, the canvas (1600 × 788) is narrower than the disc at 2.6 Earth radii, so the Rheic, Gondwana's
    shelf sea and most of Siberia fall outside the frame for that reason, not for anything the world lacks.
  - The Zachełmie trackways marker still stands in open dark sea some 300 km from the nearest drawn coast; with the
    coast outlines gone and the deep water now near-black, it reads even more plainly as a land site drawn at sea.
  - The new cloud band sits over the point itself, so the items the brief places at the point (the deltaic coast, the
    forest, the Pechora shelf) are now judged through gaps in the cloud. That is a fair picture of an equatorial
    afternoon, but a survey that wants the ground at the point may want a frame with clouds off as well.
