changes: >-
  The globe is redrawn as from a satellite, and the geography under it is unchanged: the coasts have lost their white
  outlines, deep water is a dark navy, the shelves a clear teal with bright turquoise reef speckle along every warm
  shore, the land carries a fine relief texture, and the clouds are a dense, ragged white band in place of a soft
  haze. The cloud band now lies right over the point and the shelf east of it, so those are seen through gaps. The
  viewer's account is the same word for word. No verdict moved: North America's interior is still dry land and a tan
  desert.
summary: >-
  The frame's main lines are still right, and read more clearly: one large continent in the middle and south-west
  with the point on its north-eastern coast, teal shelf sea deepening to a dark ocean in the east, reefs flecking
  every warm shore, green land round the point, no ice, and a thick cloud band near the equator. What it gets wrong is
  still North America, whose interior is drawn as dry land, green and a broad tan desert, where an epicontinental sea
  covered it (field:earth/elevation). What it lacks is still the sea's own detail: dark starved basins, brown water
  off deltas and pale evaporite lagoons, which nothing in the world colours the sea by.
