summary: >-
  A bright May noon, rightly, and now a hill country, but still not the view the place commands: the camera stands on
  a hillside at 443 m looking down a valley to the Aegean and Kerinthos, and the viewer draws a wood of tall,
  spire-shaped conifers and broadleaves on leaf litter, on ground that now rolls (366 m at a, from the survey's
  1.8 km cells) but shows no sea, no valley floor with a river, and no mountains ahead. The people are still herders'
  camps at two spots and farmsteads at the third, and neither their flocks nor a ripe field is in sight. The relief is
  better and the sea is still not seen; whether that is the survey cells' smoothing of the slope or the near trees and
  hills closing the view, the frames do not settle.
