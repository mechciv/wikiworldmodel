findings:
  - >-
    The relief now reaches the scene, and the frames are a hill country rather than a level wood: 368 m at a, 277 m at
    b, 416 m at c, where the first take had 214 to 286 m and a flat floor. The camera's 443 m hillside (SRTM, 30 m) is
    still drawn 75 m low at a, as the survey's 1.8 km cells average a steep slope. The view the brief expects, down
    300 m in 4 km to the valley floor with the sea on the left and mountains of 900 to 1,100 m ahead, is still not in
    any frame: at a the open view is on the right, at b it is blocked on the left by hills, and at c the ground rises
    ahead. Whether c's rising ground matches the survey, which would have the land falling east, was not checked.
  - >-
    The way of life still changes between spots 1.9 km apart: herders' camps at a and c (80 houses), scattered
    farmsteads at b (81 houses). The lifeways model takes herding where the anthrome is woodland, so most of a
    well-peopled Archaic Greek valley is drawn as herders' country.
  - >-
    The Holocene list still has Dihoplus, a rhinoceros of the Miocene and Pliocene, from one row 2,070 km off, and
    dolphins, a porpoise and a turbot for a hillside; none is placed.
