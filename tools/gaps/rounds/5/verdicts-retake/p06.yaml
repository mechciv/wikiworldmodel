findings:
  - >-
    One number still decides the frame: the climate field's driest month here is 3.7 mm under the monsoon-forest line
    (margin -3.67), so a place with rain 2.7 times the arid threshold is classed savanna and drawn as open woodland
    over bare ground. The new plant bodies make the trees look more like real trees, which makes the wrong cover the
    more convincing.
  - >-
    The scene's labelled animals are still mostly of the pampas, carried from 1,370 to 2,200 km south: Panochthus,
    Plaina, Platygonus, Abrothrix, Akodon, Ctenomys, Microcavia and Prodaedicurus carry labels in the frames. None of
    the list's plants (Cassia, Acacia, Copaifera, Terminalia) is placed.
  - >-
    The scene's ground now stands 50 to 65 m below the height the viewer's account gives for the place (250 m), since
    it takes the carried relief below the grid (the account's shape: field:earth/relief-carried, share 0.975, held false). The two heights
    are reported side by side and disagree.
