changes: >-
  The ground now rolls gently instead of lying dead level, and stands lower: the eye is at 186 to 200 m (floor 185 to
  198 m) against 245 to 255 m before, nearer Pucallpa's 145 m, from the carried relief below the grid. The trees are
  now grown as skeletons with leaves, the herbs come in patches of yellowed fern-like fronds, and the mud is drawn as a
  scanned ground with leaf litter at b and c; but it is the same open savanna of evenly spaced trees over bare ground,
  from the same savanna class, list and substrate. No verdict moved.
summary: >-
  The viewer still gets the lie of the land and the empty human world right: a low, now gently rolling lowland with no
  mountain on the skyline, and no people. What it draws on it is still an open savanna of evenly spaced, round-crowned
  trees over bare mud and leaf litter, where the reviews put closed terra firme rainforest; the climate field's driest
  month misses the monsoon-forest line by under 4 mm, and that tips the whole frame. There is still no river, so the
  caimans the atlas lists here are not placed, and the list still carries a specialised giant caiman past its time.
