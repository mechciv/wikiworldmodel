# Round 5's verdicts for p07, judged again on the new build: a slope at about 4,390 m above the Coposa basin on the Chilean Altiplano, eye level facing west, 10:00 in April of 10.9 ka.
author: machine:claude-code
judged: "2026-11-23"
build: 3b9f48adb1090be2
changes: >-
  The clip at 3,200 m is gone: the scene now keeps each grid's heights as steps above a base, and the eye stands at
  4,460, 4,698 and 4,255 m over floors of 4,443, 4,694 and 4,243 m, where the first take had all three at 3,201.7 over
  a floor of 3,200. So the frames are now of steep, rough mountain ground. They do not show the brief's view, though:
  at a and c a near slope rises across the view and hides everything beyond, and at b a slope runs down to the right
  to a flat tan floor. The plants are now straw-coloured leafy herbs, where the first take had green tussocks. With real
  heights the scene's snow line (4,251 m) reaches the ground, so snow lies among the shrubs at b and a smooth white hill
  stands at the left of a: ice-snow-on-peaks moved from untested to wrong. No other verdict moved.
summary: >-
  The heights are now right, within some 50 m of the survey at the camera, and a clear, deep-blue morning with hard
  light and straw-coloured plants is close to the Altiplano in April. But the view is not the brief's. At a and c a
  near slope rising across the view hides the basin, the salar and Cerro Napa; at b a slope runs down to a flat floor
  off to the right. The scene's snow line at 4,251 m whitens slopes the brief has bare. What grows is still not tola
  and bunchgrass, the atlas still fills the slope with lowland animals, and the foragers' camps are rightly kept out of
  the frame.
