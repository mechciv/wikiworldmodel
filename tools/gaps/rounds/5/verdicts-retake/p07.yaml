findings:
  - >-
    The 3,200 m clip is fixed. encode in world/generators/life/scene/v12.ts now stores each grid as whole steps above
    a base, with the step (0.1, 0.25, 0.5 or 1 m) as fine as the grid's range allows. Here the fine and middle grids
    span about ±560 m and ±775 m around their base, where in the first take every cell stood at the 32,000 ceiling.
    The scene's floor at a is 4,443 m, 51 m above SRTM's 4,392 m at the point and 216 m above the 4,227 m of the
    tenth-of-a-degree relief, so the scene now reads the survey's finer cells (shape: field:earth/relief, held).
  - >-
    The view no longer has the brief's shape. Facing 280°, where SRTM has the ground falling some 300 m in the first
    2 km, the near ground at a and c rises across the view and hides the horizon. The scene adds ground of its own
    below the survey's one-sixtieth-of-a-degree cells (inventedFor and landAt in v12.ts). I did not trace whether these
    slopes are that invented ground or the survey's cells.
  - >-
    With the heights right, the snow line the scene gives (4,251 m in April) now whitens slopes at 4,450 to 4,700 m,
    which the brief has bare of snow below Cerro Napa's 5,140 m summit. Every high scene in a dry range will show the
    same.
  - >-
    The atlas still carries the lowlands up the mountain, the same list as the first take: capybara, potoo, cuckoo,
    guinea pigs, armadillos and a bat are placed on a desert slope at 4,400 m. The foragers' works still include 'A boat'.
