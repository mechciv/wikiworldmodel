  note: >-
    Kept: Lu et al. 2009 (PMC), the Simin yueling, Hou Hanshu chapter 7 and the commanderies treatise (Jijie edition),
    the Hanshu's treatise of geography, the Shuijing zhu chapter 10 (used only in a note), Liu and Reid 2020 (PLOS),
    Zhang et al. 2022 and Chen et al. 2012 (PMC), the abstract page of Kidder et al. 2012 (Cambridge), and Wikipedia's
    Taihang, Wu'an and Handan pages. Removed: a 2018 starch paper on millet domestication that says nothing of the
    Han. Failed: two Wikisource page names I guessed wrongly, PMC's pages for two articles (a browser check, after
    many fetches from this machine), Europe PMC's full-text service (error 500) for the same two, and Semantic
    Scholar's search (rate limit, not counted). The longest search, without result, was for a dated Han-period vegetation record
    or a Han settlement near Cishan. Two of my first fetches went into another researcher's folder through a shared
    helper script; I moved them to mine.
