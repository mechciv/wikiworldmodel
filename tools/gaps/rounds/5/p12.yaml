effort:
  fetched: 17
  cited: 7
  failed: 8
  note: >-
    Nine texts are kept: MacGahan (1874), Lansdell (1885, vol. II), Burnaby (1876), Vámbéry (1864) and Grierson's
    gazetteer (1884), all from the Internet Archive's OCR text; the Britannica of 1911 on Khiva town and khanate from
    Wikisource; UNESCO's Itchan Kala page through the Wayback Machine; and Wikipedia's Islamkhodja Madrasah page, used
    only in a note for the date of the Islam Khodja minaret. Eight fetches failed: gutendex.com (the Gutenberg
    catalogue, no answer), Wikisource's 1911 'Khiva' page under a wrong title, directly and through the Wayback
    Machine, UNESCO directly, Wikipedia's Islam
    Khoja Minaret page directly and through the Wayback Machine (not found), and the Overpass API twice (no answer),
    so the line of the outer wall could not be drawn from OpenStreetMap; Nominatim gave the gates of the inner town and
    the village of Shixlar. Moser's book (in French) was not looked for. Most of the time went to reading the four
    travellers for what a view from above the western quarter would show.
