# Round 5's verdicts for p12: 300 m above the western garden quarter of Khiva, facing south, 10:00 in October 1890.
author: machine:claude-code
judged: "2026-11-22"
summary: >-
  No town is drawn. Seen from 300 m over the garden quarter of a walled town in an irrigated oasis, the viewer draws bare
  tan desert at every spot, dappled by cloud shadows, with a line of conifers and bushes along a dry channel and a few
  far clusters of dark specks, farming hamlets and herders' camps. Khiva's only figure on the cities' list is for 1800,
  held to 1850, so gen:people/settlement draws no town in 1890; and the oasis itself, its fields, gardens, canals and
  trees, is not held, so the climate's desert stands in. The flat ground and its silt are right; the polity is the
  Russian Empire where the Khan still ruled.
