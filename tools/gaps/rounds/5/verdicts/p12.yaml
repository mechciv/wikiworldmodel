findings:
  - >-
    Why no town. Chandler's list (people/cities.json) has one figure for Khiva, 20,000 in 1800. gen:people/settlement
    holds a city's figure 50 years either side of its year (record_hold) and no further, so Khiva is drawn from 1750 to
    1850 only; in 1890 the scene's account has no city and 860 houses in hamlets and herders' camps. The sampler drew
    the point by that 1800 figure (its stretch runs 1824-1950), as at p10.
  - >-
    The atlas's list is of fossils 950 to 2,130 km away: petrels and shearwaters, which are placed at c, a diamondback
    terrapin (Malaclemys), a river dolphin, Indian trees; and the proboscideans' stand-in is placed at every spot, so
    the scene of Khiva in 1890 has elephants.
  - At b the trees by the dry channel cast shadows striped like a comb, a fault of the shadow maps.
