findings:
  - "The brief caught a misplaced Paleobiology Database row: collection 107496 (Albian, marine indet., claystone) sits at 38.00N 79.77W, 80 km from the spot in the Valley and Ridge, but its own fields name the Puddledock pit in Prince George County, Virginia, some 220 km east, where two other collections put terrestrial Patapsco beds. An overlay could move it; until then it may lend a marine Albian rock to this upland."
  - "The atlas's seven taxa recorded here are leaves of one 1889 collection near Richmond, in the lowland 190 to 280 km east and across the drainage divide of the time: the upland is given the coastal plain's flora (model:life/atlas)."
  - "The life layer's tier reads unknown, saying the atlases reach only the Phanerozoic, at 104.9 Ma, while the scene has a list of seventeen taxa and the panel says 7 recorded here, 3 nearby, 7 stand-ins: the resolver's answer for life (core/resolve.ts) disagrees with the scene. The same happens at p04."
