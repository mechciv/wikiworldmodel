summary: >-
  The viewer gets the setting right: dry land on an upland (943 m on the globe, 750 to 800 m in the scene), no sea, no
  river, a humid climate, and the substrate now names the rock under the ground, a Pennsylvanian sandstone from the
  column. What it draws on that ground is less right: at two spots a woodland of tiered conifers and round-crowned
  broadleaf trees mixed stem by stem over bare tan earth, at the third open ground of low fronds; the flowering plants
  are tall generic trees, not shrubs in patches, and no animal but four small ornithischians is in sight. The plant
  list itself is lowland leaves from 190 to 280 km away across the drainage divide.
