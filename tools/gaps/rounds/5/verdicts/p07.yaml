findings:
  - >-
    The scene clips its heights at 3,200 m. It stores them as decimetres in 16-bit integers and caps them at 32,000
    (encode in world/generators/life/scene/v9.ts); here the fine and middle ground grids are 32,000 in every cell, and
    the eye stands at 3,201.7 m over a floor of 3,200 m where the build's ground is 4,227 m. Every scene above 3,200 m,
    the Altiplano, Tibet, the high Andes and the Ethiopian highlands, is drawn as a level plain at 3,200 m, and its lakes,
    snow and far relief cannot show. It is the root of six of this point's gaps.
  - >-
    The ground is the same 4,227 m at all three spots, 2 to 2.7 km apart and on two different scene sites: one cell of
    the tenth-of-a-degree relief, about 165 m below the camera's 4,392 m by SRTM.
  - >-
    The atlas carries the lowlands up the mountain: capybara (Hydrochoerus), a potoo, a cuckoo, guinea pigs, armadillos
    and a bat, from rows 630 km off, are placed on a desert slope at 4,400 m; a porpoise and three river dolphins
    (1,870 to 2,070 km), the matamata turtle and the gomphothere Notiomastodon are listed and not placed.
  - The foragers' works include 'A boat', on a slope 13 km from the basin's lake.
