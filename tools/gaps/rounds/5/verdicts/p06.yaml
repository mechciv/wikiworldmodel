findings:
  - >-
    One number decides the frame: the climate field's driest month here is 3.7 mm under the monsoon-forest line
    (margin -3.67), so a place with rain 2.7 times the arid threshold is classed savanna and drawn as open umbrella
    trees over bare mud. A class this close to its edge could carry the spread of the climate, or draw a transition,
    rather than flip the whole cover.
  - >-
    The scene's animals are mostly of the pampas, carried from 1,370 to 2,200 km south: glyptodonts (Plaina,
    Panochthus, Glyptodon, Prodaedicurus), tuco-tucos (Ctenomys), cavies (Microcavia) and Andean mice (Akodon,
    Abrothrix) are placed and labelled in an Amazonian lowland. None of the list's plants (Cassia, Acacia,
    Copaifera, Terminalia) is placed; every tree is a generic flowering-plant body.
  - >-
    The viewer has the ground 250 m up at all three spots (the eye at 245 to 255 m), against 145 m at Pucallpa's
    gauge today in a basin that has been filling since; a flat frame cannot show it.
