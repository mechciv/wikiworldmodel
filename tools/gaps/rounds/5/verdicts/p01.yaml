findings:
  - "The frames failed to draw a place. world/generators/life/spec.ts (placeSpec) returns no scene where neither atlas has a list, and both reach only the Phanerozoic, so every eye-level view before 538.8 Ma falls back to the globe's texture seen from 15 m: a blur with no horizon and no sky. An eye-level view in the Precambrian needs a scene of bare ground (and sea) with no list. Owner: gen:life/scene."
  - "The three spots (1 and 2.6 km apart, headings 180, 161 and 177 degrees) give near-identical frames: the globe's picture at this height does not change over a few kilometres or 20 degrees of heading."
  - "The globe draws the spot as land (grey-brown), with blue patches outlined in white nearby; the brief says nothing read tells whether it was land, shore or sea floor then."
