findings:
  - >-
    Why no town. Chandler's list (people/cities.json) gives Kanchipuram 70,000 to 1118, 50,000 in 1150, then 35,000 in
    1800. gen:people/settlement holds a figure 50 years either side (record_hold) and joins two only when they are no
    more than 600 years apart (record_gap); 1150 to 1800 is 650, so from 1200 to 1750 the town has no people and is not
    drawn. The scene's account has no city ('cities' empty) and 48,250 houses in 864 villages instead. The sampler drew
    the point by the same list's 1150 figure without that rule, so it sends the survey to towns the viewer does not draw.
  - >-
    The list is of fossils of the whole Holocene, 220 km off: montane plants (Strobilanthes, Impatiens, Ilex, Valeriana,
    Gordonia) and a Ganges river dolphin (1,960 km); none of them is placed. The stand-ins for pigeons, ants and
    proboscideans are, so elephants are placed in the scene among the villages.
