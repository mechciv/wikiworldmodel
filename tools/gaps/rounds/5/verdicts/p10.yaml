summary: >-
  No town is drawn. The point was drawn by Kanchipuram's weight in Chandler's list, but the settlement generator reads
  that list as a silence in 1285, so the scene has 864 farming villages of round thatched huts in woodland and dry
  plots, and no street, court house, shrine or tank. What it gets right is the flat plain, a bright dry January
  morning, no towering gateway, and the Pandyas' rule. The largest gap is the missing town, owned by
  gen:people/settlement's reading of the cities' lists; behind it, no tradition for the houses of 1285 and no living
  flora or animals.
