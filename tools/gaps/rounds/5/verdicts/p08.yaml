findings:
  - >-
    The frame's whole layout is lost. The brief's camera stands at 443 m and looks down 300 m in 4 km to a valley floor,
    the sea on the left and mountains of 900 to 1,100 m ahead; the viewer's ground is 275 m for all three spots, and the
    eye stands at 214 to 285 m on level ground in a wood. Only at a's right edge does a faint far ridge show, where the
    Kandili side should be. The same gap as round 1's Safed Koh and Nubian hills.
  - >-
    The way of life changes between spots 1.9 km apart: herders' camps at a and c (74 houses, a herder's tent), scattered
    farmsteads at b (93 houses). The lifeways model takes herding where the anthrome is woodland, so most of a
    well-peopled Archaic Greek valley is drawn as herders' country.
  - >-
    The Holocene list has Dihoplus, a rhinoceros of the Miocene and Pliocene, from one row 2,070 km off, and dolphins,
    a porpoise and a turbot for a hillside; none is placed.
