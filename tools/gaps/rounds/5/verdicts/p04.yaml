findings:
  - "The camera is under the sea. scene.sea is true and the eye stands at -39, -30 and -33 m over a floor at -337, -329 and -329 m: about 300 m above the floor, which is the link's d of 600 m taken along a view tilted 60 degrees from straight down. The brief reads it as 600 m above the water. Over any sea deeper than about 300 m an aerial view of this kind is drawn from inside the water, as a blue gradient. Owner: renderer (the camera over the sea)."
  - "A sea scene with the land's list: scene.sea is true but scene.list is land. world/generators/life/spec.ts (placeSpec) takes the land atlas's list whenever it has one and the sea's only where the land's has none, so this shelf carries brontotheres, odd- and even-toed ungulates, rodents, primates, a hyaenodont, flowering plants, a freshwater gar (Lepisosteus) and a ramshorn snail (Planorbis), all from 220 to 2,080 km off. Owner: gen:life/scene."
  - "The world's floor here is 313 m (globe) to 337 m (scene) deep, where the nearest well on the same hinge has a shallow subtidal limestone; the brief cannot say the depth at the spot, so this is a question, not an error."
  - "The life layer's tier reads unknown, saying the atlases reach only the Phanerozoic, at 43.5 Ma, while the panel says 7 recorded here, 29 nearby, 1 stand-in (as at p03)."
