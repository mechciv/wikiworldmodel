summary: >-
  The viewer rightly has sea here, not land: the scene says sea, with the floor 313 m down on the globe and 330 m in
  the scene, at 3 degrees north. But it puts the camera inside the water: the link's 600 m is taken along the view, so
  the eye stands 300 m over the sea floor and 30 to 39 m under the surface, and every frame is a plain blue gradient
  with no surface, horizon, sky or floor. Under it the scene carries the land atlas's list (brontotheres, rodents,
  flowering plants, a freshwater gar and snail) where the sea atlas has the shelf's larger foraminifera and coralline
  algae.
