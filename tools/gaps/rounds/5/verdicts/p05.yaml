findings:
  - Every view of this round, this one included, has the life layer answering "unknown" with "the atlases of who lived
    where reach only the Phanerozoic", at 17 Ma, where the scene lists 46 taxa from the atlas. The tier the panel or
    the shooter reads for life is wrong across the round.
  - The atlas's list for this patch takes some taxa of the Sihong collection 43400 (256 km, Burdigalian) and leaves
    out others in it, Anchitherium and both pliopithecoids among them. Whatever caps or filters the list drops the
    animals the brief most expects.
