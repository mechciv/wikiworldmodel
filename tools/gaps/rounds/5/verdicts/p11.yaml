summary: >-
  The brief stands a little above the waves; the viewer, asked for eye level at sea, puts the camera on the floor
  3.2 km down and draws a sunlit, rippled sand bed as if in shallow water. So the depth is right and no land, ice or ship
  is drawn, as the sources say, but the sky, the sea's surface and the March weather that make up most of the brief
  cannot be tested. The sea atlas places sea otters and sea lions 290 km from the nearest shore.
