findings:
  - >-
    An eye-level view at sea is a view of the sea floor. The link asks for 15 m above the sea, and at all three spots the
    viewer sets the eye 1.7 m above the bed at 3,200 m (drawn.json, scene.eye), so no frame shows the surface, the sky
    or anything that lives in the air. Seven of the brief's fifteen items could not be tested for that reason alone;
    a round that samples the sea needs a camera on the surface, or the viewer one to offer.
  - >-
    The floor 3.2 km down is drawn as a shallow bed: pale sand with ripples, lit from above, under blue water that
    brightens toward the bottom. No daylight reaches that depth; the floor should be dark. The scene also leaves
    its month unset at sea (scene.month null).
  - >-
    The sea atlas's list for this patch is of the region only, 1,170 to 2,050 km off: sea otters, a California sea
    lion, an albatross and two beaked whales. It places the otters and sea lions in mid-ocean, where they do not go.
