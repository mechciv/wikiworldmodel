findings:
  - The plots' colours are fixed in the renderer (viewer/src/gl/cityShaders.ts, plots()) at four tenths ripe, about a
    third green, the rest ploughed or fallow, in every month and for every crop. June here happens to look right; the
    same mix will be drawn in January and for rice.
  - The farmland is drawn as discs round each hamlet with untilled wooded grass between them, where a commandery of
    some seven hundred thousand people would more likely farm the terrace tops continuously.
  - The scene reports an observed river, but it is a GRWL reach some 22 km off by the scene's focus, probably not the
    Ming; the Ming itself, too narrow for GRWL, is not drawn.
