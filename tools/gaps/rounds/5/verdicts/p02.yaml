findings:
  - The canvas (1600 × 788) is narrower than the disc at 2.6 Earth radii, so the cap's top and bottom, some 35° from the
    point, are cut off. Three of the brief's items (the Rheic, Gondwana's shelf sea, most of Siberia) fall outside the
    frame for that reason, not for anything the world lacks.
  - The Zachełmie trackways marker, a tidal-flat site, stands in open deep-blue sea some 300 km from the nearest drawn
    coast, with Prague near it. Its age is Eifelian, older than this frame, so it may be the marker's time window rather
    than the map; but a site of land animals' tracks drawn far out at sea is worth a look.
