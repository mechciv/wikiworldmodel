# Round 5's verdicts for p02: the Late Devonian (Frasnian) from orbit, over the Kanin–Timan coast of north-eastern Baltica.
author: machine:claude-code
judged: "2026-11-22"
summary: >-
  The viewer gets the frame's main lines right: one large continent in the middle and south-west with the point on
  its north-eastern coast, pale shelf sea deepening to the east, reef flecks along every warm shore, green land round
  the point, no ice, and a cloud band near the equator. What it gets wrong is North America: its interior is drawn as
  dry land, green and a broad tan desert, where an epicontinental sea covered it (field:earth/elevation). What it
  lacks is the sea's own detail: dark starved basins, brown water off deltas and pale evaporite lagoons, which
  nothing in the world colours the sea by.
items:
