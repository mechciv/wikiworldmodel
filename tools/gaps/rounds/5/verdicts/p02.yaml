  geography-rheic-narrow: { verdict: untested, spots: { a: untested }, owner: "field:earth/elevation", why: "The canvas cuts the disc off about 35° south of the point, before Gondwana's edge; central Europe (Prague, the Zachełmie marker) is open sea within the frame, and whether it narrows to a strait beyond is out of sight." }
