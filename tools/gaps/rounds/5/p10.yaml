  note: >-
    Eight texts are kept: Buchanan's journal of 1800 (the one eyewitness description of the town before modern times
    that could be read), the Imperial Gazetteer's vol. X, Crole's Chingleput manual of 1879, Yule's Marco Polo, and
    four Wikipedia pages (Kanchipuram, the Ekambareswarar and Kailasanathar temples, and Maravarman Kulasekara I,
    the last two used only in notes). Failed or dropped: a first scan of the gazetteer's vol. X whose OCR was cut off
    before Chingleput; Nilakanta Sastri's History of South India (one scan refused with 401, another with the
    political chapters missing) and his Colas vol. II (OCR unreadable); Wikipedia's Vegavathi River page (404). The
    spot was placed with OpenStreetMap through Overpass and Nominatim, which are not cited. No source of the thirteenth
    century describes the town's streets or houses; the nearest in time is Marco Polo, of the Pandya coast about
    1292. Most of the time went into the history and into finding what lies north of the spot.
