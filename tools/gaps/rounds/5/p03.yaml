effort:
  fetched: 18
  cited: 8
  failed: 4
  note: >-
    18 fetches, 10 texts kept, 8 cited (plus two PBDB collection listings used in a note). Not reached: Fontaine's
    1889 monograph (pubs.usgs.gov, HTTP error), a Bowdoin thesis on mid-Cretaceous Appalachian cooling (HTTP error), the
    abstract of Jess et al. 2022 "Why are the Appalachians high?" (Semantic Scholar holds none, and a first search there failed; Elsevier closed). A Europe PMC search found the Goddard tracks paper.
    A second Doyle & Upchurch copy, a review on recognising Early Cretaceous angiosperm clades and a 2015 GSA abstract on Potomac paleosols in New Jersey gave nothing new and were deleted. The
    time went to the point's premise: the atlas's "recorded here" taxa are a lowland collection across the divide,
    and the build's only rock row near the spot is a misplaced Puddledock collection labelled marine.
