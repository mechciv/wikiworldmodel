  note: >-
    Not reached: Megirian and others 2004 (Kangaroo Well: the only temperature and rainfall estimate for central
    Australia at this time; publisher refused on two hosts), Myers 2017 on the White Hunter Local Fauna (PeerJ refused),
    Travouillon and others 2009 on Riversleigh's palaeohabitats (HAL gave a stub), Callen and Tedford 1976 (a scan with
    no text layer), the Lake Palankarinna heritage assessment, the 2026 Obdurodon paper and a Bioregional Assessment
    stratigraphy page. Alley 1998 and Martin 1990, the primary accounts of the basin's Oligocene-Miocene environments
    and pollen, are behind paywalls and are cited here only through Mather 2021 and Martin 1998. Longest: finding
    anything said of this ground itself; the two 1964 BMR reports are the only local sources, and they date nothing
    in years.
