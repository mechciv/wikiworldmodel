effort:
  fetched: 18
  cited: 7
  failed: 15
  note: >-
    Thirteen texts are kept (seven cited; Wikipedia's Gandamak, Sikaram and Hisarak pages for coordinates, the Bannu
    report and the Iranica flora and fauna articles are used only in notes or not at all); five more that were read
    gave nothing of use (two wrong papers, a review of later millennia, a landing page, a Wikipedia climate page
    that copies the Britannica) and were removed. Fifteen attempts failed: iranicaonline.org and gutenberg.org
    directly (both then read through the Wayback Machine), ecoregions.worldwildlife.org, uni-marburg.de directly,
    mdpi.com, core.ac.uk, journals.ed.ac.uk and journals.uclpress.co.uk (a bot wall; the Bannu project's articles),
    and one Cambridge address I guessed wrongly. The longest search, without result, was for any dated evidence of the
    fifth millennium BCE, of plants or of people, within 100 km of the point.
