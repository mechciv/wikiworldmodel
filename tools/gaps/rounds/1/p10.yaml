effort: { fetched: 27, cited: 12, failed: 7, note: "27 addresses tried; 17 source texts read, 12 of them cited. Failed: gutenberg.org (three addresses refused; its mirror and the Avalon Project served instead), core.ac.uk and HAL for Massé 2008 (read from Archimer), and two addresses for Kaplan and others 2009, which was not read. Not tried because closed: Holzhauser and others 2005. Longest: finding readable sources for the states of 1090; the scans of Lane-Poole and Freeman are rough, so their quotes skip garbled words and page furniture with an ellipsis. No item is given for the light: at 15:00 in December the sun is low in the south-west at the centre of the disc and its north-east is in night, which is geometry from the view link and not from a source." }
