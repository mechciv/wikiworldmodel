  note: >-
    Read and kept: Deflers 1889, Manzoni 1884, Bury 1915, Harris 1893, Niebuhr (1792 translation, vol. 1), the
    Admiralty's Handbook of Arabia vols. I and II, Sandgrouse 4, two papers on spate irrigation and one on recent
    farming in the wadis Zabid and Rima. Not reached: an MDPI paper on the Wadi Zabid's water (refused), the 1946
    Naval Intelligence handbook Western Arabia and the Red Sea (refused), a Durham thesis on Yemeni houses (timed
    out) and the MIT photograph record (refused). No station climate for Zabid was found in a citable form.
    Harris's and Niebuhr's scans were too broken to quote. Longest: finding that Deflers rode from Hès to Zebid
    past this point in August 1887, and reading his French and Manzoni's Italian for the passages.
