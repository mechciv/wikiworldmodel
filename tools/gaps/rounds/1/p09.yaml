effort: { fetched: 14, cited: 5, failed: 17, note: "Fetched counts text files kept and read (11 works; the CMS report is four files). Could not reach: HAL and OpenEdition (a bot check, not worked around: all of Dupuy's papers on the engravings and the Encyclopédie berbère), the IRD's Horizon library (access suspended: Bernus on the Tamesna, Paris on the Azawagh), Wiley, CORE, the British Museum's rock art pages (certificate error), WWF, an Egyptian journal, and gutenberg.org itself (Chudeau was read from its mirror). Cambridge gave a summary only and USGS a different page. Finding any readable account of the fifth century here took longest; most of the scene rests on one traveller of 1905 to 1909." }
