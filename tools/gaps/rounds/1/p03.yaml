effort:
  fetched: 21
  cited: 8
  failed: 8
  note: >-
    Twenty-one fetches; thirteen gave a text that could be read, eight of them cited. Refused: the Smithsonian
    repository (three papers by DiMichele and others on Early Permian floras), core.ac.uk (three, among them Counts's
    thesis on the Council Grove soils and Falcon-Lang's 2015 paper on a seasonally dry Permian coast) and sepm.org (a
    certificate error); the Sedimentary Record's page gave only a cookie notice. Read but not cited: Kansas Geological
    Survey Open-file Reports 94-23 and 89-20, the 2002 abstract on the Speiser pond, the Paleobiology Database's
    Sakmarian occurrences for the area, and the Survey's page on fossil insects. The longest part was the vegetation:
    nothing on the plants of the Kansas beds themselves could be read, so the plant cover rests on abstracts from New Mexico.
