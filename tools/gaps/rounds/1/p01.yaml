effort: { fetched: 17, cited: 9, failed: 5, note: "Read and not cited: Holland 2006, Kopp et al. 2005, Millikin et al. 2024, Bekker et al. 2001, Evans et al. 2002, Arney et al. 2016, O'Malley-James & Kaltenegger 2018, Rugheimer & Kaltenegger 2018. Not reached: Humbert et al. 2017 on the Hekpoort paleomagnetism (HAL answered with a bot check, core.ac.uk with an error), Beraldi-Campesi 2013 (SpringerOpen client challenge), Lenton & Daines 2017 (Wiley refused), a Hekpoort paleosol PDF at msu.edu (certificate error). Rasmussen et al. 2013, the first publication of the 2256 ± 6 Ma tuff age, is behind a paywall and is cited only through Poulton and Gumsley. What took longest: finding anything dated to this stretch at all; nearly every statement of this date comes from one basin in South Africa." }
