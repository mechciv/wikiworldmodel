  note: >-
    Not reached: the first description of Amazonsaurus (Carvalho, Avilla & Salgado 2003; doc.rero.ch refused), and
    its Portuguese abstract came with too little clean text to cite. Lindoso, Maisey & Carvalho (2016) on the
    fishes, Bobco et al. (2023) on the Coroatá core's facies and Mendes (2007) were found only as others report
    them. Read and not cited: Eneas et al. (2022), Rossetti et al. (2004) and Paz & Rossetti (2006) on the Codó
    farther west, Brito et al. (2016) on a gar, Lindoso et al. on the new Brejo sites, Rabelo & Nogueira (2015) on
    the Corda desert (Jurassic, 400 km off), Wikipedia on Amazonsaurus, and the PBDB occurrence list. What took
    longest was finding that the nearest core is 15 km from the point, and that the rocks are younger than the view.
