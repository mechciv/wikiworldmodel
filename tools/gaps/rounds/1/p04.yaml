    reach: region
    source:
      cite: "Machado, L.L., Barros, C.L., Rios-Netto, A.M., Sames, B., Silva, S.C., Mendonça Filho, J.G., Mendonça, J.O. & Marques-Lima, D. (2025). Biostratigraphy and paleoenvironmental characterization of the Lower Cretaceous Codó and Itapecuru formations (Aptian–Albian, Parnaíba Basin, Brazil). Anuário do Instituto de Geociências 48, e67620."
      url: https://www.revistas.ufrj.br/index.php/aigeo/article/download/67620/44140/223172
      text: aigeo-2025-codo.txt
      loc: "section 5.2 Paleoenvironments, interval PI-3, p. 17"
      quote: "Bobco et al. (2023) registered domal stromatolites and microbial mats at this interval, inferring perennial, restrictive and alkaline conditions"
