when: 123.7 Ma
place: >-
  Eastern Maranhão, north-east Brazil (today about 4.04°S, 43.18°W), beside the Parnaíba river in the Parnaíba
  Basin: ground that in the late Aptian was the floor and shore of the salt lake of the Codó Formation.
author: machine:claude-code
expects:
  - id: relief-lake-basin-reached-by-sea
    layer: relief
    what: >-
      Low, level ground: the floor and margin of a wide lake basin, low enough that the sea at times came into the
      lake. No hills or valleys are recorded.
    reach: place
    source:
      cite: "Salgado-Campos, V.M.J., Carvalho, I.S., Bertolino, L.C., Borghi, L., Rios-Netto, A.M., Araújo, B.C., Souza, D.C., Ferreira, L.O. & Bobco, F.E.R. (2022). Unraveling an alkaline lake and a climate change in Northeastern Brazil during the Late Aptian. Sedimentary Geology 442, 106290."
      url: https://igeo.ufrj.br/inc/isc/3/03_118-Salgado%20Campos%20et%20al%20Cod%C3%B3%20paleoenvirn%20paleoclimate.pdf
      text: salgado-campos-codo.txt
      loc: "section 6, Conclusions, p. 16"
      quote: "At the top of the alkaline lake succession, a sudden salinity-increasing event was noted and interpreted as the first relevant marine ingression episode in the Codó Formation."
    note: >-
      The core studied (1-UN-32-PI, 4°4′55″S 43°3′15″W) is about 15 km east of the point. The Codó Formation is
      upper Aptian, some millions of years after the view's 123.7 Ma. The build has this ground 632 m above the sea
      of the time, which a lake the sea could enter contradicts. That the land was level is read from the lake
      deposits, not said by the source in those words.
  - id: water-shallow-salt-lake
    layer: water
    what: >-
      A shallow, very salty, alkaline lake, still and without surf, whose level rose and fell so that stretches of
      its bed were at times left dry.
    reach: place
    source:
      cite: "Salgado-Campos, V.M.J., Carvalho, I.S., Bertolino, L.C., Borghi, L., Rios-Netto, A.M., Araújo, B.C., Souza, D.C., Ferreira, L.O. & Bobco, F.E.R. (2022). Unraveling an alkaline lake and a climate change in Northeastern Brazil during the Late Aptian. Sedimentary Geology 442, 106290."
      url: https://igeo.ufrj.br/inc/isc/3/03_118-Salgado%20Campos%20et%20al%20Cod%C3%B3%20paleoenvirn%20paleoclimate.pdf
      text: salgado-campos-codo.txt
      loc: "section 6, Conclusions, p. 16"
      quote: "allowed the identification of a magnesium-sulfate-rich shallow alkaline hypersaline lake with episodes of subaerial exposure"
    note: >-
      Lower Codó Formation in the core 15 km east of the point; upper Aptian, later than the view's time. The build
      has no water body here. Neither the lake's depth in metres nor how far its shores were is given.
  - id: water-braided-river-phase
    layer: water
    what: >-
      At another stage, sandy braided river channels crossed the dried lake floor, before a lagoon the sea reached
      took its place.
    reach: place
    source:
      cite: "Salgado-Campos, V.M.J., Carvalho, I.S., Bertolino, L.C., Borghi, L., Rios-Netto, A.M., Araújo, B.C., Souza, D.C., Ferreira, L.O. & Bobco, F.E.R. (2022). Unraveling an alkaline lake and a climate change in Northeastern Brazil during the Late Aptian. Sedimentary Geology 442, 106290."
      url: https://igeo.ufrj.br/inc/isc/3/03_118-Salgado%20Campos%20et%20al%20Cod%C3%B3%20paleoenvirn%20paleoclimate.pdf
      text: salgado-campos-codo.txt
      loc: "section 2, Geological settings, p. 4 (reporting Mendes 2007)"
      quote: "The sandstone lithofacies comprises a fining-upward bed of fine to medium-grained sandstone with wavy or flaser bedding (Sa). … a braided fluvial followed by a marine-influenced lacustrine depositional system (lagoon) was interpreted in the upper Codó Formation."
    note: >-
      One sandstone bed about 5 m thick in the same core: a stage of the same ground, not the same moment as the
      lake. The build has no rivers at the point. The source reports Mendes (2007), a thesis that was not read.
  - id: substrate-dark-mud-gypsum
    layer: substrate
    what: >-
      The ground is dark, organic-rich lake mud, split by mudcracks where it had dried, with thin layers and beds of
      gypsum and of limestone in it.
    reach: place
    source:
      cite: "Salgado-Campos, V.M.J., Carvalho, I.S., Bertolino, L.C., Borghi, L., Rios-Netto, A.M., Araújo, B.C., Souza, D.C., Ferreira, L.O. & Bobco, F.E.R. (2022). Unraveling an alkaline lake and a climate change in Northeastern Brazil during the Late Aptian. Sedimentary Geology 442, 106290."
      url: https://igeo.ufrj.br/inc/isc/3/03_118-Salgado%20Campos%20et%20al%20Cod%C3%B3%20paleoenvirn%20paleoclimate.pdf
      text: salgado-campos-codo.txt
      loc: "section 2, Geological settings, p. 4 (reporting Mendes 2007)"
      quote: "The two lutite lithofacies comprise bituminous lutites with mudcracks interlaminated with gypsum and calcite (Ab) … Finally, the two chemical lithofacies include limestone (Ls) and gypsum bedsets (Gy)."
    note: >-
      The rocks of the core 15 km east of the point. "Dark" is read from "bituminous"; the colour of the fresh mud
      and of the salt at the surface is not given.
  - id: substrate-gypsum-sabkha
    layer: substrate
    what: >-
      At the lake's driest stage, a sabkha: a salt flat where a bed of gypsum formed, wetted at times by the sea.
    reach: place
    source:
      cite: "Salgado-Campos, V.M.J., Carvalho, I.S., Bertolino, L.C., Borghi, L., Rios-Netto, A.M., Araújo, B.C., Souza, D.C., Ferreira, L.O. & Bobco, F.E.R. (2022). Unraveling an alkaline lake and a climate change in Northeastern Brazil during the Late Aptian. Sedimentary Geology 442, 106290."
      url: https://igeo.ufrj.br/inc/isc/3/03_118-Salgado%20Campos%20et%20al%20Cod%C3%B3%20paleoenvirn%20paleoclimate.pdf
      text: salgado-campos-codo.txt
      loc: "section 5.5, p. 16"
      quote: "This facies succession was reinterpreted as a marine-influenced sulfate-rich acid sabkha due to the occurrence of the gypsum bed"
