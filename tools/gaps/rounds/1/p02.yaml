  note: >-
    Read and kept but not cited: Pohl et al. (2014, Climate of the Past), whose Ordovician climate model draws all
    land as bare rocky desert under a Sun 3.5 % fainter; Ganti et al. (2019); Ghienne et al. (2023) on the Ennedi
    of Chad; Abuhmida and Wellman (2017); the Niger lexicon's Hasawnah entry; a Ghadames Basin paper in Geologica
    Carpathica; Cosgrove et al. (2024). Not reached: the Durham thesis on the Hawaz Formation (timed out), the full
    text of Gibling and Davies (2012) and of Davies and Gibling (2010), McMahon and Davies's papers on rivers
    before plants (CORE refused), a University of Barcelona thesis, a Libyan Journal of Science paper (a PDF the
    script could not read), the glendonite preprint on cold Tremadocian sea floors (bioRxiv refused), and anything
    on the Tremadocian of Tunisia (Sanrhar Formation) or of Sicily and Calabria. Finding where the point is today
    took longest: it was done by rotating the build's PALEOMAP polygons.
