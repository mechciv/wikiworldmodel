  failed: 11
  note: >-
    Not reached: the full texts of Jiang & Ding (2008) and Hui et al. (2011), the two pollen records that matter
    most (abstracts read from a library index instead); Ding et al. (2001) on the Jingchuan red clay section, which
    stands on this very spot; Qiang et al. (2011) on the Zhuanglang core; Kaakinen's thesis on Lantian; the Lexicon
    of Chinese strata's pages for the Lengshuigou and Koujiacun formations; an MDPI paper on the Ordos red clay;
    PMC's copy of a Zhuanglang clay-mineral paper. Longest: finding anything that speaks of this ground itself at
    13 Ma. It is a gap in the rock record, an erosion surface between Cretaceous-to-early-Cenozoic planation and
    red clay that starts at 8.1 Ma, so nearly the whole scene is carried from basins 130 to 370 km away.
