# The look book (docs/plans/RENDERING.md, step 0): the views a change to the renderer or to the generators' meshes is
# judged on, each a place, a time and a camera, as a link without its build. The clock is fixed in each, so that two
# shoots of one build draw the same picture. `npx tsx tools/look/look.ts shoot <dir>` shoots them, and
# viewer/test/e2e/frametime.spec.ts holds each to the frame-time budget on the reference GPU.

# The GPU the budget is for, as its driver names it (a pattern). A choice, to be made by whoever keeps the budget: the
# GPU of a laptop of a few years ago, which a visitor can be expected to have.
reference: Apple M1

